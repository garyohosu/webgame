<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>スタンプマーシュ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #071713;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: rgba(214, 255, 242, 0.14);
      --mint: #85ffd6;
      --gold: #ffd86e;
      --danger: #ff8a80;
      --mud: #201810;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #f6fff9; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; justify-content: center; }
    .app {
      width: min(100vw, 480px);
      height: 100dvh;
      padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 10px;
      background:
        radial-gradient(circle at 20% 10%, rgba(133,255,214,0.18), transparent 28%),
        radial-gradient(circle at 80% 0%, rgba(255,216,110,0.12), transparent 24%),
        linear-gradient(180deg, #0d2821, #071713 65%);
    }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.04em; }
    .subtitle { font-size: 0.8rem; color: rgba(246,255,249,0.72); }
    .hud {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 0.82rem;
      backdrop-filter: blur(10px);
    }
    .panel strong {
      display: block;
      margin-top: 2px;
      font-size: 1.04rem;
      color: #ffffff;
    }
    #field {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(214,255,242,0.18);
      background:
        radial-gradient(circle at 50% 120%, rgba(0,0,0,0.25), transparent 36%),
        linear-gradient(180deg, rgba(120,255,226,0.08), rgba(8,27,22,0.96));
      box-shadow: inset 0 -20px 60px rgba(0,0,0,0.22);
    }
    .ripple {
      position: absolute;
      width: 120px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(214,255,242,0.1);
      opacity: 0.4;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .seal {
      position: absolute;
      width: 74px;
      height: 74px;
      border: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      display: grid;
      place-items: center;
      color: #10211b;
      font-size: 1.45rem;
      font-weight: 900;
      user-select: none;
      transition: transform 0.08s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.28);
    }
    .seal.safe {
      background: radial-gradient(circle at 30% 28%, #fff7cb, var(--gold) 58%, #cf8f1e);
    }
    .seal.bad {
      background: radial-gradient(circle at 30% 28%, #ffe4dd, #ff968b 58%, #8f352b);
      color: #4f1710;
    }
    .seal:active { transform: translate(-50%, -50%) scale(0.94); }
    .status {
      min-height: 1.3em;
      font-size: 0.9rem;
      color: rgba(246,255,249,0.9);
    }
    .actions { display: flex; gap: 10px; }
    button, a {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 11px 14px;
      font-weight: 700;
    }
    button {
      background: linear-gradient(135deg, rgba(133,255,214,0.3), rgba(255,216,110,0.26));
      color: #052019;
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header>
      <h1>🪷 スタンプマーシュ</h1>
      <div class="subtitle">浮いた印章だけをタップし、ひび割れ印章を避けて60秒を乗り切る。</div>
    </header>

    <section class="hud">
      <div class="panel">SCORE<strong id="score">0</strong></div>
      <div class="panel">TIME<strong id="time">60.0</strong></div>
      <div class="panel">HI-SCORE<strong id="hiscore">0</strong></div>
      <div class="panel">LIFE / COMBO<strong id="lifeCombo">3 / x1.0</strong></div>
    </section>

    <section id="field" aria-label="game field">
      <div class="ripple" style="left:18%;top:24%"></div>
      <div class="ripple" style="left:72%;top:20%"></div>
      <div class="ripple" style="left:52%;top:52%"></div>
      <div class="ripple" style="left:25%;top:76%"></div>
      <div class="ripple" style="left:78%;top:72%"></div>
    </section>

    <div class="status" id="message">スタート後、安全な印章だけをタップ。取り逃がしや誤タップでライフが減ります。</div>

    <div class="actions">
      <button id="startBtn" type="button">スタート</button>
      <a href="../../">作品集へ戻る</a>
    </div>
  </main>

  <script>
  (() => {
    const KEY = 'stamp-marsh-hi-v1';
    const field = document.getElementById('field');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const hiEl = document.getElementById('hiscore');
    const lifeComboEl = document.getElementById('lifeCombo');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');

    let hiScore = Number(localStorage.getItem(KEY) || 0);
    hiEl.textContent = String(hiScore);

    let running = false;
    let score = 0;
    let life = 3;
    let combo = 0;
    let timeLeft = 60000;
    let lastTick = 0;
    let spawnAccum = 0;
    let seals = [];
    let idSeed = 0;

    const slots = [
      { x: 20, y: 20 }, { x: 50, y: 18 }, { x: 80, y: 22 },
      { x: 30, y: 40 }, { x: 68, y: 38 },
      { x: 18, y: 60 }, { x: 50, y: 58 }, { x: 82, y: 62 },
      { x: 30, y: 80 }, { x: 68, y: 78 }
    ];

    function updateHud() {
      scoreEl.textContent = String(score);
      timeEl.textContent = (timeLeft / 1000).toFixed(1);
      lifeComboEl.textContent = `${life} / x${(1 + combo * 0.1).toFixed(1)}`;
    }

    function phase() {
      const elapsed = 60000 - timeLeft;
      if (elapsed < 30000) return { spawn: 850, lifetime: 2100, badRate: 0.18, burst: 0 };
      if (elapsed < 45000) return { spawn: 650, lifetime: 1700, badRate: 0.28, burst: 0.24 };
      return { spawn: 470, lifetime: 1320, badRate: 0.38, burst: 0.45 };
    }

    function resetGame() {
      seals.forEach((seal) => seal.el.remove());
      seals = [];
      score = 0;
      life = 3;
      combo = 0;
      timeLeft = 60000;
      spawnAccum = 0;
      running = true;
      messageEl.textContent = '安全印章で連鎖を伸ばそう。ひび割れ印章は触らない。';
      updateHud();
      lastTick = performance.now();
      requestAnimationFrame(loop);
    }

    function availableSlots() {
      const used = new Set(seals.map((seal) => seal.slotIndex));
      return slots.map((slot, index) => ({ slot, index })).filter((entry) => !used.has(entry.index));
    }

    function createSeal(kind, now, lifetime) {
      const openSlots = availableSlots();
      if (!openSlots.length) return;
      const choice = openSlots[Math.floor(Math.random() * openSlots.length)];
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `seal ${kind}`;
      button.dataset.id = String(++idSeed);
      button.dataset.kind = kind;
      button.style.left = `${choice.slot.x}%`;
      button.style.top = `${choice.slot.y}%`;
      button.textContent = kind === 'safe' ? '印' : '罠';
      field.appendChild(button);
      const seal = {
        id: button.dataset.id,
        slotIndex: choice.index,
        kind,
        born: now,
        lifetime,
        el: button
      };
      seals.push(seal);
    }

    function loseLife(reasonText) {
      life -= 1;
      combo = 0;
      messageEl.textContent = reasonText;
      updateHud();
      if (life <= 0) endGame('ライフ0');
    }

    function removeSealById(id) {
      const index = seals.findIndex((seal) => seal.id === id);
      if (index >= 0) {
        seals[index].el.remove();
        seals.splice(index, 1);
      }
    }

    function scoreForCombo() {
      return 1 + Math.min(4, Math.floor(combo / 4));
    }

    function tapSeal(target) {
      if (!running) return;
      const id = target.dataset.id;
      const kind = target.dataset.kind;
      if (!id || !kind) return;

      if (kind === 'safe') {
        combo += 1;
        score += scoreForCombo();
        messageEl.textContent = combo >= 5 ? `連鎖中 x${(1 + combo * 0.1).toFixed(1)}。沼の流れに乗れている。` : '安全印章成功。テンポを維持。';
      } else {
        loseLife('ひび割れ印章を踏んだ。ライフ減少。');
      }

      removeSealById(id);
      updateHud();
    }

    function endGame(reason) {
      running = false;
      seals.forEach((seal) => seal.el.remove());
      seals = [];
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem(KEY, String(hiScore));
        hiEl.textContent = String(hiScore);
        messageEl.textContent = `ゲーム終了（${reason}）。新記録 ${score} 点。`;
      } else {
        messageEl.textContent = `ゲーム終了（${reason}）。スコア ${score} 点。`;
      }
    }

    function updateSeals(now) {
      const nextSeals = [];
      for (const seal of seals) {
        const age = now - seal.born;
        const progress = Math.min(1, age / seal.lifetime);
        const bob = Math.sin(age / 170) * 4;
        const scale = seal.kind === 'safe' ? 1 - progress * 0.22 : 1 - progress * 0.3;
        seal.el.style.transform = `translate(-50%, calc(-50% + ${bob}px)) scale(${scale})`;
        seal.el.style.opacity = String(1 - progress * 0.68);

        if (age < seal.lifetime) {
          nextSeals.push(seal);
          continue;
        }

        seal.el.remove();
        if (seal.kind === 'safe' && running) loseLife('安全印章を取り逃がした。ライフ減少。');
        if (!running) break;
      }
      seals = running ? nextSeals : [];
    }

    function spawnSeals(dt, now, diff) {
      spawnAccum += dt;
      while (spawnAccum >= diff.spawn) {
        spawnAccum -= diff.spawn;
        createSeal(Math.random() < diff.badRate ? 'bad' : 'safe', now, diff.lifetime);
        if (Math.random() < diff.burst) createSeal(Math.random() < diff.badRate ? 'bad' : 'safe', now, diff.lifetime);
      }
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(40, now - lastTick);
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateHud();
        endGame('時間切れ');
        return;
      }

      const diff = phase();
      spawnSeals(dt, now, diff);
      updateSeals(now);
      if (!running) return;
      updateHud();
      lastTick = now;
      requestAnimationFrame(loop);
    }

    document.getElementById('app').addEventListener('pointerdown', (event) => {
      const seal = event.target.closest('.seal');
      if (seal) {
        event.preventDefault();
        tapSeal(seal);
      }
    }, { passive: false });

    startBtn.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      resetGame();
    }, { passive: false });

    updateHud();
  })();
  </script>
</body>
</html>
