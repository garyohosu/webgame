<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>カラーカレント</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #090b19; color: #f5f7ff; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; justify-content: center; }
    .app {
      width: min(100vw, 480px);
      height: 100dvh;
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 10px;
      background: radial-gradient(circle at 20% 0%, #1b2250, #090b19 55%);
    }
    h1 { margin: 0; font-size: 1.3rem; letter-spacing: .04em; }
    .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 8px 10px; font-size: .88rem; }
    .panel strong { display: block; font-size: 1rem; margin-top: 2px; }
    #field {
      position: relative;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.2);
      background: linear-gradient(180deg, rgba(17,23,56,.9), rgba(7,9,20,.95));
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255,255,255,.45);
    }
    .p-blue { background: #41b3ff; }
    .p-pink { background: #ff5fb0; }
    .gate {
      height: 54px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.22);
      display: grid;
      place-items: center;
      font-weight: 700;
      letter-spacing: .06em;
      user-select: none;
    }
    .gate.blue { background: rgba(65,179,255,.28); color: #9ad8ff; }
    .gate.pink { background: rgba(255,95,176,.25); color: #ffb5db; }
    .actions { display: flex; gap: 10px; }
    button, a {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.1);
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      font-weight: 700;
      text-align: center;
      flex: 1;
    }
    button:active { transform: scale(.98); }
    #message { font-size: .9rem; opacity: .9; min-height: 1.3em; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <h1>🌊 カラーカレント</h1>

    <section class="hud">
      <div class="panel">SCORE<strong id="score">0</strong></div>
      <div class="panel">TIME<strong id="time">60.0</strong></div>
      <div class="panel">HI-SCORE<strong id="hiscore">0</strong></div>
      <div class="panel">LIFE<strong id="life">3</strong></div>
    </section>

    <section id="field" aria-label="game field"></section>

    <div class="gate blue" id="gate">GATE: BLUE（タップで切替）</div>

    <div class="actions">
      <button id="startBtn" type="button">スタート</button>
      <a href="../../">作品集へ戻る</a>
    </div>
    <div id="message">スタート後、画面タップでゲート色を切り替え。</div>
  </main>

<script>
(() => {
  const KEY = 'color-current-hi-v1';
  const field = document.getElementById('field');
  const gateEl = document.getElementById('gate');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const lifeEl = document.getElementById('life');
  const hiEl = document.getElementById('hiscore');
  const msgEl = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');

  let hi = Number(localStorage.getItem(KEY) || 0);
  hiEl.textContent = hi;

  let running = false;
  let score = 0;
  let life = 3;
  let gate = 'blue';
  let leftMs = 60000;
  let particles = [];
  let spawnAcc = 0;
  let last = 0;

  function setGate(next) {
    gate = next;
    gateEl.className = `gate ${gate}`;
    gateEl.textContent = `GATE: ${gate.toUpperCase()}（タップで切替）`;
  }

  function resetGame() {
    running = true;
    score = 0;
    life = 3;
    leftMs = 60000;
    particles = [];
    spawnAcc = 0;
    scoreEl.textContent = '0';
    lifeEl.textContent = '3';
    timeEl.textContent = '60.0';
    msgEl.textContent = '同じ色を通して得点、違う色はダメージ。';
    field.innerHTML = '';
    setGate('blue');
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function difficulty() {
    const t = 60000 - leftMs;
    if (t < 30000) return { speed: 140, spawn: 680, pinkBias: 0.46 };
    if (t < 45000) return { speed: 190, spawn: 500, pinkBias: 0.5 };
    return { speed: 245, spawn: 370, pinkBias: 0.55 };
  }

  function spawnParticle(diff) {
    const rect = field.getBoundingClientRect();
    const type = Math.random() < diff.pinkBias ? 'pink' : 'blue';
    const p = {
      id: Math.random().toString(36).slice(2),
      x: 14 + Math.random() * Math.max(1, rect.width - 28),
      y: -12,
      v: diff.speed + Math.random() * 50,
      type,
      el: document.createElement('div')
    };
    p.el.className = `particle p-${type}`;
    field.appendChild(p.el);
    particles.push(p);
  }

  function hitBottom(p, rectH) {
    if (p.y < rectH - 18) return false;
    if (p.type === gate) score += 1;
    else life -= 1;
    scoreEl.textContent = String(score);
    lifeEl.textContent = String(life);
    return true;
  }

  function endGame(reason) {
    running = false;
    if (score > hi) {
      hi = score;
      localStorage.setItem(KEY, String(hi));
      hiEl.textContent = String(hi);
      msgEl.textContent = `ゲーム終了（${reason}） 新記録 ${score}！`;
    } else {
      msgEl.textContent = `ゲーム終了（${reason}） スコア ${score}`;
    }
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(40, now - last);
    last = now;
    leftMs -= dt;
    if (leftMs <= 0) {
      timeEl.textContent = '0.0';
      endGame('時間切れ');
      return;
    }
    timeEl.textContent = (leftMs / 1000).toFixed(1);

    const diff = difficulty();
    spawnAcc += dt;
    while (spawnAcc >= diff.spawn) {
      spawnAcc -= diff.spawn;
      spawnParticle(diff);
      if (leftMs < 15000 && Math.random() < 0.25) spawnParticle(diff);
    }

    const h = field.clientHeight;
    particles = particles.filter((p) => {
      p.y += (p.v * dt) / 1000;
      p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      const consumed = hitBottom(p, h);
      if (consumed || p.y > h + 30) p.el.remove();
      return !consumed && p.y <= h + 30;
    });

    if (life <= 0) {
      endGame('ライフ0');
      return;
    }
    requestAnimationFrame(loop);
  }

  function toggleGate() {
    if (!running) return;
    setGate(gate === 'blue' ? 'pink' : 'blue');
  }

  document.getElementById('app').addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || e.target.closest('a')) return;
    toggleGate();
  }, { passive: true });

  gateEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    toggleGate();
  }, { passive: false });

  startBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resetGame();
  }, { passive: false });
})();
</script>
</body>
</html>
