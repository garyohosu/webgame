<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>オービットスイープ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg1:#081024;
      --bg2:#111d3f;
      --panel:#131f45;
      --line:#3f5da1;
      --text:#edf3ff;
      --good:#77f7d9;
      --bad:#ff759f;
      --accent:#ffd778;
    }
    * { box-sizing:border-box; margin:0; user-select:none; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
      font-family:"Noto Sans JP", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 10%, var(--bg2), var(--bg1) 62%);
      color:var(--text);
    }
    .app {
      width:min(100vw, 430px);
      height:100dvh;
      margin:0 auto;
      padding:12px;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:10px;
    }
    .head { display:flex; justify-content:space-between; align-items:center; }
    .title { font-weight:800; letter-spacing:.04em; }
    .back {
      text-decoration:none; color:#add0ff; border:1px solid #4f73ce;
      border-radius:999px; padding:4px 10px; font-size:13px;
    }
    .hud {
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
      padding:8px 10px; border-radius:12px;
      background:rgba(19,31,69,.88); border:1px solid var(--line);
      text-align:center;
    }
    .label { font-size:10px; opacity:.82; }
    .value { font-size:18px; font-weight:800; line-height:1.2; }
    .field {
      position:relative;
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(180deg, rgba(20,32,70,.9), rgba(7,13,30,.95));
      overflow:hidden;
    }
    .ring {
      position:absolute; left:50%; top:58%; transform:translate(-50%,-50%) rotate(0deg);
      width:min(66vw,270px); aspect-ratio:1/1; border-radius:50%;
      border:2px solid rgba(255,255,255,.18);
      box-shadow:0 0 16px rgba(0,0,0,.35);
    }
    .sweep {
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(0deg);
      width:100%; height:100%; border-radius:50%;
    }
    .sweep::before {
      content:""; position:absolute; left:50%; top:50%; transform-origin:0 0;
      width:46%; height:12px; border-radius:999px;
      background:linear-gradient(90deg, rgba(255,215,120,.15), var(--accent));
      transform:translateY(-50%);
      box-shadow:0 0 14px rgba(255,215,120,.5);
    }
    .core {
      position:absolute; width:16px; height:16px; border-radius:50%;
      box-shadow:0 0 10px rgba(255,255,255,.36);
    }
    .core.good { background:var(--good); }
    .core.bad { background:var(--bad); }
    .overlay {
      position:absolute; inset:0; display:grid; place-items:center; text-align:center;
      padding:16px; background:linear-gradient(180deg, rgba(8,14,30,.72), rgba(8,14,30,.9));
    }
    .overlay h1 { font-size:30px; margin-bottom:8px; }
    .overlay p { font-size:13px; line-height:1.6; margin-bottom:14px; }
    .start {
      border:none; border-radius:999px; padding:12px 28px;
      font-size:16px; font-weight:800; color:#06253a;
      background:linear-gradient(135deg, #7ce9ff, #91ffc9);
    }
    .tip { text-align:center; font-size:12px; opacity:.82; }
    .flash {
      position:absolute; inset:0; opacity:0; pointer-events:none;
      transition:opacity .1s linear;
    }
    .flash.good { background:radial-gradient(circle, rgba(119,247,217,.22), transparent 56%); }
    .flash.bad { background:radial-gradient(circle, rgba(255,117,159,.22), transparent 56%); }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="head">
      <div class="title">🛰️ オービットスイープ</div>
      <a class="back" href="../../">← 戻る</a>
    </div>

    <div class="hud">
      <div><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div><div class="label">TIME</div><div class="value" id="time">60</div></div>
      <div><div class="label">HI</div><div class="value" id="hi">0</div></div>
      <div><div class="label">LV</div><div class="value" id="lv">1</div></div>
    </div>

    <div class="field" id="field">
      <div class="ring" id="ring"><div class="sweep" id="sweep"></div></div>
      <div class="flash good" id="flashGood"></div>
      <div class="flash bad" id="flashBad"></div>
      <div class="overlay" id="overlay">
        <div>
          <h1>Orbit Sweep</h1>
          <p>タップでスイープ角度を切替。<br>青コアを拾い、赤ノイズを避ける。</p>
          <button class="start" id="startBtn">START</button>
        </div>
      </div>
    </div>

    <div class="tip">画面タップでスイーパー回転（pointerdown）</div>
  </div>

  <script>
    (() => {
      const KEY = 'orbit-sweep-hi-v1';
      const app = document.getElementById('app');
      const field = document.getElementById('field');
      const ring = document.getElementById('ring');
      const sweep = document.getElementById('sweep');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const hiEl = document.getElementById('hi');
      const lvEl = document.getElementById('lv');
      const flashGood = document.getElementById('flashGood');
      const flashBad = document.getElementById('flashBad');

      const angles = [0, 45, 90, 135, 180, 225, 270, 315];
      let angleIdx = 0;
      let running = false;
      let score = 0;
      let left = 60;
      let hi = Number(localStorage.getItem(KEY) || 0);
      let last = 0;
      let timerAcc = 0;
      let spawnAcc = 0;
      let cores = [];

      hiEl.textContent = String(hi);

      function params() {
        if (left > 30) return { lv:1, speed:130, spawn:0.8, badRate:0.24, max:8 };
        if (left > 15) return { lv:2, speed:165, spawn:0.6, badRate:0.34, max:10 };
        return { lv:3, speed:210, spawn:0.45, badRate:0.44, max:12 };
      }

      function updateHud() {
        scoreEl.textContent = String(score);
        timeEl.textContent = String(left);
        lvEl.textContent = String(params().lv);
      }

      function flash(el) {
        el.style.opacity = '1';
        setTimeout(() => { el.style.opacity = '0'; }, 90);
      }

      function rotateSweep() {
        angleIdx = (angleIdx + 1) % angles.length;
        sweep.style.transform = `translate(-50%, -50%) rotate(${angles[angleIdx]}deg)`;
      }

      function spawnCore() {
        const p = params();
        if (cores.length >= p.max) return;
        const w = field.clientWidth;
        const x = 14 + Math.random() * (w - 28);
        const bad = Math.random() < p.badRate;
        const el = document.createElement('div');
        el.className = `core ${bad ? 'bad' : 'good'}`;
        field.appendChild(el);
        cores.push({ el, x, y: -18, vy: p.speed, bad, r: 8, gone: false });
      }

      function hitSweep(c) {
        const fw = field.clientWidth;
        const fh = field.clientHeight;
        const cx = fw * 0.5;
        const cy = fh * 0.58;
        const dx = c.x - cx;
        const dy = c.y - cy;
        const d = Math.hypot(dx, dy);
        const radius = Math.min(fw * 0.66, 270) * 0.5;
        if (d < radius - 18 || d > radius + 16) return false;

        const coreAngle = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
        const sweepAngle = angles[angleIdx];
        let diff = Math.abs(coreAngle - sweepAngle);
        if (diff > 180) diff = 360 - diff;
        return diff < 24;
      }

      function removeCore(c) {
        c.gone = true;
        c.el.remove();
      }

      function endGame() {
        running = false;
        if (score > hi) {
          hi = score;
          localStorage.setItem(KEY, String(hi));
          hiEl.textContent = String(hi);
        }
        overlay.innerHTML = `<div><h1>TIME UP</h1><p>Score: ${score}<br>Hi: ${hi}</p><button class="start" id="startBtn">RETRY</button></div>`;
        overlay.style.display = 'grid';
        overlay.querySelector('#startBtn').addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          begin();
        }, { passive: true });
      }

      function frame(ts) {
        if (!running) return;
        const dt = Math.min(0.033, (ts - last) / 1000 || 0);
        last = ts;

        timerAcc += dt;
        spawnAcc += dt;

        while (timerAcc >= 1) {
          timerAcc -= 1;
          left -= 1;
          if (left <= 0) {
            left = 0;
            updateHud();
            endGame();
            return;
          }
        }

        const p = params();
        if (spawnAcc >= p.spawn) {
          spawnAcc = 0;
          spawnCore();
        }

        for (const c of cores) {
          if (c.gone) continue;
          c.vy = p.speed;
          c.y += c.vy * dt;

          if (hitSweep(c)) {
            if (c.bad) {
              score = Math.max(0, score - 4);
              flash(flashBad);
            } else {
              score += 8;
              flash(flashGood);
            }
            removeCore(c);
            continue;
          }

          if (c.y > field.clientHeight + 24) {
            removeCore(c);
            continue;
          }

          c.el.style.transform = `translate(${c.x - c.r}px, ${c.y - c.r}px)`;
        }

        cores = cores.filter(c => !c.gone);
        updateHud();
        requestAnimationFrame(frame);
      }

      function begin() {
        cores.forEach(c => c.el.remove());
        cores = [];
        angleIdx = 0;
        sweep.style.transform = 'translate(-50%, -50%) rotate(0deg)';
        score = 0;
        left = 60;
        timerAcc = 0;
        spawnAcc = 0;
        running = true;
        updateHud();
        overlay.style.display = 'none';
        last = performance.now();
        requestAnimationFrame(frame);
      }

      app.addEventListener('pointerdown', () => {
        if (!running) return;
        rotateSweep();
      }, { passive: true });

      startBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        begin();
      }, { passive: true });

      updateHud();
    })();
  </script>
</body>
</html>
