<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>パルスラダー</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161"
       crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #080b1f;
      --panel: #131a3a;
      --line: #2f3d7a;
      --text: #eef2ff;
      --sub: #9aa8de;
      --good: #65d8ff;
      --bad: #ff6788;
      --cursor: #ffe07a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% -10%, #1b2b66, var(--bg) 60%);
      color: var(--text);
      font-family: "Noto Sans JP", system-ui, sans-serif;
    }
    body { display: flex; justify-content: center; }

    .app {
      width: min(100vw, 460px);
      height: 100dvh;
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }
    .top {
      border: 1px solid var(--line);
      background: rgba(19, 26, 58, .86);
      border-radius: 14px;
      padding: 10px;
    }
    .title { font-weight: 800; letter-spacing: .04em; }
    .hint { margin-top: 4px; color: var(--sub); font-size: 12px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      border: 1px solid var(--line);
      background: rgba(19, 26, 58, .86);
      border-radius: 12px;
      text-align: center;
      padding: 7px;
    }
    .label { font-size: 11px; color: var(--sub); }
    .value { font-size: 20px; font-weight: 800; margin-top: 2px; }

    .arena {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #11183a, #0b1230 65%, #0a1028);
      overflow: hidden;
      touch-action: manipulation;
      display: grid;
      grid-template-rows: repeat(4, 1fr);
    }
    .lane {
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .lane:last-child { border-bottom: none; }

    .target {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
      pointer-events: none;
    }
    .target.good {
      color: var(--good);
      background: radial-gradient(circle at 35% 30%, #f0feff 0 28%, #83e8ff 54%, #2e8bff 100%);
    }
    .target.bad {
      color: var(--bad);
      background: radial-gradient(circle at 35% 30%, #ffe3eb 0 28%, #ff8aa4 52%, #d82a53 100%);
    }

    .cursor {
      position: absolute;
      left: 4px;
      right: 4px;
      height: calc(25% - 6px);
      border: 2px solid rgba(255,224,122,.95);
      border-radius: 12px;
      box-shadow: 0 0 14px rgba(255,224,122,.35), inset 0 0 10px rgba(255,224,122,.16);
      pointer-events: none;
      transition: border-color .12s;
    }
    .cursor.hit { border-color: #8affbd; }
    .cursor.miss { border-color: #ff7b97; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 11, 28, .62);
      padding: 20px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.show { opacity: 1; }
    .overlay-card {
      width: 100%;
      max-width: 290px;
      border: 1px solid #3a4e96;
      border-radius: 15px;
      background: rgba(11, 18, 45, .92);
      padding: 14px;
    }
    .overlay-title { font-weight: 800; margin-bottom: 8px; }
    .overlay-sub { color: var(--sub); font-size: 13px; line-height: 1.45; }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #4ea8ff, #8a73ff);
    }
    .back {
      text-decoration: none;
      color: var(--sub);
      font-size: 13px;
      padding: 6px 4px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="title">🪜 パルスラダー</div>
      <div class="hint">タップで現在段を刈り取り：青+1 / 赤-2 / 空振り-1</div>
    </section>

    <section class="stats">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">TIME</div><div class="value" id="time">60.0</div></div>
      <div class="stat"><div class="label">HI</div><div class="value" id="hi">0</div></div>
    </section>

    <section class="arena" id="arena" aria-label="game area">
      <div class="lane" data-lane="0"></div>
      <div class="lane" data-lane="1"></div>
      <div class="lane" data-lane="2"></div>
      <div class="lane" data-lane="3"></div>
      <div class="cursor" id="cursor"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="overlayTitle">60秒の段取り勝負</div>
          <div class="overlay-sub" id="overlaySub">往復カーソルの段でタップ。青を拾って赤を避けろ。</div>
        </div>
      </div>
    </section>

    <section class="footer">
      <button id="startBtn" type="button">スタート</button>
      <a class="back" href="../../">← 戻る</a>
    </section>
  </main>

<script>
(() => {
  const TOTAL_MS = 60000;
  const LANE_COUNT = 4;
  const STORAGE_KEY = 'pulse-ladder-hi-v1';

  const arena = document.getElementById('arena');
  const lanes = [...arena.querySelectorAll('.lane')];
  const cursor = document.getElementById('cursor');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const hiEl = document.getElementById('hi');
  const startBtn = document.getElementById('startBtn');

  let hi = Number(localStorage.getItem(STORAGE_KEY) || 0);
  let score = 0;
  let running = false;
  let startAt = 0;
  let prevTs = 0;
  let spawnAcc = 0;
  let rafId = 0;

  let cursorLane = 0;
  let cursorDir = 1;
  let cursorMoveAcc = 0;
  const targets = [];

  hiEl.textContent = hi;
  overlay.classList.add('show');

  function phaseConfig(elapsedMs) {
    if (elapsedMs < 30000) return { spawnMs: 780, badRate: 0.24, cursorStepMs: 360 };
    if (elapsedMs < 45000) return { spawnMs: 600, badRate: 0.32, cursorStepMs: 300 };
    return { spawnMs: 470, badRate: 0.4, cursorStepMs: 240 };
  }

  function clampScore(value) {
    return Math.max(0, value);
  }

  function setCursorVisual(state) {
    cursor.classList.remove('hit', 'miss');
    if (state) cursor.classList.add(state);
    if (state) {
      setTimeout(() => cursor.classList.remove(state), 120);
    }
  }

  function updateCursorPosition() {
    const laneHeight = arena.clientHeight / LANE_COUNT;
    const top = cursorLane * laneHeight + 3;
    cursor.style.top = `${top}px`;
  }

  function spawnTarget(elapsedMs) {
    const cfg = phaseConfig(elapsedMs);
    const lane = Math.floor(Math.random() * LANE_COUNT);
    const kind = Math.random() < cfg.badRate ? 'bad' : 'good';
    const x = 16 + Math.random() * 68;

    const node = document.createElement('div');
    node.className = `target ${kind}`;
    node.style.left = `${x}%`;
    lanes[lane].appendChild(node);

    targets.push({ lane, kind, bornAt: elapsedMs, lifeMs: 1350, node });
  }

  function cleanupTargets(elapsedMs) {
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      const age = elapsedMs - t.bornAt;
      if (age >= t.lifeMs) {
        t.node.remove();
        targets.splice(i, 1);
      } else {
        const alpha = 1 - (age / t.lifeMs);
        const scale = 0.82 + alpha * 0.32;
        t.node.style.opacity = alpha.toFixed(3);
        t.node.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(3)})`;
      }
    }
  }

  function judgeCurrentLane() {
    if (!running) return;

    let gained = 0;
    let touched = 0;

    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (t.lane !== cursorLane) continue;
      touched++;
      gained += t.kind === 'good' ? 1 : -2;
      t.node.remove();
      targets.splice(i, 1);
    }

    if (!touched) gained -= 1;

    score = clampScore(score + gained);
    scoreEl.textContent = score;
    setCursorVisual(gained >= 0 ? 'hit' : 'miss');
  }

  function updateCursor(deltaMs, elapsedMs) {
    const cfg = phaseConfig(elapsedMs);
    cursorMoveAcc += deltaMs;

    while (cursorMoveAcc >= cfg.cursorStepMs) {
      cursorMoveAcc -= cfg.cursorStepMs;
      cursorLane += cursorDir;
      if (cursorLane >= LANE_COUNT - 1) {
        cursorLane = LANE_COUNT - 1;
        cursorDir = -1;
      } else if (cursorLane <= 0) {
        cursorLane = 0;
        cursorDir = 1;
      }
      updateCursorPosition();
    }
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(rafId);

    if (score > hi) {
      hi = score;
      localStorage.setItem(STORAGE_KEY, String(hi));
      hiEl.textContent = hi;
      overlayTitle.textContent = 'ハイスコア更新！';
      overlaySub.textContent = `新記録 ${score}。もう一度でさらに段取り精度を上げよう。`;
    } else {
      overlayTitle.textContent = `スコア ${score}`;
      overlaySub.textContent = `ハイスコア ${hi}。赤段の巻き込みを減らすと伸びる。`;
    }

    overlay.classList.add('show');
    startBtn.textContent = 'もう一回';
  }

  function resetGame() {
    score = 0;
    scoreEl.textContent = '0';
    timeEl.textContent = '60.0';
    cursorLane = 0;
    cursorDir = 1;
    cursorMoveAcc = 0;
    spawnAcc = 0;

    for (const t of targets) t.node.remove();
    targets.length = 0;

    updateCursorPosition();
    setCursorVisual(null);
  }

  function tick(ts) {
    if (!running) return;

    if (!prevTs) prevTs = ts;
    const deltaMs = ts - prevTs;
    prevTs = ts;

    const elapsedMs = ts - startAt;
    const remain = Math.max(0, TOTAL_MS - elapsedMs);

    updateCursor(deltaMs, elapsedMs);

    const cfg = phaseConfig(elapsedMs);
    spawnAcc += deltaMs;
    while (spawnAcc >= cfg.spawnMs) {
      spawnAcc -= cfg.spawnMs;
      spawnTarget(elapsedMs);
    }

    cleanupTargets(elapsedMs);
    timeEl.textContent = (remain / 1000).toFixed(1);

    if (remain <= 0) {
      endGame();
      return;
    }

    rafId = requestAnimationFrame(tick);
  }

  function startGame() {
    resetGame();
    running = true;
    overlay.classList.remove('show');
    startBtn.textContent = 'プレイ中';
    startAt = performance.now();
    prevTs = 0;
    rafId = requestAnimationFrame(tick);
  }

  arena.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    judgeCurrentLane();
  });

  startBtn.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    if (running) return;
    startGame();
  });

  updateCursorPosition();
})();
</script>
</body>
</html>
