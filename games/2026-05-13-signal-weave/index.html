<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>シグナルウィーブ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden;background:#090b16;color:#eaf1ff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
    .wrap{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}
    .hud{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
    .title{font-weight:800;letter-spacing:.04em}
    .pill{background:#151a2e;border:1px solid #2a335a;border-radius:999px;padding:6px 10px;font-size:13px}
    #start{border:none;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#5eead4,#60a5fa);color:#081018;font-weight:800}
    #game{position:relative;flex:1;border:1px solid #2a335a;border-radius:16px;background:radial-gradient(circle at 50% -10%,#1b2550 0,#0d1328 45%,#0a0f1d 100%);overflow:hidden}
    .lane{position:absolute;top:0;bottom:0;width:2px;background:rgba(157,180,255,.15)}
    .lane:nth-child(1){left:33.33%}.lane:nth-child(2){left:66.66%}
    #catcher{position:absolute;bottom:14px;width:26%;height:14px;border-radius:10px;background:#67e8f9;box-shadow:0 0 16px rgba(103,232,249,.7);transform:translateX(-50%);left:16.66%;transition:left .08s linear}
    .orb{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%)}
    .good{background:#4ade80;box-shadow:0 0 16px rgba(74,222,128,.7)}
    .bad{background:#fb7185;box-shadow:0 0 16px rgba(251,113,133,.75)}
    .msg{font-size:12px;opacity:.85;text-align:center;min-height:18px}
    a{color:#93c5fd;text-decoration:none;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="title">シグナルウィーブ</div>
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Time: <span id="time">60.0</span></div>
    </div>
    <div class="hud" style="grid-template-columns:1fr auto">
      <div class="pill">Hi: <span id="hi">0</span></div>
      <button id="start">START</button>
    </div>
    <div id="game"><div class="lane"></div><div class="lane"></div><div id="catcher"></div></div>
    <div class="msg" id="msg">タップでレーンを巡回して青を取る。赤と取り逃しは減点。</div>
    <a href="../../">← 戻る</a>
  </div>
<script>
(() => {
  const KEY='signal-weave-hi-v1';
  const game=document.getElementById('game'),startBtn=document.getElementById('start');
  const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),hiEl=document.getElementById('hi'),msgEl=document.getElementById('msg');
  const catcher=document.getElementById('catcher');
  const lanes=[16.66,50,83.33];
  let lane=0,score=0,hi=Number(localStorage.getItem(KEY)||0),running=false,last=0,remain=60,spawnTick=0,orbs=[];
  hiEl.textContent=hi;
  const setLane=()=>{catcher.style.left=lanes[lane]+'%'}; setLane();
  function reset(){score=0;remain=60;spawnTick=0;orbs.forEach(o=>o.el.remove());orbs=[];scoreEl.textContent=0;timeEl.textContent='60.0';msgEl.textContent='タップでレーンを巡回して青を取る。赤と取り逃しは減点。';}
  function spawn(){const t=60-remain;const speed=t<30?110:t<45?132:160;const redRate=t<30?0.26:t<45?0.34:0.42;const count=t<45?(Math.random()<0.2?2:1):(Math.random()<0.45?2:3);
    for(let i=0;i<count;i++){const li=Math.floor(Math.random()*3);const good=Math.random()>redRate;const el=document.createElement('div');el.className='orb '+(good?'good':'bad');el.style.left=lanes[li]+'%';el.style.top='-6%';game.appendChild(el);orbs.push({el,lane:li,good,y:-20,speed:speed*(0.9+Math.random()*0.2)});}}
  function end(){running=false;startBtn.disabled=false;startBtn.textContent='RETRY';if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));hiEl.textContent=hi;msgEl.textContent='ハイスコア更新';}else{msgEl.textContent='終了。もう1回';}}
  function loop(ts){if(!running)return; if(!last)last=ts; const dt=(ts-last)/1000; last=ts; remain-=dt; spawnTick+=dt;
    const interval=remain>30?0.62:remain>15?0.48:0.36; if(spawnTick>=interval){spawn();spawnTick=0;}
    const h=game.clientHeight;
    for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];o.y+=o.speed*dt; o.el.style.top=(o.y/h*100)+'%'; if(o.y>h-26){ if(o.lane===lane){score+=o.good?10:-12;} else if(o.good){score-=6;} scoreEl.textContent=score; o.el.remove();orbs.splice(i,1);} }
    timeEl.textContent=Math.max(0,remain).toFixed(1); if(remain<=0){end();return;} requestAnimationFrame(loop);
  }
  game.addEventListener('pointerdown',()=>{if(!running)return;lane=(lane+1)%3;setLane();},{passive:true});
  startBtn.addEventListener('pointerdown',()=>{if(running)return;reset();running=true;last=0;startBtn.disabled=true;startBtn.textContent='RUNNING';requestAnimationFrame(loop);},{passive:true});
})();
</script>
</body>
</html>
