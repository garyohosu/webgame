<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>ビーコンスイープ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #070b17;
      --panel: #111a2e;
      --line: #263453;
      --text: #eaf2ff;
      --good: #6de7ff;
      --bad: #ff6f91;
      --accent: #8cffb1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: radial-gradient(circle at 30% 15%, #1a2a4d 0%, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; overflow: hidden; }
    .wrap { width: min(100vw, 430px); height: 100dvh; margin: 0 auto; display: grid; grid-template-rows: auto auto 1fr auto auto; padding: 10px 12px 14px; gap: 10px; }
    h1 { margin: 0; font-size: 1.3rem; letter-spacing: .04em; }
    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: color-mix(in oklab, var(--panel) 88%, #fff 12%); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; text-align: center; }
    .label { font-size: .68rem; opacity: .8; }
    .value { font-size: 1.1rem; font-weight: 700; }
    #startBtn { width: 100%; border: 0; border-radius: 12px; padding: 11px 12px; font-size: 1rem; font-weight: 700; color: #06220f; background: linear-gradient(135deg, #8cffb1, #6de7ff); }
    #game {
      position: relative;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #0a1326 0%, #0b1d3d 65%, #102345 100%);
      overflow: hidden;
      touch-action: manipulation;
    }
    .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; font-weight: 700; line-height: 1.6; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
    .drop { position: absolute; width: 28px; height: 28px; border-radius: 50%; }
    .drop.good { background: radial-gradient(circle at 30% 28%, #fff 0%, var(--good) 45%, #2ba7c2 100%); box-shadow: 0 0 14px rgba(109,231,255,.55); }
    .drop.bad { background: radial-gradient(circle at 30% 28%, #ffd3df 0%, var(--bad) 45%, #b62f55 100%); box-shadow: 0 0 14px rgba(255,111,145,.45); }
    .beacon {
      position: absolute; bottom: 14px; width: 64px; height: 14px; border-radius: 999px;
      background: linear-gradient(90deg, #dbfff0 0%, var(--accent) 70%);
      box-shadow: 0 0 20px rgba(140,255,177,.65);
      transform: translateX(-50%);
    }
    .beam {
      position: absolute; bottom: 28px; width: 10px; height: 130px; transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(140,255,177,.65), rgba(140,255,177,0)); border-radius: 6px;
      filter: blur(.2px);
    }
    .hint { font-size: .78rem; opacity: .86; text-align: center; }
    .back { color: #c9d8ff; text-align: center; text-decoration: none; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>🛰️ ビーコンスイープ</h1>

    <section class="hud">
      <div class="stat"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
      <div class="stat"><div class="label">TIME</div><div id="time" class="value">60.0</div></div>
      <div class="stat"><div class="label">HI</div><div id="hi" class="value">0</div></div>
    </section>

    <button id="startBtn" type="button">START</button>

    <section id="game" aria-label="game area">
      <div id="msg" class="msg">タップでビーコンを一瞬停止<br>青を受けて、赤は避ける</div>
      <div id="beam" class="beam" hidden></div>
      <div id="beacon" class="beacon" hidden></div>
    </section>

    <p class="hint">操作: 画面のどこでもタップ（pointerdown）</p>
    <a class="back" href="../../">← 作品集へ戻る</a>
  </main>

  <script>
    (() => {
      const KEY = 'webgame-2026-03-24-beacon-sweep-hi';
      const game = document.getElementById('game');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const hiEl = document.getElementById('hi');
      const msgEl = document.getElementById('msg');
      const startBtn = document.getElementById('startBtn');
      const beaconEl = document.getElementById('beacon');
      const beamEl = document.getElementById('beam');

      let hi = Number(localStorage.getItem(KEY) || 0);
      hiEl.textContent = String(hi);

      let running = false;
      let score = 0;
      let left = 60;
      let last = 0;
      let spawnTimer = 0;
      let beaconX = 0.5;
      let beaconDir = 1;
      let beaconSpeed = 0.38;
      let freezeLeft = 0;
      let drops = [];
      let rafId = 0;

      function resetState() {
        score = 0;
        left = 60;
        spawnTimer = 0;
        beaconX = 0.5;
        beaconDir = 1;
        freezeLeft = 0;
        drops.forEach(d => d.el.remove());
        drops = [];
        scoreEl.textContent = '0';
        timeEl.textContent = '60.0';
      }

      function difficultyFactor(t) {
        if (t <= 15) return 1.6;
        if (t <= 30) return 1.3;
        return 1;
      }

      function spawnDrop() {
        const t = left;
        const hard = difficultyFactor(t);
        const isBad = Math.random() < (t <= 15 ? 0.38 : t <= 30 ? 0.3 : 0.22);
        const el = document.createElement('div');
        el.className = `drop ${isBad ? 'bad' : 'good'}`;
        game.appendChild(el);
        drops.push({
          el,
          x: 0.08 + Math.random() * 0.84,
          y: -0.08,
          v: (0.23 + Math.random() * 0.13) * hard,
          bad: isBad,
          hit: false,
        });
      }

      function renderBeacon() {
        const w = game.clientWidth;
        const xPx = beaconX * w;
        beaconEl.style.left = `${xPx}px`;
        beamEl.style.left = `${xPx}px`;
      }

      function pointHit(drop, beaconPx) {
        const w = game.clientWidth;
        const h = game.clientHeight;
        const dx = Math.abs(drop.x * w - beaconPx);
        const dy = Math.abs(drop.y * h - (h - 35));
        return dx < 36 && dy < 34;
      }

      function update(dt) {
        left = Math.max(0, left - dt);
        timeEl.textContent = left.toFixed(1);
        if (left <= 0) return endGame();

        const hard = difficultyFactor(left);
        beaconSpeed = 0.34 * hard;

        if (freezeLeft > 0) {
          freezeLeft -= dt;
        } else {
          beaconX += beaconDir * beaconSpeed * dt;
          if (beaconX >= 0.93) { beaconX = 0.93; beaconDir = -1; }
          if (beaconX <= 0.07) { beaconX = 0.07; beaconDir = 1; }
        }
        renderBeacon();

        spawnTimer -= dt;
        const spawnGap = 0.95 / hard;
        if (spawnTimer <= 0) {
          spawnTimer = spawnGap;
          spawnDrop();
        }

        const w = game.clientWidth;
        const h = game.clientHeight;
        const beaconPx = beaconX * w;

        drops = drops.filter(d => {
          d.y += d.v * dt;

          if (!d.hit && pointHit(d, beaconPx)) {
            d.hit = true;
            score += d.bad ? -2 : 1;
            if (score < 0) score = 0;
            scoreEl.textContent = String(score);
            d.el.remove();
            return false;
          }

          if (d.y > 1.08) {
            d.el.remove();
            return false;
          }

          d.el.style.left = `${d.x * w - 14}px`;
          d.el.style.top = `${d.y * h}px`;
          return true;
        });
      }

      function frame(ts) {
        if (!running) return;
        if (!last) last = ts;
        const dt = Math.min(0.033, (ts - last) / 1000);
        last = ts;
        update(dt);
        rafId = requestAnimationFrame(frame);
      }

      function startGame() {
        running = true;
        last = 0;
        msgEl.style.display = 'none';
        beaconEl.hidden = false;
        beamEl.hidden = false;
        startBtn.textContent = 'RETRY';
        resetState();
        renderBeacon();
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(frame);
      }

      function endGame() {
        running = false;
        cancelAnimationFrame(rafId);
        if (score > hi) {
          hi = score;
          localStorage.setItem(KEY, String(hi));
          hiEl.textContent = String(hi);
        }
        msgEl.innerHTML = `終了！<br>Score: ${score}<br>${score >= hi ? 'ハイスコア更新！' : 'もう一回挑戦'} `;
        msgEl.style.display = 'grid';
      }

      game.addEventListener('pointerdown', () => {
        if (!running) return;
        freezeLeft = 0.22;
      }, { passive: true });

      startBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        startGame();
      });

      window.addEventListener('resize', () => {
        if (!running) return;
        renderBeacon();
      });
    })();
  </script>
</body>
</html>
