<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ドリフトドラム</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Noto Sans JP", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1e365f, #0c1020 55%, #070910 100%);
      color: #eef4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    .app {
      width: min(100vw, 480px);
      height: 100dvh;
      padding: 14px 14px 10px;
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: .04em; }
    .hud {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
    }
    .panel {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }
    .label { font-size: .72rem; opacity: .8; }
    .value { font-size: 1.1rem; font-weight: 700; }
    .arena {
      position: relative;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.16);
      background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }
    canvas { width: min(82vw, 320px); height: min(82vw, 320px); max-width: 320px; max-height: 320px; }
    .hint { text-align: center; font-size: .85rem; opacity: .9; min-height: 1.2em; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button, a.back {
      height: 44px;
      border: 0;
      border-radius: 12px;
      font-size: .95rem;
      font-weight: 700;
      text-decoration: none;
      display: grid;
      place-items: center;
    }
    button {
      background: linear-gradient(135deg, #4ec4ff, #4f7dff);
      color: #061427;
    }
    button:active { transform: scale(.98); }
    a.back {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      color: #dfe9ff;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🥁 ドリフトドラム</h1>
    <section class="hud">
      <div class="panel"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="panel"><div class="label">TIME</div><div class="value" id="time">60.0</div></div>
      <div class="panel"><div class="label">HI</div><div class="value" id="hi">0</div></div>
    </section>
    <section class="arena" id="arena">
      <canvas id="cv" width="320" height="320" aria-label="game canvas"></canvas>
    </section>
    <div class="hint" id="hint">STARTで開始。青ゾーン中にタップで+1。</div>
    <section class="controls">
      <button id="startBtn" type="button">START</button>
      <a class="back" href="../../">← 戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const KEY = 'drift-drum-hi-v1';
      const totalMs = 60000;
      const canvas = document.getElementById('cv');
      const ctx = canvas.getContext('2d');
      const arena = document.getElementById('arena');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const hiEl = document.getElementById('hi');
      const hintEl = document.getElementById('hint');
      const startBtn = document.getElementById('startBtn');

      let hi = Number(localStorage.getItem(KEY) || 0);
      let running = false;
      let score = 0;
      let startTs = 0;
      let prevTs = 0;
      let needle = Math.random() * Math.PI * 2;
      let speed = 1.8;
      let safeCenter = Math.random() * Math.PI * 2;
      let safeArc = Math.PI / 3.2;
      let raf = 0;

      hiEl.textContent = String(hi);

      function normalizeRad(v) {
        let x = v % (Math.PI * 2);
        if (x < -Math.PI) x += Math.PI * 2;
        if (x > Math.PI) x -= Math.PI * 2;
        return x;
      }

      function inSafeZone() {
        const diff = Math.abs(normalizeRad(needle - safeCenter));
        return diff <= safeArc / 2;
      }

      function relocateSafe() {
        safeCenter = Math.random() * Math.PI * 2;
      }

      function difficulty(elapsed) {
        if (elapsed < 30000) return { speed: 1.9, arc: Math.PI / 3.2 };
        if (elapsed < 45000) return { speed: 2.5, arc: Math.PI / 4.1 };
        return { speed: 3.2, arc: Math.PI / 5.6 };
      }

      function drawFace() {
        const w = canvas.width, h = canvas.height;
        const cx = w / 2, cy = h / 2;
        const r = 120;
        ctx.clearRect(0, 0, w, h);

        const grad = ctx.createRadialGradient(cx, cy, 28, cx, cy, r + 20);
        grad.addColorStop(0, 'rgba(120,170,255,0.22)');
        grad.addColorStop(1, 'rgba(13,20,42,0.95)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 18;
        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 18;
        ctx.strokeStyle = '#4fd5ff';
        ctx.beginPath();
        ctx.arc(cx, cy, r, safeCenter - safeArc / 2, safeCenter + safeArc / 2);
        ctx.stroke();

        const nx = cx + Math.cos(needle) * (r - 6);
        const ny = cy + Math.sin(needle) * (r - 6);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#ffe17e';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(nx, ny);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx, cy, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      function finish() {
        running = false;
        cancelAnimationFrame(raf);
        if (score > hi) {
          hi = score;
          localStorage.setItem(KEY, String(hi));
          hiEl.textContent = String(hi);
          hintEl.textContent = '新記録！もう1回で更新を狙え。';
        } else {
          hintEl.textContent = `終了！スコア ${score}。`;
        }
        startBtn.textContent = 'RETRY';
      }

      function tick(ts) {
        if (!running) return;
        if (!prevTs) prevTs = ts;
        const dt = (ts - prevTs) / 1000;
        prevTs = ts;
        const elapsed = ts - startTs;
        const remain = Math.max(0, totalMs - elapsed);
        const d = difficulty(elapsed);
        speed = d.speed;
        safeArc = d.arc;

        needle += speed * dt;
        drawFace();
        timeEl.textContent = (remain / 1000).toFixed(1);

        if (remain <= 0) {
          finish();
          return;
        }
        raf = requestAnimationFrame(tick);
      }

      function start() {
        running = true;
        score = 0;
        scoreEl.textContent = '0';
        timeEl.textContent = '60.0';
        startBtn.textContent = 'PLAYING';
        hintEl.textContent = '青ゾーン中にタップ！';
        needle = Math.random() * Math.PI * 2;
        relocateSafe();
        startTs = performance.now();
        prevTs = 0;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(tick);
      }

      function onTap(e) {
        e.preventDefault();
        if (!running) return;
        if (inSafeZone()) {
          score += 1;
          hintEl.textContent = 'GOOD +1';
          relocateSafe();
        } else {
          score = Math.max(0, score - 1);
          hintEl.textContent = 'MISS -1';
        }
        scoreEl.textContent = String(score);
        drawFace();
      }

      startBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!running) start();
      });
      arena.addEventListener('pointerdown', onTap);
      drawFace();
    })();
  </script>
</body>
</html>
