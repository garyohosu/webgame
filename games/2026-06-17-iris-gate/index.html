<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>アイリスゲート</title>
  <meta name="description" content="タップで中央アイリスを開閉し、青パルスだけを通して赤パルスを弾く60秒ゲーム。" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg0: #091018;
      --bg1: #111f2d;
      --panel: rgba(8, 15, 24, 0.82);
      --line: rgba(156, 225, 255, 0.15);
      --text: #eef6ff;
      --cyan: #79defd;
      --mint: #9ff7c5;
      --red: #ff718f;
      --gold: #ffd67a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, rgba(121, 222, 253, 0.16), transparent 30%),
        radial-gradient(circle at 80% 85%, rgba(255, 113, 143, 0.12), transparent 26%),
        linear-gradient(180deg, var(--bg1), var(--bg0) 56%, #04080d 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation;
    }
    body {
      display: flex;
      justify-content: center;
    }
    .shell {
      width: min(100vw, 430px);
      height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      overflow: hidden;
      position: relative;
    }
    .panel, .hud, .controls {
      position: relative;
      z-index: 2;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
    }
    .panel {
      padding: 14px 16px 12px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      opacity: 0.82;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0;
      font-size: 1.74rem;
      letter-spacing: 0.03em;
      line-height: 1.04;
    }
    .sub {
      margin-top: 6px;
      font-size: 0.92rem;
      line-height: 1.45;
      color: rgba(238, 246, 255, 0.74);
    }
    .hud {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .stat {
      min-width: 0;
      text-align: center;
      padding: 9px 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .label {
      margin-bottom: 4px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(238, 246, 255, 0.56);
    }
    .value {
      font-size: 1.02rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .value.mode-open { color: var(--mint); }
    .value.mode-shut { color: var(--gold); }
    .arena {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid rgba(170, 225, 255, 0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent),
        linear-gradient(180deg, rgba(12, 24, 37, 0.96), rgba(4, 9, 14, 0.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 18px 40px rgba(0, 0, 0, 0.26);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(4, 9, 14, 0.15), rgba(4, 9, 14, 0.72));
      transition: opacity 0.2s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .overlay-card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 22px;
      background: rgba(4, 9, 14, 0.82);
      border: 1px solid rgba(150, 223, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
    }
    .overlay-card h2 {
      margin: 0 0 10px;
      font-size: 1.34rem;
    }
    .overlay-card p {
      margin: 0;
      line-height: 1.6;
      font-size: 0.95rem;
      color: rgba(238, 246, 255, 0.78);
    }
    .controls {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
    }
    .back {
      padding: 12px 10px;
      color: rgba(238, 246, 255, 0.78);
      text-decoration: none;
      font-size: 0.92rem;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #07101a;
      background: linear-gradient(135deg, var(--cyan), #c6f1ff);
      box-shadow: 0 10px 24px rgba(121, 222, 253, 0.22);
    }
    button.secondary {
      background: linear-gradient(135deg, var(--gold), #fff0b0);
      box-shadow: 0 10px 24px rgba(255, 214, 122, 0.18);
    }
    .tap-note {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(4, 10, 16, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(238,246,255,0.86);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <div class="eyebrow">60 SEC IRIS SORTER</div>
      <h1>アイリスゲート</h1>
      <div class="sub">タップで中央アイリスを開閉。青パルスは通し、赤パルスは閉じて弾け。</div>
    </section>

    <section class="hud">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="time">60.0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="stat"><div class="label">Mode / Combo</div><div class="value mode-open" id="mode">OPEN x1</div></div>
    </section>

    <section class="arena" id="arena">
      <canvas id="game" width="390" height="620" aria-label="アイリスゲートのゲーム画面"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">通すか、閉じるか</h2>
          <p id="overlayText">プレイ中は画面のどこでもタップしてアイリスを OPEN / SHUT に反転。青は通して得点、赤は閉じて防げ。60秒で最高得点を狙う。</p>
        </div>
      </div>
      <div class="tap-note">PLAY中は画面タップで OPEN / SHUT 反転</div>
    </section>

    <section class="controls">
      <a class="back" href="../../">← 作品集へ戻る</a>
      <button id="startBtn">スタート</button>
      <button class="secondary" id="retryBtn">再挑戦</button>
    </section>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "iris-gate-hi-v1";
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const arena = document.getElementById("arena");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const scoreEl = document.getElementById("score");
      const timeEl = document.getElementById("time");
      const bestEl = document.getElementById("best");
      const modeEl = document.getElementById("mode");
      const startBtn = document.getElementById("startBtn");
      const retryBtn = document.getElementById("retryBtn");

      let width = 390;
      let height = 620;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const state = {
        running: false,
        score: 0,
        best: Number(localStorage.getItem(STORAGE_KEY) || 0),
        timeLeft: 60,
        combo: 0,
        irisOpen: true,
        spawnTimer: 0,
        flash: 0,
        particles: [],
        pulses: [],
        lastTime: 0,
      };

      const iris = {
        x: width / 2,
        y: height * 0.58,
        radius: 62,
      };

      function resize() {
        const rect = arena.getBoundingClientRect();
        width = Math.max(320, Math.floor(rect.width));
        height = Math.max(420, Math.floor(rect.height));
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        iris.x = width / 2;
        iris.y = height * 0.58;
        iris.radius = Math.min(width * 0.16, 68);
      }

      function resetGame() {
        state.running = false;
        state.score = 0;
        state.timeLeft = 60;
        state.combo = 0;
        state.irisOpen = true;
        state.spawnTimer = 0.2;
        state.flash = 0;
        state.particles = [];
        state.pulses = [];
        state.lastTime = 0;
        updateHud();
        setOverlay("通すか、閉じるか", "プレイ中は画面のどこでもタップしてアイリスを OPEN / SHUT に反転。青は通して得点、赤は閉じて防げ。60秒で最高得点を狙う。");
      }

      function startGame() {
        state.running = true;
        state.score = 0;
        state.timeLeft = 60;
        state.combo = 0;
        state.irisOpen = true;
        state.spawnTimer = 0.1;
        state.flash = 0;
        state.particles = [];
        state.pulses = [];
        state.lastTime = 0;
        overlay.classList.add("hidden");
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = String(state.score);
        timeEl.textContent = state.timeLeft.toFixed(1);
        bestEl.textContent = String(state.best);
        modeEl.textContent = (state.irisOpen ? "OPEN" : "SHUT") + " x" + (1 + Math.min(4, Math.floor(state.combo / 4)));
        modeEl.className = "value " + (state.irisOpen ? "mode-open" : "mode-shut");
      }

      function setOverlay(title, text) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.classList.remove("hidden");
      }

      function difficultyPhase() {
        if (state.timeLeft > 45) {
          return { speed: 168, interval: 0.72, redRate: 0.28, burst: 1 };
        }
        if (state.timeLeft > 15) {
          return { speed: 212, interval: 0.55, redRate: 0.37, burst: 2 };
        }
        return { speed: 252, interval: 0.42, redRate: 0.46, burst: 2 };
      }

      function spawnPulse() {
        const phase = difficultyPhase();
        const count = phase.burst === 2 && Math.random() < 0.45 ? 2 : 1;
        for (let i = 0; i < count; i += 1) {
          const isRed = Math.random() < phase.redRate;
          const offset = (Math.random() - 0.5) * width * 0.48;
          state.pulses.push({
            x: iris.x + offset,
            y: -20 - i * 34,
            vy: phase.speed + Math.random() * 26,
            vx: (Math.random() - 0.5) * 16,
            radius: 11 + Math.random() * 5,
            type: isRed ? "red" : "blue",
            judged: false,
            resolved: false,
          });
        }
      }

      function toggleIris() {
        if (!state.running) {
          return;
        }
        state.irisOpen = !state.irisOpen;
        state.flash = 0.18;
        updateHud();
      }

      function onArenaPointerDown(event) {
        if (event.target.closest(".controls")) {
          return;
        }
        event.preventDefault();
        toggleIris();
      }

      function addParticles(x, y, color, amount) {
        for (let i = 0; i < amount; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 40 + Math.random() * 100;
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.35 + Math.random() * 0.35,
            maxLife: 0.7,
            color,
          });
        }
      }

      function judgePulse(pulse, allowed) {
        pulse.judged = true;
        const multiplier = 1 + Math.min(4, Math.floor(state.combo / 4));
        if (pulse.type === "blue" && allowed) {
          pulse.vy *= 1.18;
          pulse.vx *= 0.4;
          state.combo += 1;
          state.score += multiplier;
          addParticles(pulse.x, pulse.y, "#9ff7c5", 12);
        } else if (pulse.type === "red" && !allowed) {
          pulse.vy = -Math.max(110, pulse.vy * 0.48);
          pulse.vx += (pulse.x < iris.x ? -1 : 1) * 34;
          pulse.resolved = true;
          state.combo += 1;
          state.score += multiplier;
          addParticles(pulse.x, pulse.y, "#ffd67a", 10);
        } else {
          pulse.vy *= 1.08;
          state.combo = 0;
          state.score = Math.max(0, state.score - 3);
          addParticles(pulse.x, pulse.y, "#ff718f", 14);
        }
        state.best = Math.max(state.best, state.score);
        localStorage.setItem(STORAGE_KEY, String(state.best));
        updateHud();
      }

      function update(dt) {
        if (!state.running) {
          return;
        }

        state.timeLeft = Math.max(0, state.timeLeft - dt);
        state.flash = Math.max(0, state.flash - dt);

        const phase = difficultyPhase();
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnPulse();
          state.spawnTimer = phase.interval * (0.72 + Math.random() * 0.4);
        }

        const judgeTop = iris.y - 16;
        const judgeBottom = iris.y + 16;

        state.pulses = state.pulses.filter((pulse) => {
          pulse.x += pulse.vx * dt;
          pulse.y += pulse.vy * dt;
          pulse.vx *= pulse.resolved ? 0.99 : 0.998;
          if (pulse.resolved) {
            pulse.vy += 360 * dt;
          }

          const inGate = pulse.y + pulse.radius >= judgeTop && pulse.y - pulse.radius <= judgeBottom;
          if (!pulse.judged && inGate) {
            judgePulse(pulse, state.irisOpen);
          }

          if (pulse.resolved && pulse.y + pulse.radius < -40) {
            return false;
          }
          if (pulse.y - pulse.radius > height + 28) {
            if (!pulse.judged) {
              state.combo = 0;
              updateHud();
            }
            return false;
          }
          return true;
        });

        state.particles = state.particles.filter((particle) => {
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= 0.97;
          particle.vy *= 0.97;
          return particle.life > 0;
        });

        if (state.timeLeft <= 0) {
          state.running = false;
          setOverlay(
            "RESULT " + state.score,
            "BEST " + state.best + "。青を通し、赤を閉じるだけの60秒。もう一度押して開閉のリズムを詰めろ。"
          );
        }

        updateHud();
      }

      function drawBackdrop() {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "rgba(19, 38, 58, 0.92)");
        gradient.addColorStop(1, "rgba(5, 10, 16, 1)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < 24; i += 1) {
          const y = (i / 24) * height;
          ctx.strokeStyle = i % 2 === 0 ? "rgba(140, 210, 255, 0.06)" : "rgba(255,255,255,0.02)";
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(121, 222, 253, 0.08)";
        ctx.fillRect(width * 0.2, 0, width * 0.6, height);
      }

      function drawIris() {
        const petals = 6;
        const angleOffset = state.irisOpen ? 0.22 : 0.04;
        const innerRadius = state.irisOpen ? iris.radius * 0.34 : iris.radius * 0.08;

        ctx.save();
        ctx.translate(iris.x, iris.y);

        ctx.beginPath();
        ctx.arc(0, 0, iris.radius + 12, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(121, 222, 253, 0.08)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, iris.radius, 0, Math.PI * 2);
        ctx.strokeStyle = state.irisOpen ? "rgba(159, 247, 197, 0.9)" : "rgba(255, 214, 122, 0.9)";
        ctx.lineWidth = 4;
        ctx.stroke();

        for (let i = 0; i < petals; i += 1) {
          const base = (Math.PI * 2 * i) / petals;
          const a0 = base - 0.36;
          const a1 = base + 0.36;
          ctx.beginPath();
          ctx.moveTo(Math.cos(base) * innerRadius, Math.sin(base) * innerRadius);
          ctx.lineTo(Math.cos(a0) * iris.radius, Math.sin(a0) * iris.radius);
          ctx.lineTo(Math.cos(a1) * iris.radius, Math.sin(a1) * iris.radius);
          ctx.closePath();
          const petalGradient = ctx.createLinearGradient(
            Math.cos(a0) * iris.radius,
            Math.sin(a0) * iris.radius,
            Math.cos(base + angleOffset) * innerRadius,
            Math.sin(base + angleOffset) * innerRadius
          );
          petalGradient.addColorStop(0, state.irisOpen ? "rgba(121, 222, 253, 0.58)" : "rgba(255, 214, 122, 0.66)");
          petalGradient.addColorStop(1, "rgba(8, 14, 22, 0.96)");
          ctx.fillStyle = petalGradient;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(0, 0, innerRadius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(3, 7, 12, 0.94)";
        ctx.fill();

        if (state.flash > 0) {
          ctx.beginPath();
          ctx.arc(0, 0, iris.radius + 18 * state.flash, 0, Math.PI * 2);
          ctx.strokeStyle = state.irisOpen ? "rgba(159, 247, 197, 0.36)" : "rgba(255, 214, 122, 0.34)";
          ctx.lineWidth = 10 * state.flash;
          ctx.stroke();
        }

        ctx.restore();

        ctx.fillStyle = "rgba(255,255,255,0.06)";
        ctx.fillRect(0, iris.y - 2, width, 4);
      }

      function drawPulses() {
        state.pulses.forEach((pulse) => {
          const glow = pulse.type === "blue" ? "rgba(121, 222, 253, 0.34)" : "rgba(255, 113, 143, 0.34)";
          const fill = pulse.type === "blue" ? "#79defd" : "#ff718f";
          ctx.beginPath();
          ctx.arc(pulse.x, pulse.y, pulse.radius * 1.9, 0, Math.PI * 2);
          ctx.fillStyle = glow;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(pulse.x, pulse.y, pulse.radius, 0, Math.PI * 2);
          ctx.fillStyle = fill;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(pulse.x - pulse.radius * 0.24, pulse.y - pulse.radius * 0.26, pulse.radius * 0.34, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,0.35)";
          ctx.fill();
        });
      }

      function drawParticles() {
        state.particles.forEach((particle) => {
          const alpha = Math.max(0, particle.life / particle.maxLife);
          ctx.fillStyle = particle.color + Math.round(alpha * 255).toString(16).padStart(2, "0");
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 2 + alpha * 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function render() {
        drawBackdrop();
        drawIris();
        drawPulses();
        drawParticles();
      }

      function loop(timestamp) {
        if (!state.lastTime) {
          state.lastTime = timestamp;
        }
        const dt = Math.min(0.033, (timestamp - state.lastTime) / 1000);
        state.lastTime = timestamp;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      startBtn.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        startGame();
      });

      retryBtn.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        startGame();
      });

      arena.addEventListener("pointerdown", onArenaPointerDown);
      window.addEventListener("resize", resize);

      resize();
      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
