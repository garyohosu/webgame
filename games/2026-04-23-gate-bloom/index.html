<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>ゲートブルーム</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161"
       crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #090d1f;
      --panel: #121936;
      --line: #27325f;
      --text: #edf2ff;
      --sub: #9fb0e5;
      --good: #56d4ff;
      --bad: #ff5f7f;
      --accent: #b38cff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(circle at 20% 0%, #1a2552, var(--bg) 52%); color: var(--text); font-family: "Noto Sans JP", system-ui, sans-serif; }
    body { display: flex; justify-content: center; }

    .app {
      width: min(100vw, 440px);
      height: 100dvh;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }

    .top {
      background: rgba(18,25,54,.85);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title { font-weight: 800; letter-spacing: .04em; }
    .hint { font-size: 12px; color: var(--sub); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      background: rgba(18,25,54,.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }
    .label { font-size: 11px; color: var(--sub); }
    .value { font-size: 20px; font-weight: 800; margin-top: 2px; }

    .arena {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(85,108,184,.16), transparent 25%),
        linear-gradient(180deg, #0f1632 0%, #0b1229 100%);
      touch-action: manipulation;
    }

    .lane-lines {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, transparent 33.33%, rgba(255,255,255,.08) 33.33%, rgba(255,255,255,.08) 34%, transparent 34%, transparent 66.66%, rgba(255,255,255,.08) 66.66%, rgba(255,255,255,.08) 67.33%, transparent 67.33%);
      pointer-events: none;
    }

    .gate {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 42px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 10px;
      pointer-events: none;
    }
    .slot {
      border-radius: 10px;
      border: 1px solid #3b4a83;
      background: rgba(255,255,255,.05);
      position: relative;
      overflow: hidden;
    }
    .slot.active {
      border-color: #9fd5ff;
      box-shadow: 0 0 0 1px rgba(111, 198, 255, .35) inset, 0 0 14px rgba(111,198,255,.45);
      background: linear-gradient(180deg, rgba(111,198,255,.35), rgba(85,140,255,.15));
    }
    .slot.active::after {
      content: "OPEN";
      position: absolute;
      inset: auto 0 3px;
      text-align: center;
      font-size: 10px;
      color: #d6edff;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .orb {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 14px currentColor;
    }
    .orb.good { color: var(--good); background: radial-gradient(circle at 35% 30%, #e8fcff 0 26%, #7de0ff 45%, #3c95ff 100%); }
    .orb.bad { color: var(--bad); background: radial-gradient(circle at 35% 30%, #ffd7e0 0 26%, #ff7997 45%, #c42b4f 100%); }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    button {
      border: 0;
      background: linear-gradient(135deg, #66baff, var(--accent));
      color: #fff;
      font-weight: 800;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
    }
    a.back {
      color: var(--sub);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 4px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 11, 24, .64);
      padding: 24px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }
    .overlay.show { opacity: 1; }
    .overlay-card {
      border: 1px solid #3a4a86;
      background: rgba(10, 16, 38, .9);
      border-radius: 16px;
      padding: 14px 16px;
      width: 100%;
      max-width: 280px;
    }
    .overlay-title { font-weight: 800; margin-bottom: 8px; }
    .overlay-sub { color: var(--sub); font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="top">
      <div>
        <div class="title">🌸 ゲートブルーム</div>
        <div class="hint">画面タップで OPEN レーン切替（左→中→右）</div>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">TIME</div><div class="value" id="time">60.0</div></div>
      <div class="stat"><div class="label">HI</div><div class="value" id="hi">0</div></div>
    </section>

    <section class="arena" id="arena" aria-label="game area">
      <div class="lane-lines"></div>
      <div class="gate" id="gate">
        <div class="slot active"></div>
        <div class="slot"></div>
        <div class="slot"></div>
      </div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="overlayTitle">60秒でハイスコア更新を狙え</div>
          <div class="overlay-sub" id="overlaySub">青を通して+1、赤を通すと-2。タップでゲート位置を回せ。</div>
        </div>
      </div>
    </section>

    <section class="footer">
      <button id="startBtn" type="button">スタート</button>
      <a class="back" href="../../">← 戻る</a>
    </section>
  </main>

<script>
(() => {
  const TOTAL_MS = 60000;
  const STORAGE_KEY = 'gate-bloom-hi-v1';
  const arena = document.getElementById('arena');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const hiEl = document.getElementById('hi');
  const startBtn = document.getElementById('startBtn');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const slots = [...document.querySelectorAll('.slot')];

  let hi = Number(localStorage.getItem(STORAGE_KEY) || 0);
  let score = 0;
  let activeLane = 0;
  let running = false;
  let startAt = 0;
  let prevTs = 0;
  let spawnAcc = 0;
  let rafId = 0;
  const orbs = [];

  hiEl.textContent = hi;
  overlay.classList.add('show');

  function laneCenter(lane) {
    const w = arena.clientWidth;
    return (w / 6) + lane * (w / 3);
  }

  function updateSlots() {
    slots.forEach((el, i) => el.classList.toggle('active', i === activeLane));
  }

  function phase() {
    const t = elapsedMs();
    if (t < 30000) return { speed: 150, spawnMs: 520, badRate: 0.20 };
    if (t < 45000) return { speed: 180, spawnMs: 430, badRate: 0.30 };
    return { speed: 218, spawnMs: 340, badRate: 0.38 };
  }

  function elapsedMs() {
    return running ? Math.min(performance.now() - startAt, TOTAL_MS) : 0;
  }

  function spawnOrb() {
    const p = phase();
    const lane = Math.floor(Math.random() * 3);
    const bad = Math.random() < p.badRate;
    const el = document.createElement('div');
    el.className = `orb ${bad ? 'bad' : 'good'}`;
    arena.appendChild(el);
    orbs.push({ el, lane, y: -16, speed: p.speed, bad, judged: false });
  }

  function update(dt) {
    const h = arena.clientHeight;

    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.y += o.speed * dt;

      if (!o.judged && o.y >= h - 38) {
        o.judged = true;
        if (o.lane === activeLane) {
          score += o.bad ? -2 : 1;
          if (score < 0) score = 0;
        }
      }

      o.el.style.left = `${laneCenter(o.lane)}px`;
      o.el.style.top = `${o.y}px`;

      if (o.y > h + 20) {
        o.el.remove();
        orbs.splice(i, 1);
      }
    }
  }

  function renderStats(msLeft) {
    scoreEl.textContent = score;
    timeEl.textContent = (msLeft / 1000).toFixed(1);
    hiEl.textContent = hi;
  }

  function cleanOrbs() {
    while (orbs.length) orbs.pop().el.remove();
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(rafId);
    cleanOrbs();

    if (score > hi) {
      hi = score;
      localStorage.setItem(STORAGE_KEY, String(hi));
    }

    renderStats(0);
    overlayTitle.textContent = `終了：${score} 点`;
    overlaySub.textContent = score >= hi ? 'ハイスコア更新！ もう一度スタートで再挑戦。' : `ハイスコア ${hi} 点。OPEN切替の先読みが鍵。`;
    overlay.classList.add('show');
    startBtn.textContent = 'もう一度';
  }

  function loop(ts) {
    if (!running) return;
    if (!prevTs) prevTs = ts;
    const dt = Math.min((ts - prevTs) / 1000, 0.05);
    prevTs = ts;

    const elapsed = Math.min(ts - startAt, TOTAL_MS);
    const left = Math.max(0, TOTAL_MS - elapsed);

    const p = phase();
    spawnAcc += dt * 1000;
    while (spawnAcc >= p.spawnMs) {
      spawnAcc -= p.spawnMs;
      spawnOrb();
    }

    update(dt);
    renderStats(left);

    if (left <= 0) {
      endGame();
      return;
    }

    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0;
    activeLane = 0;
    updateSlots();
    cleanOrbs();
    running = true;
    startAt = performance.now();
    prevTs = 0;
    spawnAcc = 0;
    overlay.classList.remove('show');
    startBtn.textContent = 'プレイ中';
    rafId = requestAnimationFrame(loop);
  }

  function cycleLane() {
    if (!running) return;
    activeLane = (activeLane + 1) % 3;
    updateSlots();
  }

  document.getElementById('app').addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('#startBtn') || ev.target.closest('a.back')) return;
    cycleLane();
  });

  startBtn.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    if (!running) startGame();
  });

  updateSlots();
  renderStats(TOTAL_MS);
})();
</script>
</body>
</html>
