<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>コアカラー・スナップ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1226;
      --panel: #171a33;
      --text: #eef3ff;
      --muted: #8f9bc4;
      --c0: #57d3ff;
      --c1: #ff6bb0;
      --c2: #ffd166;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 10%, #22264d, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body { display: flex; justify-content: center; }
    .app {
      width: min(100vw, 430px);
      height: 100dvh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 12px;
      gap: 10px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .top a { color: #b8ccff; text-decoration: none; }
    .title {
      margin: 0;
      text-align: center;
      font-size: clamp(20px, 5.5vw, 28px);
      letter-spacing: .04em;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }
    .label { font-size: 11px; color: var(--muted); }
    .value { font-size: 20px; font-weight: 800; line-height: 1.15; }
    #field {
      position: relative;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.15));
      overflow: hidden;
      touch-action: manipulation;
    }
    #startBtn {
      position: absolute;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #74f2ff, #b48dff);
      color: #101528;
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
    }
    .core {
      position: absolute;
      left: 50%; top: 50%;
      width: 96px; height: 96px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.6);
      display: grid; place-items: center;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0,0,0,.45);
      box-shadow: 0 0 24px rgba(255,255,255,.28), inset 0 0 20px rgba(255,255,255,.2);
      z-index: 2;
      user-select: none;
    }
    .orb {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.65);
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      display: grid; place-items: center;
      font-size: 13px; font-weight: 800;
      color: #101528;
      user-select: none;
    }
    .msg {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      bottom: 10px;
      font-size: 13px;
      color: #c9d5ff;
      opacity: .95;
      text-align: center;
      padding: 4px 10px;
      background: rgba(0,0,0,.2);
      border-radius: 999px;
      z-index: 4;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><a href="../../">← 作品集へ戻る</a><span>60秒 / 1プレイ</span></div>
    <h1 class="title">コアカラー・スナップ</h1>
    <section class="hud">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">TIME</div><div class="value" id="time">60.0</div></div>
      <div class="stat"><div class="label">HI</div><div class="value" id="hi">0</div></div>
    </section>
    <section id="field">
      <button id="startBtn" type="button">START</button>
      <div id="core" class="core">TAP</div>
      <div id="msg" class="msg">中央コアをタップで色変更。同色オーブだけ回収！</div>
    </section>
  </main>

  <script>
    (() => {
      const KEY = 'core-color-snap-hi-v1';
      const COLORS = ['#57d3ff', '#ff6bb0', '#ffd166'];
      const NAMES = ['CYAN', 'PINK', 'GOLD'];

      const field = document.getElementById('field');
      const core = document.getElementById('core');
      const startBtn = document.getElementById('startBtn');
      const msg = document.getElementById('msg');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const hiEl = document.getElementById('hi');

      let hi = Number(localStorage.getItem(KEY) || 0);
      hiEl.textContent = hi;

      let running = false;
      let score = 0;
      let timeLeft = 60;
      let coreIdx = 0;
      let spawnTimer = 0;
      let lastTs = 0;
      let orbs = [];

      function setCore(i) {
        coreIdx = (i + COLORS.length) % COLORS.length;
        core.style.background = COLORS[coreIdx];
        core.textContent = NAMES[coreIdx];
      }

      function currentSpawnInterval() {
        if (timeLeft > 30) return 820;
        if (timeLeft > 15) return 620;
        return 470;
      }

      function currentSpeedScale() {
        if (timeLeft > 30) return 1;
        if (timeLeft > 15) return 1.2;
        return 1.45;
      }

      function spawnOrb() {
        const rect = field.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.max(rect.width, rect.height) * 0.56;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        const colorIdx = Math.floor(Math.random() * 3);

        const el = document.createElement('div');
        el.className = 'orb';
        el.style.background = COLORS[colorIdx];
        el.textContent = NAMES[colorIdx][0];
        field.appendChild(el);

        const baseSpeed = 64 + Math.random() * 22;
        const orb = { el, x, y, colorIdx, speed: baseSpeed, alive: true, tapped: false };

        el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (!running || !orb.alive) return;
          orb.tapped = true;
          orb.alive = false;
          if (orb.colorIdx === coreIdx) {
            score += 1;
            flash('+1', '#75f6b8');
          } else {
            score = Math.max(0, score - 1);
            flash('-1', '#ff9dbd');
          }
          updateHud();
          el.remove();
        });

        orbs.push(orb);
      }

      function flash(text, color) {
        msg.textContent = text;
        msg.style.color = color;
        clearTimeout(flash.tid);
        flash.tid = setTimeout(() => {
          msg.textContent = '中央コアをタップで色変更。同色オーブだけ回収！';
          msg.style.color = '#c9d5ff';
        }, 240);
      }

      function updateHud() {
        scoreEl.textContent = score;
        timeEl.textContent = Math.max(0, timeLeft).toFixed(1);
        if (score > hi) {
          hi = score;
          hiEl.textContent = hi;
          localStorage.setItem(KEY, String(hi));
        }
      }

      function resetGame() {
        orbs.forEach(o => o.el.remove());
        orbs = [];
        score = 0;
        timeLeft = 60;
        spawnTimer = 0;
        setCore(0);
        updateHud();
      }

      function endGame() {
        running = false;
        startBtn.style.display = '';
        startBtn.textContent = 'RETRY';
        msg.textContent = `終了！ スコア ${score} / ハイスコア ${hi}`;
      }

      function loop(ts) {
        if (!running) return;
        if (!lastTs) lastTs = ts;
        const dt = Math.min(33, ts - lastTs);
        lastTs = ts;

        timeLeft -= dt / 1000;
        spawnTimer += dt;

        if (spawnTimer >= currentSpawnInterval()) {
          spawnTimer = 0;
          spawnOrb();
        }

        const rect = field.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const speedScale = currentSpeedScale();

        for (const orb of orbs) {
          if (!orb.alive) continue;
          const dx = cx - orb.x;
          const dy = cy - orb.y;
          const dist = Math.hypot(dx, dy) || 1;
          const step = (orb.speed * speedScale) * (dt / 1000);
          orb.x += dx / dist * step;
          orb.y += dy / dist * step;
          orb.el.style.transform = `translate(${orb.x - 22}px, ${orb.y - 22}px)`;

          if (dist < 58) {
            orb.alive = false;
            orb.el.remove();
            if (orb.colorIdx === coreIdx) {
              score = Math.max(0, score - 2);
              flash('-2', '#ff9dbd');
            }
          }
        }

        orbs = orbs.filter(o => o.alive);
        updateHud();

        if (timeLeft <= 0) {
          endGame();
          return;
        }
        requestAnimationFrame(loop);
      }

      field.addEventListener('pointerdown', () => {
        if (!running) return;
        setCore(coreIdx + 1);
      });

      startBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        resetGame();
        running = true;
        startBtn.style.display = 'none';
        lastTs = 0;
        requestAnimationFrame(loop);
      });

      setCore(0);
      updateHud();
    })();
  </script>
</body>
</html>
