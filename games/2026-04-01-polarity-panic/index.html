<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ポラリティ・パニック</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #060b1d;
      --panel: #121a35;
      --line: #33406a;
      --text: #eef2ff;
      --plus: #60a5fa;
      --minus: #f472b6;
      --good: #34d399;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% -10%, #1f2d66, var(--bg) 55%);
      color: var(--text);
      font-family: "Noto Sans JP", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    .app {
      width: min(100vw, 460px);
      height: 100dvh;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: .06em;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .stat {
      background: color-mix(in srgb, var(--panel) 92%, #fff 8%);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
      font-weight: 700;
      font-size: .84rem;
    }
    .stat b { display: block; font-size: 1rem; margin-top: 2px; }
    #field {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #0f1632 0%, #0a1228 100%);
      touch-action: manipulation;
    }
    .rail {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 20% 100%;
      pointer-events: none;
    }
    .core {
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 900;
      border: 3px solid;
      box-shadow: 0 0 20px rgba(255,255,255,.16);
      transition: transform .08s ease;
      user-select: none;
      pointer-events: none;
    }
    .core.plus { color: var(--plus); border-color: color-mix(in srgb, var(--plus) 75%, #fff 25%); background: color-mix(in srgb, var(--plus) 20%, transparent); }
    .core.minus { color: var(--minus); border-color: color-mix(in srgb, var(--minus) 75%, #fff 25%); background: color-mix(in srgb, var(--minus) 20%, transparent); }
    .particle {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      font-weight: 900;
      border: 2px solid;
      box-shadow: 0 6px 14px rgba(0,0,0,.32);
      user-select: none;
      pointer-events: none;
    }
    .particle.plus { color: var(--plus); border-color: #93c5fd; background: color-mix(in srgb, var(--plus) 26%, #091222); }
    .particle.minus { color: var(--minus); border-color: #f9a8d4; background: color-mix(in srgb, var(--minus) 24%, #15091a); }
    .pop {
      position: absolute;
      font-weight: 800;
      pointer-events: none;
      animation: pop .45s ease-out forwards;
    }
    .pop.good { color: var(--good); }
    .pop.bad { color: var(--bad); }
    @keyframes pop {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-18px); }
    }
    .controls { display: grid; gap: 8px; }
    #result {
      min-height: 1.2em;
      text-align: center;
      color: #d4ddff;
      font-size: .93rem;
    }
    button, .back {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
    }
    button { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; font-size: 1rem; }
    .back { background: #212a4a; color: #d6e0ff; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="app">
    <h1>⚡ ポラリティ・パニック</h1>

    <section class="hud">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat">HI<b id="hi">0</b></div>
      <div class="stat">TIME<b id="time">60.0</b></div>
      <div class="stat">MODE<b id="mode">＋</b></div>
    </section>

    <section id="field" aria-label="game area">
      <div class="rail"></div>
      <div id="core" class="core plus">＋</div>
    </section>

    <section class="controls">
      <div id="result">タップで極性を切り替え、同極粒子を吸収せよ（60秒）</div>
      <button id="start" type="button">START</button>
      <a class="back" href="../../">← 作品集へ戻る</a>
    </section>
  </main>

  <script>
    const KEY = 'polarity-panic-hi-v1';
    const scoreEl = document.getElementById('score');
    const hiEl = document.getElementById('hi');
    const timeEl = document.getElementById('time');
    const modeEl = document.getElementById('mode');
    const resultEl = document.getElementById('result');
    const startBtn = document.getElementById('start');
    const field = document.getElementById('field');
    const core = document.getElementById('core');

    let hiScore = Number(localStorage.getItem(KEY) || 0);
    hiEl.textContent = String(hiScore);

    let running = false;
    let score = 0;
    let leftMs = 60000;
    let mode = 'plus';
    let particles = [];
    let spawnTimer = 0;
    let lastTs = 0;

    function difficulty() {
      if (leftMs > 30000) return { speed: 0.11, spawn: 700, max: 3, minusRate: 0.45 };
      if (leftMs > 15000) return { speed: 0.14, spawn: 560, max: 4, minusRate: 0.52 };
      return { speed: 0.18, spawn: 460, max: 5, minusRate: 0.6 };
    }

    function setMode(next) {
      mode = next;
      const plus = mode === 'plus';
      modeEl.textContent = plus ? '＋' : '－';
      core.classList.toggle('plus', plus);
      core.classList.toggle('minus', !plus);
      core.textContent = plus ? '＋' : '－';
      core.style.transform = 'translateX(-50%) scale(0.94)';
      setTimeout(() => { core.style.transform = 'translateX(-50%) scale(1)'; }, 80);
    }

    function toggleMode() {
      setMode(mode === 'plus' ? 'minus' : 'plus');
    }

    function spawnParticle() {
      const rect = field.getBoundingClientRect();
      const d = difficulty();
      const kind = Math.random() < d.minusRate ? 'minus' : 'plus';
      const el = document.createElement('div');
      el.className = `particle ${kind}`;
      el.textContent = kind === 'plus' ? '＋' : '－';
      const x = Math.random() * (rect.width - 44);
      el.style.left = `${x}px`;
      el.style.top = '-46px';
      field.appendChild(el);
      particles.push({ kind, x, y: -46, el, hit: false });
    }

    function pop(text, cls, x, y) {
      const node = document.createElement('div');
      node.className = `pop ${cls}`;
      node.textContent = text;
      node.style.left = `${x}px`;
      node.style.top = `${y}px`;
      field.appendChild(node);
      setTimeout(() => node.remove(), 460);
    }

    function resetParticles() {
      particles.forEach(p => p.el.remove());
      particles = [];
    }

    function finish() {
      running = false;
      resetParticles();
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem(KEY, String(hiScore));
        hiEl.textContent = String(hiScore);
      }
      resultEl.textContent = `終了！ Score: ${score} / Hi: ${hiScore}`;
      startBtn.disabled = false;
      startBtn.textContent = 'RETRY';
    }

    function update(ts) {
      if (!running) return;
      if (!lastTs) lastTs = ts;
      const dt = ts - lastTs;
      lastTs = ts;

      leftMs -= dt;
      if (leftMs <= 0) {
        leftMs = 0;
        timeEl.textContent = '0.0';
        finish();
        return;
      }

      const d = difficulty();
      spawnTimer += dt;
      if (spawnTimer >= d.spawn && particles.length < d.max) {
        spawnTimer = 0;
        spawnParticle();
      }

      const coreTop = field.clientHeight - 90;
      for (const p of particles) {
        if (p.hit) continue;
        p.y += d.speed * dt;
        p.el.style.top = `${p.y}px`;

        if (p.y >= coreTop && p.y <= coreTop + 40) {
          const center = p.x + 21;
          const coreCenter = field.clientWidth / 2;
          if (Math.abs(center - coreCenter) < 48) {
            p.hit = true;
            const ok = p.kind === mode;
            score += ok ? 1 : -1;
            scoreEl.textContent = String(score);
            pop(ok ? '+1' : '-1', ok ? 'good' : 'bad', p.x + 12, p.y - 6);
            p.el.remove();
          }
        }
      }

      particles = particles.filter(p => {
        if (p.hit) return false;
        if (p.y > field.clientHeight + 50) {
          p.el.remove();
          return false;
        }
        return true;
      });

      timeEl.textContent = (leftMs / 1000).toFixed(1);
      requestAnimationFrame(update);
    }

    function startGame() {
      score = 0;
      leftMs = 60000;
      spawnTimer = 0;
      lastTs = 0;
      running = true;
      scoreEl.textContent = '0';
      timeEl.textContent = '60.0';
      setMode('plus');
      resetParticles();
      resultEl.textContent = 'タップで極性を切り替えながら同極を吸収！';
      startBtn.disabled = true;
      requestAnimationFrame(update);
    }

    field.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      if (!running) return;
      toggleMode();
    }, { passive: false });

    startBtn.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      if (running) return;
      startGame();
    }, { passive: false });
  </script>
</body>
</html>
