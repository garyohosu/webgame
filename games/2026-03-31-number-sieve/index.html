<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ナンバーシーブ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #161d33;
      --text: #eef3ff;
      --accent: #7dd3fc;
      --good: #34d399;
      --bad: #fb7185;
      --chip: #27314f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at 25% 10%, #1d2a55, var(--bg) 50%);
      color: var(--text);
      font-family: "Noto Sans JP", system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    .app {
      width: min(100vw, 460px);
      height: 100dvh;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 10px;
    }
    h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: .06em;
      text-align: center;
    }
    .hud, .target-box {
      background: color-mix(in srgb, var(--panel) 92%, #fff 8%);
      border: 1px solid #3a4a73;
      border-radius: 12px;
      padding: 10px;
    }
    .hud { display: flex; justify-content: space-between; font-weight: 700; font-size: .95rem; }
    .target-box { text-align: center; font-weight: 700; }
    .target-label { color: #9fb0d8; font-size: .8rem; }
    .target-value { font-size: 1.35rem; margin-top: 4px; color: var(--accent); letter-spacing: .06em; }
    #field {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #3a4a73;
      background: linear-gradient(180deg, #111933, #0b132a);
    }
    .chip {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--chip);
      border: 2px solid #4f6297;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      user-select: none;
      touch-action: manipulation;
      transition: transform .08s;
      box-shadow: 0 4px 10px rgba(0,0,0,.28);
    }
    .chip:active { transform: scale(.94); }
    .good-pop, .bad-pop {
      position: absolute;
      font-weight: 800;
      pointer-events: none;
      animation: pop .45s ease-out forwards;
    }
    .good-pop { color: var(--good); }
    .bad-pop { color: var(--bad); }
    @keyframes pop {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-20px); }
    }
    .controls {
      display: grid;
      gap: 8px;
    }
    button, a.back {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
    }
    button {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      font-size: 1rem;
    }
    a.back {
      background: #232d4b;
      color: #d6e0ff;
      font-size: .9rem;
      display: block;
    }
    #result { text-align: center; min-height: 1.2em; font-size: .95rem; color: #d3defe; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🔢 ナンバーシーブ</h1>
    <section class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Hi: <span id="hi">0</span></div>
      <div>Time: <span id="time">60.0</span></div>
    </section>
    <section class="target-box">
      <div class="target-label">TARGET</div>
      <div class="target-value" id="target">PRIME</div>
    </section>
    <section id="field" aria-label="game area"></section>
    <section class="controls">
      <div id="result">スタートして60秒で20点以上を狙え</div>
      <button id="start" type="button">START</button>
      <a class="back" href="../../">← 作品集へ戻る</a>
    </section>
  </main>

  <script>
    const KEY = 'number-sieve-hi-v1';
    const field = document.getElementById('field');
    const scoreEl = document.getElementById('score');
    const hiEl = document.getElementById('hi');
    const timeEl = document.getElementById('time');
    const targetEl = document.getElementById('target');
    const resultEl = document.getElementById('result');
    const startBtn = document.getElementById('start');

    const primes = new Set([2,3,5,7,11,13,17,19]);
    let hiScore = Number(localStorage.getItem(KEY) || 0);
    hiEl.textContent = String(hiScore);

    let running = false;
    let score = 0;
    let leftMs = 60000;
    let spawnTimer = 0;
    let modeTimer = 0;
    let mode = 'PRIME';
    let chips = [];
    let lastTs = 0;

    function difficulty() {
      if (leftMs > 30000) return { speed: 0.09, spawn: 760, max: 3, modeSpan: 12000 };
      if (leftMs > 15000) return { speed: 0.12, spawn: 620, max: 4, modeSpan: 10000 };
      return { speed: 0.15, spawn: 500, max: 5, modeSpan: 8000 };
    }

    function isGood(n) {
      const prime = primes.has(n);
      return mode === 'PRIME' ? prime : (n > 1 && !prime);
    }

    function spawnChip() {
      const rect = field.getBoundingClientRect();
      const n = 1 + Math.floor(Math.random() * 20);
      const el = document.createElement('div');
      el.className = 'chip';
      el.textContent = String(n);
      const x = Math.random() * (rect.width - 52);
      el.style.left = `${x}px`;
      el.style.top = '-54px';
      const chip = { n, x, y: -54, hit: false, el };
      el.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        if (!running || chip.hit) return;
        chip.hit = true;
        const ok = isGood(chip.n);
        score += ok ? 1 : -1;
        scoreEl.textContent = String(score);
        pop(ok ? '+1' : '-1', chip.x + 18, chip.y, ok ? 'good-pop' : 'bad-pop');
        chip.el.remove();
      }, { passive: false });
      field.appendChild(el);
      chips.push(chip);
    }

    function pop(text, x, y, cls) {
      const p = document.createElement('div');
      p.className = cls;
      p.textContent = text;
      p.style.left = `${x}px`;
      p.style.top = `${Math.max(4, y)}px`;
      field.appendChild(p);
      setTimeout(() => p.remove(), 500);
    }

    function cleanupChips() {
      chips = chips.filter(c => {
        const alive = !c.hit && c.y < field.clientHeight + 60;
        if (!alive) c.el.remove();
        return alive;
      });
    }

    function update(ts) {
      if (!running) return;
      if (!lastTs) lastTs = ts;
      const dt = ts - lastTs;
      lastTs = ts;

      leftMs -= dt;
      if (leftMs <= 0) {
        leftMs = 0;
        finish();
        return;
      }

      const d = difficulty();
      spawnTimer += dt;
      modeTimer += dt;

      if (modeTimer >= d.modeSpan) {
        modeTimer = 0;
        mode = mode === 'PRIME' ? 'COMPOSITE' : 'PRIME';
        targetEl.textContent = mode;
      }

      if (spawnTimer >= d.spawn && chips.length < d.max) {
        spawnTimer = 0;
        spawnChip();
      }

      for (const c of chips) {
        if (c.hit) continue;
        c.y += d.speed * dt;
        c.el.style.top = `${c.y}px`;
      }
      cleanupChips();

      timeEl.textContent = (leftMs / 1000).toFixed(1);
      requestAnimationFrame(update);
    }

    function startGame() {
      chips.forEach(c => c.el.remove());
      chips = [];
      running = true;
      score = 0;
      leftMs = 60000;
      spawnTimer = 0;
      modeTimer = 0;
      mode = 'PRIME';
      lastTs = 0;
      scoreEl.textContent = '0';
      timeEl.textContent = '60.0';
      targetEl.textContent = mode;
      resultEl.textContent = 'PRIME / COMPOSITE を見て正しい数字だけをタップ';
      startBtn.textContent = 'RESTART';
      requestAnimationFrame(update);
    }

    function finish() {
      running = false;
      chips.forEach(c => c.el.remove());
      chips = [];
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem(KEY, String(hiScore));
        hiEl.textContent = String(hiScore);
      }
      resultEl.textContent = score >= 20 ? `CLEAR! ${score}点` : `FAILED... ${score}点（20点でクリア）`;
    }

    startBtn.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      startGame();
    }, { passive: false });
  </script>
</body>
</html>
