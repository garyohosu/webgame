<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>グロウサイロ</title>
  <meta name="description" content="4本の発光サイロをタップし、上端に届く青い粒だけを回収して赤い粒を見送る60秒ゲーム。" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-top: #101a34;
      --bg-bottom: #060a15;
      --panel: rgba(10, 16, 31, 0.84);
      --line: rgba(170, 219, 255, 0.16);
      --text: #f5fbff;
      --muted: rgba(245, 251, 255, 0.72);
      --blue: #7ee4ff;
      --gold: #ffd17e;
      --red: #ff6e7a;
      --ink: rgba(3, 9, 18, 0.78);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(126, 228, 255, 0.17), transparent 24%),
        radial-gradient(circle at 100% 20%, rgba(255, 209, 126, 0.12), transparent 28%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .shell {
      position: relative;
      width: min(100vw, 430px);
      height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      overflow: hidden;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(34px);
      pointer-events: none;
      opacity: 0.54;
    }

    .shell::before {
      width: 180px;
      height: 180px;
      left: -42px;
      top: 20%;
      background: rgba(126, 228, 255, 0.16);
    }

    .shell::after {
      width: 150px;
      height: 150px;
      right: -24px;
      bottom: 16%;
      background: rgba(255, 110, 122, 0.12);
    }

    .panel,
    .hud,
    .arena,
    .controls {
      position: relative;
      z-index: 1;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px var(--shadow);
    }

    .panel {
      padding: 14px 16px 12px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245, 251, 255, 0.56);
    }

    h1 {
      margin: 4px 0 0;
      font-size: 1.72rem;
      line-height: 1.04;
      letter-spacing: 0.04em;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.55;
    }

    .hud {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      padding: 8px 4px;
      border-radius: 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .label {
      margin-bottom: 4px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(245, 251, 255, 0.5);
    }

    .value {
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arena {
      min-height: 0;
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 24%),
        linear-gradient(180deg, rgba(9, 18, 36, 0.96), rgba(4, 8, 16, 0.98));
    }

    .harvest-bar {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .harvest-slot {
      height: 34px;
      border-radius: 16px;
      border: 1px dashed rgba(255, 209, 126, 0.34);
      background: linear-gradient(180deg, rgba(255, 209, 126, 0.16), rgba(255, 209, 126, 0.05));
      display: grid;
      place-items: center;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: rgba(255, 231, 194, 0.82);
      text-transform: uppercase;
    }

    .silos {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      min-height: 0;
    }

    .lane {
      position: relative;
      min-width: 0;
      border: 1px solid rgba(170, 219, 255, 0.14);
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)),
        linear-gradient(180deg, rgba(11, 25, 46, 0.96), rgba(6, 11, 21, 0.98));
      overflow: hidden;
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .lane::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to top,
          rgba(255, 255, 255, 0.04) 0 2px,
          transparent 2px 24px
        );
      opacity: 0.38;
      pointer-events: none;
    }

    .lane::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 52px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 209, 126, 0.5);
      box-shadow: 0 0 14px rgba(255, 209, 126, 0.36);
      pointer-events: none;
    }

    .lane:active,
    .lane.flash-good,
    .lane.flash-bad,
    .lane.flash-empty {
      transform: scale(0.98);
    }

    .lane.flash-good {
      border-color: rgba(126, 228, 255, 0.7);
      box-shadow: 0 0 0 1px rgba(126, 228, 255, 0.14), 0 0 24px rgba(126, 228, 255, 0.22);
    }

    .lane.flash-bad {
      border-color: rgba(255, 110, 122, 0.68);
      box-shadow: 0 0 0 1px rgba(255, 110, 122, 0.14), 0 0 24px rgba(255, 110, 122, 0.2);
    }

    .lane.flash-empty {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .lane-label {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(3, 9, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(245, 251, 255, 0.6);
      text-transform: uppercase;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      left: 50%;
      width: 38px;
      height: 38px;
      margin-left: -19px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.24);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .orb.blue {
      background: radial-gradient(circle at 30% 30%, #f4feff, var(--blue));
      color: #043548;
      box-shadow: 0 0 0 1px rgba(126, 228, 255, 0.24), 0 0 22px rgba(126, 228, 255, 0.24);
    }

    .orb.red {
      background: radial-gradient(circle at 30% 30%, #ffe7ea, var(--red));
      color: #4a0d15;
      box-shadow: 0 0 0 1px rgba(255, 110, 122, 0.2), 0 0 20px rgba(255, 110, 122, 0.2);
    }

    .orb.pop {
      transform: translateX(0) scale(1.16);
      opacity: 0;
    }

    .lane-fx {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 44px;
      padding: 4px 8px;
      border-radius: 999px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      background: rgba(3, 9, 18, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .lane-fx.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .lane-fx.good {
      color: var(--blue);
    }

    .lane-fx.bad {
      color: var(--red);
    }

    .lane-fx.note {
      color: var(--gold);
    }

    .legend {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: rgba(245, 251, 255, 0.74);
      font-size: 12px;
    }

    .legend span {
      flex: 1;
      text-align: center;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.04);
    }

    .controls {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
    }

    button,
    .back-link {
      appearance: none;
      border: none;
      border-radius: 16px;
      min-height: 50px;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    button {
      color: #06121f;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      box-shadow: 0 12px 24px rgba(126, 228, 255, 0.16);
    }

    button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(4, 8, 16, 0.18), rgba(4, 8, 16, 0.88));
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 24px;
      background: rgba(5, 12, 24, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.32);
    }

    .overlay-card h2 {
      margin: 0 0 10px;
      font-size: 1.34rem;
    }

    .overlay-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      .shell {
        padding-left: 10px;
        padding-right: 10px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .sub {
        font-size: 0.88rem;
      }

      .hud,
      .harvest-bar,
      .silos,
      .controls {
        gap: 6px;
      }

      .value {
        font-size: 0.74rem;
      }

      .orb {
        width: 34px;
        height: 34px;
        margin-left: -17px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">LUMEN HARVEST</div>
      <h1>グロウサイロ</h1>
      <p class="sub">4本の発光サイロを直接タップ。収穫口へ届く青い粒だけを抜き取り、赤い粒はそのまま見送る60秒の判断ゲーム。</p>
    </section>

    <section class="hud" aria-label="ゲーム情報">
      <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="timeValue">60.0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
      <div class="stat"><div class="label">Combo</div><div class="value" id="comboValue">x1</div></div>
      <div class="stat"><div class="label">Phase</div><div class="value" id="phaseValue">Warm</div></div>
    </section>

    <section class="arena" aria-label="グロウサイロの盤面">
      <div class="harvest-bar" aria-hidden="true">
        <div class="harvest-slot">Tap</div>
        <div class="harvest-slot">Blue</div>
        <div class="harvest-slot">Only</div>
        <div class="harvest-slot">Here</div>
      </div>
      <div class="silos" id="silos"></div>
      <div class="legend">
        <span>🔵 上端の青粒で加点</span>
        <span>🔴 赤粒を触ると失点</span>
      </div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">倉庫は静かでも、指先は忙しい。</h2>
          <p id="overlayText">各列の上端に青い粒が届いた瞬間をタップ。赤い粒は無視して、60秒で収穫記録を伸ばす。</p>
        </div>
      </div>
    </section>

    <section class="controls">
      <button type="button" id="startButton">スタート</button>
      <button type="button" class="secondary" id="retryButton">リトライ</button>
      <a class="back-link" href="../../">戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "webgame-glow-silo-best";
      const GAME_MS = 60000;
      const HARVEST_Y = 86;
      const PICK_WINDOW = 58;
      const BASE_POINTS = 10;
      const state = {
        running: false,
        score: 0,
        combo: 0,
        bestCombo: 0,
        runBeatBest: false,
        timeLeft: GAME_MS,
        lastFrame: 0,
        spawnClock: 0,
        nextId: 1,
        laneHeight: 0,
        highScore: Number(localStorage.getItem(STORAGE_KEY) || 0),
        items: []
      };

      const silos = document.getElementById("silos");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const scoreValue = document.getElementById("scoreValue");
      const timeValue = document.getElementById("timeValue");
      const bestValue = document.getElementById("bestValue");
      const comboValue = document.getElementById("comboValue");
      const phaseValue = document.getElementById("phaseValue");
      const startButton = document.getElementById("startButton");
      const retryButton = document.getElementById("retryButton");

      const lanes = [];

      function phaseConfig() {
        const elapsed = GAME_MS - state.timeLeft;
        if (elapsed < 30000) {
          return { label: "Warm", interval: 760, speed: 112, redChance: 0.22, maxLane: 3 };
        }
        if (elapsed < 45000) {
          return { label: "Rush", interval: 590, speed: 140, redChance: 0.32, maxLane: 4 };
        }
        return { label: "Storm", interval: 430, speed: 172, redChance: 0.42, maxLane: 5 };
      }

      function updateHud() {
        scoreValue.textContent = String(state.score);
        timeValue.textContent = (state.timeLeft / 1000).toFixed(1);
        bestValue.textContent = String(state.highScore);
        comboValue.textContent = `x${Math.max(1, state.combo)}`;
        comboValue.style.color = state.combo >= 6 ? "var(--gold)" : "";
        phaseValue.textContent = phaseConfig().label;
      }

      function laneCount(index) {
        return state.items.filter((item) => item.lane === index).length;
      }

      function buildLanes() {
        for (let i = 0; i < 4; i += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "lane";
          button.setAttribute("aria-label", `silo lane ${i + 1}`);

          const label = document.createElement("div");
          label.className = "lane-label";
          label.textContent = `L${i + 1}`;

          const fx = document.createElement("div");
          fx.className = "lane-fx";

          button.appendChild(label);
          button.appendChild(fx);
          button.addEventListener("pointerdown", () => tapLane(i));
          silos.appendChild(button);
          lanes.push({ button, fx });
        }
      }

      function clearLaneEffects() {
        for (const lane of lanes) {
          lane.button.classList.remove("flash-good", "flash-bad", "flash-empty");
          lane.fx.className = "lane-fx";
          lane.fx.textContent = "";
        }
      }

      function flashLane(index, type, text) {
        const lane = lanes[index];
        lane.button.classList.remove("flash-good", "flash-bad", "flash-empty");
        void lane.button.offsetWidth;
        lane.button.classList.add(type);
        const tone = type === "flash-good" ? "good" : type === "flash-bad" ? "bad" : "note";
        lane.fx.className = `lane-fx show ${tone}`;
        lane.fx.textContent = text;
        window.setTimeout(() => {
          lane.button.classList.remove(type);
          lane.fx.className = "lane-fx";
          lane.fx.textContent = "";
        }, 180);
      }

      function setOverlay(title, text) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.classList.remove("hidden");
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function resizeArena() {
        const firstLane = lanes[0]?.button;
        if (!firstLane) {
          return;
        }
        state.laneHeight = firstLane.clientHeight;
        renderItems();
      }

      function spawnItem() {
        const config = phaseConfig();
        const candidates = lanes
          .map((_, index) => ({ index, count: laneCount(index) }))
          .filter((entry) => entry.count < config.maxLane);
        if (candidates.length === 0) {
          return;
        }
        candidates.sort((a, b) => a.count - b.count || Math.random() - 0.5);
        const lane = candidates[0].index;
        const kind = Math.random() < config.redChance ? "red" : "blue";
        state.items.push({
          id: state.nextId,
          lane,
          kind,
          y: state.laneHeight + 34,
          speed: config.speed + Math.random() * 18
        });
        state.nextId += 1;
      }

      function removeItem(item, effectClass) {
        const orb = document.getElementById(`orb-${item.id}`);
        if (orb) {
          orb.classList.add("pop");
          window.setTimeout(() => orb.remove(), 120);
        }
        state.items = state.items.filter((entry) => entry.id !== item.id);
        if (effectClass) {
          const lane = lanes[item.lane];
          lane.button.classList.add(effectClass);
          window.setTimeout(() => lane.button.classList.remove(effectClass), 140);
        }
      }

      function tapLane(index) {
        if (!state.running) {
          return;
        }
        const candidate = state.items
          .filter((item) => item.lane === index && Math.abs(item.y - HARVEST_Y) <= PICK_WINDOW)
          .sort((a, b) => Math.abs(a.y - HARVEST_Y) - Math.abs(b.y - HARVEST_Y))[0];

        if (!candidate) {
          flashLane(index, "flash-empty", "MISS");
          return;
        }

        if (candidate.kind === "blue") {
          state.combo += 1;
          state.bestCombo = Math.max(state.bestCombo, state.combo);
          const bonus = Math.min(12, (state.combo - 1) * 2);
          state.score += BASE_POINTS + bonus;
          flashLane(index, "flash-good", `+${BASE_POINTS + bonus}`);
        } else {
          state.combo = 0;
          state.score = Math.max(0, state.score - 9);
          flashLane(index, "flash-bad", "-9");
        }

        removeItem(candidate, "");
        if (state.score > state.highScore) {
          state.highScore = state.score;
          state.runBeatBest = true;
          localStorage.setItem(STORAGE_KEY, String(state.highScore));
        }
        updateHud();
      }

      function resetItems() {
        state.items = [];
        silos.querySelectorAll(".orb").forEach((orb) => orb.remove());
        clearLaneEffects();
      }

      function resetGame() {
        state.running = false;
        state.score = 0;
        state.combo = 0;
        state.bestCombo = 0;
        state.runBeatBest = false;
        state.timeLeft = GAME_MS;
        state.lastFrame = 0;
        state.spawnClock = 0;
        resetItems();
        updateHud();
      }

      function startGame() {
        resetGame();
        resizeArena();
        state.running = true;
        hideOverlay();
        requestAnimationFrame(loop);
      }

      function endGame() {
        state.running = false;
        if (state.score > state.highScore) {
          state.highScore = state.score;
          state.runBeatBest = true;
          localStorage.setItem(STORAGE_KEY, String(state.highScore));
        }
        updateHud();
        setOverlay(
          state.runBeatBest ? "新記録、倉庫更新。" : "今日の収穫、終了。",
          `スコア ${state.score} / ベスト ${state.highScore} / 最大コンボ x${Math.max(1, state.bestCombo)}`
        );
      }

      function renderItems() {
        for (const item of state.items) {
          const lane = lanes[item.lane].button;
          let orb = document.getElementById(`orb-${item.id}`);
          if (!orb) {
            orb = document.createElement("div");
            orb.id = `orb-${item.id}`;
            orb.className = `orb ${item.kind}`;
            orb.textContent = item.kind === "blue" ? "●" : "◆";
            lane.appendChild(orb);
          }
          orb.style.top = `${item.y - 19}px`;
        }
      }

      function updateItems(deltaSec) {
        const expired = [];
        for (const item of state.items) {
          item.y -= item.speed * deltaSec;
          if (item.y <= HARVEST_Y - 24) {
            expired.push(item);
          }
        }

        for (const item of expired) {
          if (item.kind === "blue") {
            state.combo = 0;
            flashLane(item.lane, "flash-empty", "SKIP");
          }
          removeItem(item, "");
        }
      }

      function loop(timestamp) {
        if (!state.running) {
          return;
        }

        if (!state.lastFrame) {
          state.lastFrame = timestamp;
        }
        const deltaMs = Math.min(32, timestamp - state.lastFrame);
        state.lastFrame = timestamp;
        state.timeLeft = Math.max(0, state.timeLeft - deltaMs);
        state.spawnClock += deltaMs;

        const config = phaseConfig();
        while (state.spawnClock >= config.interval) {
          state.spawnClock -= config.interval;
          spawnItem();
        }

        updateItems(deltaMs / 1000);
        renderItems();
        updateHud();

        if (state.timeLeft <= 0) {
          endGame();
          return;
        }
        requestAnimationFrame(loop);
      }

      buildLanes();
      resizeArena();
      resetGame();
      setOverlay("倉庫は静かでも、指先は忙しい。", "各列の上端に青い粒が届いた瞬間をタップ。赤い粒は無視して、60秒で収穫記録を伸ばす。");

      startButton.addEventListener("pointerdown", startGame);
      retryButton.addEventListener("pointerdown", startGame);
      window.addEventListener("resize", resizeArena);
    })();
  </script>
</body>
</html>
