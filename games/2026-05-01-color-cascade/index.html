<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Color Cascade</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: system-ui, sans-serif; background:#0f1226; color:#eef3ff; display:flex; justify-content:center; }
    .app { width:min(100vw,430px); height:100vh; padding:14px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
    h1 { margin:0; font-size:1.3rem; }
    .hud { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; font-size:.82rem; }
    .chip { background:#1c2147; border:1px solid #2f386f; border-radius:10px; padding:8px; text-align:center; }
    #field { flex:1; background:linear-gradient(180deg,#151b39,#0d1024); border:1px solid #2f386f; border-radius:14px; position:relative; overflow:hidden; touch-action:manipulation; }
    .ball { position:absolute; width:32px; height:32px; border-radius:50%; box-shadow:0 0 12px rgba(255,255,255,.35) inset; }
    #tray { position:absolute; left:50%; transform:translateX(-50%); bottom:12px; width:62%; height:16px; border-radius:999px; border:2px solid #fff8; }
    .controls { display:flex; gap:10px; }
    button,a { border-radius:10px; border:none; padding:10px 12px; font-weight:700; }
    button { flex:1; background:#7ce0ff; color:#071021; }
    a { text-decoration:none; text-align:center; background:#2a315f; color:#eef3ff; }
    .hint { font-size:.78rem; opacity:.85; text-align:center; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🎨 Color Cascade</h1>
    <div class="hud">
      <div class="chip">Score<br><b id="score">0</b></div>
      <div class="chip">Time<br><b id="time">60.0</b></div>
      <div class="chip">Life<br><b id="life">3</b></div>
      <div class="chip">High<br><b id="high">0</b></div>
    </div>
    <div id="field" aria-label="game field">
      <div id="tray"></div>
    </div>
    <div class="controls">
      <button id="startBtn">Start</button>
      <a href="../../">戻る</a>
    </div>
    <div class="hint">フィールドをタップして受け皿の色を切替（赤→青→緑）</div>
  </main>
<script>
(() => {
  const COLORS=["#ff5a5a","#5ab0ff","#5cff96"];
  const KEY="webgame_highscore_color_cascade";
  const el={score:score,time:time,life:life,high:high,field:field,tray:tray,start:startBtn};
  let running=false, scoreV=0, lifeV=3, trayIdx=0, ball=null, endAt=0, last=0, nextSpawn=0;
  el.high.textContent=localStorage.getItem(KEY)||0;
  const setTray=()=>{ el.tray.style.background=COLORS[trayIdx]; };
  function spawnBall(nowLeft){
    const speedMul= nowLeft>30?1: nowLeft>15?1.25:1.45;
    const b=document.createElement('div'); b.className='ball';
    const idx=(Math.random()*3)|0; b.dataset.idx=idx;
    b.style.background=COLORS[idx]; b.style.left=(12+Math.random()*76)+'%'; b.style.top='-34px';
    b.dataset.y='-34'; b.dataset.v=(120*speedMul).toString();
    el.field.appendChild(b); ball=b;
  }
  function endGame(){
    running=false;
    if(ball) { ball.remove(); ball=null; }
    const hs=Math.max(Number(localStorage.getItem(KEY)||0),scoreV);
    localStorage.setItem(KEY,hs); el.high.textContent=hs; el.start.textContent='Retry';
  }
  function frame(ts){
    if(!running) return;
    if(!last) last=ts;
    const dt=(ts-last)/1000; last=ts;
    const left=Math.max(0,(endAt-performance.now())/1000);
    el.time.textContent=left.toFixed(1);
    if(left<=0||lifeV<=0){ endGame(); return; }
    if(!ball && ts>=nextSpawn){ spawnBall(left); nextSpawn=ts+(left>30?900:left>15?700:540); }
    if(ball){
      const y=Number(ball.dataset.y)+Number(ball.dataset.v)*dt;
      ball.dataset.y=y; ball.style.top=y+'px';
      const hitLine=el.field.clientHeight-30;
      if(y>=hitLine){
        if(Number(ball.dataset.idx)===trayIdx){ scoreV++; el.score.textContent=scoreV; }
        else { lifeV--; el.life.textContent=lifeV; }
        ball.remove(); ball=null;
      }
    }
    requestAnimationFrame(frame);
  }
  el.field.addEventListener('pointerdown',()=>{ if(!running) return; trayIdx=(trayIdx+1)%3; setTray(); });
  el.start.addEventListener('pointerdown',()=>{
    running=true; scoreV=0; lifeV=3; trayIdx=0; last=0; nextSpawn=0; if(ball){ball.remove(); ball=null;}
    el.score.textContent=0; el.life.textContent=3; setTray(); endAt=performance.now()+60000; el.start.textContent='Playing...';
    requestAnimationFrame(frame);
  });
  setTray();
})();
</script>
</body>
</html>
