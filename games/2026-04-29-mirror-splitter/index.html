<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>ミラースプリッタ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161"
       crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --panel: rgba(15, 24, 44, 0.92);
      --line: rgba(255, 255, 255, 0.14);
      --text: #eff6ff;
      --sub: #a9b7dd;
      --cyan: #7ce7ff;
      --gold: #ffe082;
      --red: #ff667f;
      --blue: #69b6ff;
      --safe: #79f0c5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(52, 98, 184, 0.34), transparent 34%),
        linear-gradient(180deg, #07101c 0%, #04070f 100%);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text);
    }
    body { touch-action: manipulation; }
    .shell {
      width: min(100vw, 430px);
      height: 100%;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }
    .title {
      background: linear-gradient(135deg, rgba(124, 231, 255, 0.22), rgba(255, 224, 130, 0.08));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px 12px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.24);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 5.8vw, 1.65rem);
      letter-spacing: 0.06em;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--sub);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 6px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .label {
      font-size: 0.68rem;
      color: var(--sub);
      letter-spacing: 0.12em;
    }
    .value {
      display: block;
      margin-top: 4px;
      font-size: 1.24rem;
      font-weight: 800;
    }
    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(15, 27, 54, 0.88), rgba(6, 11, 24, 0.95)),
        radial-gradient(circle at 50% 24%, rgba(124, 231, 255, 0.12), transparent 30%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
      padding-top: 12px;
    }
    .message {
      background: rgba(7, 11, 21, 0.76);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.78rem;
      color: var(--sub);
      backdrop-filter: blur(8px);
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    button, a {
      min-height: 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(21, 34, 62, 0.96), rgba(10, 15, 27, 0.96));
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.08em;
    }
    button {
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
    }
    button:disabled {
      opacity: 0.6;
    }
    a {
      padding: 0 14px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="title">
      <h1>🪞 ミラースプリッタ</h1>
      <div class="subtitle">タップでミラー反転。青は左ポケットへ、赤は右ダンプへ流して60秒を捌く。</div>
    </section>

    <section class="hud" aria-label="game status">
      <div class="panel"><span class="label">SCORE</span><span id="score" class="value">0</span></div>
      <div class="panel"><span class="label">TIME</span><span id="time" class="value">60.0</span></div>
      <div class="panel"><span class="label">HI</span><span id="hi" class="value">0</span></div>
    </section>

    <section id="stage" class="stage" aria-label="game field">
      <canvas id="field" width="390" height="700"></canvas>
      <div class="overlay"><div id="message" class="message">STARTで開始。プレイ中はどこでもタップでミラー反転。</div></div>
    </section>

    <div class="controls">
      <button id="start">START</button>
      <a href="../../">← 戻る</a>
    </div>
  </main>

  <script>
    (() => {
      const KEY = "mirror-splitter-hi";
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("field");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const timeEl = document.getElementById("time");
      const hiEl = document.getElementById("hi");
      const messageEl = document.getElementById("message");
      const startBtn = document.getElementById("start");

      let width = canvas.width;
      let height = canvas.height;
      let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

      let hiScore = Number(localStorage.getItem(KEY) || 0);
      let running = false;
      let score = 0;
      let timeLeft = 60;
      let mirrorDir = 1;
      let mirrorFlash = 0;
      let lastTs = 0;
      let spawnTimer = 0;
      let pulses = [];
      let streakGlow = 0;

      hiEl.textContent = String(hiScore);

      function resize() {
        const rect = stage.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = Math.max(460, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function difficulty(seconds) {
        if (seconds > 30) return { speed: 170, gap: 0.78, redRate: 0.25, burst: 0.08 };
        if (seconds > 15) return { speed: 212, gap: 0.58, redRate: 0.35, burst: 0.16 };
        return { speed: 252, gap: 0.43, redRate: 0.45, burst: 0.24 };
      }

      function resetGame() {
        running = false;
        score = 0;
        timeLeft = 60;
        mirrorDir = 1;
        mirrorFlash = 0;
        lastTs = 0;
        spawnTimer = 0;
        pulses = [];
        streakGlow = 0;
        scoreEl.textContent = "0";
        timeEl.textContent = "60.0";
        messageEl.textContent = "STARTで開始。プレイ中はどこでもタップでミラー反転。";
        startBtn.disabled = false;
        startBtn.textContent = "START";
      }

      function spawnPulse(config) {
        const centerBand = width * 0.18;
        const x = width * 0.5 + (Math.random() - 0.5) * centerBand;
        pulses.push({
          kind: Math.random() < config.redRate ? "red" : "blue",
          x,
          y: -18,
          vx: 0,
          vy: config.speed * (0.92 + Math.random() * 0.16),
          r: 10,
          routed: false
        });
      }

      function routePulse(pulse, config) {
        pulse.routed = true;
        pulse.vx = mirrorDir * config.speed * 0.92;
        pulse.vy = config.speed * 0.72;
      }

      function onTap(event) {
        event.preventDefault();
        if (!running) return;
        mirrorDir *= -1;
        mirrorFlash = 0.18;
      }

      function startGame(event) {
        event.preventDefault();
        score = 0;
        timeLeft = 60;
        mirrorDir = 1;
        mirrorFlash = 0;
        lastTs = 0;
        spawnTimer = 0.15;
        pulses = [];
        streakGlow = 0;
        running = true;
        scoreEl.textContent = "0";
        timeEl.textContent = "60.0";
        messageEl.textContent = "青を左へ、赤を右へ。タップで中央ミラーを返せ。";
        startBtn.disabled = true;
        startBtn.textContent = "PLAYING";
        requestAnimationFrame(loop);
      }

      function endGame() {
        running = false;
        startBtn.disabled = false;
        startBtn.textContent = "RETRY";
        if (score > hiScore) {
          hiScore = score;
          localStorage.setItem(KEY, String(hiScore));
          hiEl.textContent = String(hiScore);
          messageEl.textContent = "終了。新記録を更新。";
        } else {
          messageEl.textContent = "終了。RETRYでもう一度。";
        }
      }

      function update(dt) {
        const config = difficulty(timeLeft);
        timeLeft = Math.max(0, timeLeft - dt);
        timeEl.textContent = timeLeft.toFixed(1);
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnPulse(config);
          spawnTimer = config.gap;
          if (Math.random() < config.burst) spawnTimer *= 0.46;
        }

        const mirrorY = height * 0.46;
        const leftGoal = width * 0.24;
        const rightGoal = width * 0.76;
        const goalY = height - 76;

        mirrorFlash = Math.max(0, mirrorFlash - dt);
        streakGlow = Math.max(0, streakGlow - dt * 1.4);

        pulses.forEach((pulse) => {
          pulse.x += pulse.vx * dt;
          pulse.y += pulse.vy * dt;
          if (!pulse.routed && pulse.y >= mirrorY) routePulse(pulse, config);
        });

        pulses = pulses.filter((pulse) => {
          if (pulse.y < goalY) return true;

          const wentLeft = pulse.x < width * 0.5;
          if (pulse.kind === "blue" && wentLeft && Math.abs(pulse.x - leftGoal) < 92) {
            score += 1;
            streakGlow = 0.35;
          } else if (pulse.kind === "red" && !wentLeft && Math.abs(pulse.x - rightGoal) < 92) {
            streakGlow = Math.max(streakGlow, 0.12);
          } else if (pulse.kind === "red" && wentLeft) {
            score = Math.max(0, score - 2);
          }

          scoreEl.textContent = String(score);
          return false;
        });

        if (timeLeft <= 0) endGame();
      }

      function drawBackground() {
        ctx.clearRect(0, 0, width, height);

        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, "#102042");
        grad.addColorStop(0.55, "#081223");
        grad.addColorStop(1, "#040811");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "rgba(255,255,255,0.06)";
        ctx.lineWidth = 1;
        for (let i = 1; i < 7; i += 1) {
          const y = (height / 7) * i;
          ctx.beginPath();
          ctx.moveTo(14, y);
          ctx.lineTo(width - 14, y);
          ctx.stroke();
        }
      }

      function drawGoals() {
        const goalY = height - 64;
        ctx.fillStyle = "rgba(124, 231, 255, 0.16)";
        ctx.fillRect(18, goalY - 16, width * 0.28, 34);
        ctx.fillStyle = "rgba(255, 102, 127, 0.12)";
        ctx.fillRect(width - 18 - width * 0.28, goalY - 16, width * 0.28, 34);

        ctx.strokeStyle = "rgba(255,255,255,0.14)";
        ctx.lineWidth = 2;
        ctx.strokeRect(18, goalY - 16, width * 0.28, 34);
        ctx.strokeRect(width - 18 - width * 0.28, goalY - 16, width * 0.28, 34);

        ctx.fillStyle = "#9cdcff";
        ctx.font = "700 14px system-ui";
        ctx.fillText("BLUE SCORE", 28, goalY + 5);
        ctx.fillStyle = "#ff9aab";
        ctx.fillText("RED DUMP", width - 18 - width * 0.28 + 20, goalY + 5);
      }

      function drawMirror() {
        const x = width * 0.5;
        const y = height * 0.46;
        const len = Math.min(width, height) * 0.18;
        const angle = mirrorDir === 1 ? Math.PI / 4 : -Math.PI / 4;
        const dx = Math.cos(angle) * len * 0.5;
        const dy = Math.sin(angle) * len * 0.5;

        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = mirrorFlash > 0 ? "#ffe082" : "#e8f4ff";
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        ctx.shadowBlur = mirrorFlash > 0 ? 22 : 12;
        ctx.shadowColor = mirrorFlash > 0 ? "#ffe082" : "#7ce7ff";
        ctx.beginPath();
        ctx.moveTo(-dx, -dy);
        ctx.lineTo(dx, dy);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPulses() {
        pulses.forEach((pulse) => {
          ctx.fillStyle = pulse.kind === "blue" ? "#69b6ff" : "#ff667f";
          ctx.shadowBlur = pulse.kind === "blue" ? 16 : 14;
          ctx.shadowColor = pulse.kind === "blue" ? "#69b6ff" : "#ff667f";
          ctx.beginPath();
          ctx.arc(pulse.x, pulse.y, pulse.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        });
      }

      function drawGuide() {
        const centerX = width * 0.5;
        const topY = 18;
        const mirrorY = height * 0.46;

        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(centerX, topY);
        ctx.lineTo(centerX, mirrorY - 24);
        ctx.stroke();

        ctx.fillStyle = streakGlow > 0 ? "rgba(121,240,197,0.2)" : "rgba(255,255,255,0.04)";
        ctx.fillRect(18, height - 94, width - 36, 44);
      }

      function render() {
        drawBackground();
        drawGuide();
        drawGoals();
        drawMirror();
        drawPulses();
      }

      function loop(ts) {
        if (!running) {
          render();
          return;
        }

        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.033, (ts - lastTs) / 1000);
        lastTs = ts;

        update(dt);
        render();

        if (running) requestAnimationFrame(loop);
        else render();
      }

      window.addEventListener("resize", resize);
      stage.addEventListener("pointerdown", onTap);
      startBtn.addEventListener("pointerdown", startGame);

      resize();
      resetGame();
      render();
    })();
  </script>
</body>
</html>
