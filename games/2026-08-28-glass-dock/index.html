<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>グラスドック</title>
  <meta name="description" content="タップしたレーンへ桟橋を滑らせ、青い雫だけを受けて赤い火花を避ける60秒ゲーム。" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-top: #11213a;
      --bg-bottom: #050b14;
      --panel: rgba(8, 16, 30, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --text: #edf7ff;
      --muted: rgba(237, 247, 255, 0.72);
      --cyan: #7ae7ff;
      --mint: #8fffd2;
      --amber: #ffd979;
      --coral: #ff7c87;
      --ink: #07121d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(122, 231, 255, 0.18), transparent 22%),
        radial-gradient(circle at 85% 18%, rgba(255, 217, 121, 0.14), transparent 24%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .shell {
      width: min(100vw, 430px);
      height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      overflow: hidden;
    }

    .panel,
    .hud,
    .controls {
      position: relative;
      z-index: 2;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
    }

    .panel {
      padding: 14px 16px 12px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(237, 247, 255, 0.58);
    }

    h1 {
      margin: 4px 0 0;
      font-size: 1.76rem;
      line-height: 1.04;
      letter-spacing: 0.04em;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .hud {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 8px 4px;
      border-radius: 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .label {
      margin-bottom: 4px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(237, 247, 255, 0.52);
    }

    .value {
      font-size: 0.84rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #laneValue.hot,
    #comboValue.hot {
      color: var(--amber);
    }

    .arena {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        radial-gradient(circle at 50% 6%, rgba(255, 255, 255, 0.08), transparent 16%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 20%),
        linear-gradient(180deg, rgba(8, 18, 33, 0.96), rgba(2, 7, 15, 1));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 18px 40px rgba(0, 0, 0, 0.3);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(3, 9, 16, 0.2), rgba(3, 9, 16, 0.88));
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 24px;
      background: rgba(7, 18, 32, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.32);
    }

    .overlay-card h2 {
      margin: 0 0 10px;
      font-size: 1.34rem;
    }

    .overlay-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.62;
    }

    .tap-note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      color: rgba(237, 247, 255, 0.9);
      background: rgba(3, 9, 16, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
    }

    .controls {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
    }

    button,
    .back-link {
      appearance: none;
      border: none;
      border-radius: 16px;
      min-height: 50px;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    button {
      color: var(--ink);
      background: linear-gradient(135deg, var(--amber), var(--cyan));
      box-shadow: 0 12px 24px rgba(122, 231, 255, 0.18);
    }

    button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 380px) {
      .shell {
        padding-left: 10px;
        padding-right: 10px;
      }

      h1 {
        font-size: 1.54rem;
      }

      .sub {
        font-size: 0.88rem;
      }

      .hud {
        gap: 6px;
      }

      .value {
        font-size: 0.76rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Daily Game Factory</div>
      <h1>グラスドック</h1>
      <p class="sub">タップしたレーンへ桟橋を滑らせ、青い雫だけを受けて赤い火花をかわす。</p>
    </section>

    <section class="hud" aria-label="status">
      <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="timeValue">60.0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
      <div class="stat"><div class="label">Combo</div><div class="value" id="comboValue">x1</div></div>
      <div class="stat"><div class="label">Lane</div><div class="value" id="laneValue">L1</div></div>
    </section>

    <section class="arena" id="arena">
      <canvas id="game" width="402" height="620" aria-label="game area"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">雫を迎える桟橋を選べ</h2>
          <p id="overlayText">ゲームエリアをタップすると、その列へ桟橋が滑る。青い雫で加点、赤い火花を受けると失点。60秒でどこまで伸ばせるか。</p>
        </div>
      </div>
      <div class="tap-note">画面をタップして4レーン移動</div>
    </section>

    <section class="controls">
      <button id="startButton" type="button">スタート</button>
      <button id="retryButton" class="secondary" type="button">リトライ</button>
      <a class="back-link" href="../../">戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "glass-dock-highscore";
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const arena = document.getElementById("arena");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startButton = document.getElementById("startButton");
      const retryButton = document.getElementById("retryButton");
      const scoreValue = document.getElementById("scoreValue");
      const timeValue = document.getElementById("timeValue");
      const bestValue = document.getElementById("bestValue");
      const comboValue = document.getElementById("comboValue");
      const laneValue = document.getElementById("laneValue");

      const laneCenters = [66, 156, 246, 336];
      const state = {
        running: false,
        started: false,
        score: 0,
        best: Number(localStorage.getItem(STORAGE_KEY) || 0),
        combo: 0,
        timeLeft: 60,
        targetLane: 0,
        dockX: laneCenters[0],
        drops: [],
        particles: [],
        spawnTimer: 0.2,
        lastTime: 0
      };

      function fitCanvas() {
        const rect = arena.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function phaseConfig(elapsed) {
        if (elapsed < 30) {
          return { speed: 180, spawn: 0.76, redChance: 0.22 };
        }
        if (elapsed < 45) {
          return { speed: 224, spawn: 0.58, redChance: 0.33 };
        }
        return { speed: 268, spawn: 0.46, redChance: 0.42 };
      }

      function syncHud() {
        scoreValue.textContent = String(state.score);
        timeValue.textContent = state.timeLeft.toFixed(1);
        bestValue.textContent = String(state.best);
        comboValue.textContent = "x" + Math.max(1, state.combo);
        comboValue.classList.toggle("hot", state.combo >= 4);
        laneValue.textContent = "L" + String(state.targetLane + 1);
      }

      function resetState() {
        state.running = false;
        state.started = false;
        state.score = 0;
        state.combo = 0;
        state.timeLeft = 60;
        state.targetLane = 0;
        state.dockX = laneCenters[0];
        state.drops = [];
        state.particles = [];
        state.spawnTimer = 0.2;
        state.lastTime = 0;
        syncHud();
        overlayTitle.textContent = "雫を迎える桟橋を選べ";
        overlayText.textContent = "ゲームエリアをタップすると、その列へ桟橋が滑る。青い雫で加点、赤い火花を受けると失点。60秒でどこまで伸ばせるか。";
        overlay.classList.remove("hidden");
      }

      function startGame() {
        state.running = true;
        state.started = true;
        state.score = 0;
        state.combo = 0;
        state.timeLeft = 60;
        state.targetLane = 1;
        state.dockX = laneCenters[1];
        state.drops = [];
        state.particles = [];
        state.spawnTimer = 0.15;
        state.lastTime = 0;
        syncHud();
        overlay.classList.add("hidden");
      }

      function burst(x, y, color, amount) {
        for (let i = 0; i < amount; i += 1) {
          state.particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 90,
            vy: (Math.random() - 0.5) * 90,
            life: 0.5 + Math.random() * 0.35,
            size: 2 + Math.random() * 4,
            color
          });
        }
      }

      function adjustScore(delta, keepCombo) {
        state.score = Math.max(0, state.score + delta);
        state.combo = keepCombo ? state.combo + 1 : 0;
        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem(STORAGE_KEY, String(state.best));
        }
        syncHud();
      }

      function spawnDrop() {
        const elapsed = 60 - state.timeLeft;
        const config = phaseConfig(elapsed);
        const lane = Math.floor(Math.random() * laneCenters.length);
        const red = Math.random() < config.redChance;
        state.drops.push({
          lane,
          x: laneCenters[lane] + (Math.random() - 0.5) * 12,
          y: -20,
          speed: config.speed * (0.92 + Math.random() * 0.18),
          radius: red ? 10 : 11,
          red,
          wobble: Math.random() * Math.PI * 2
        });
      }

      function chooseLane(clientX) {
        if (!state.running) {
          return;
        }
        const rect = arena.getBoundingClientRect();
        const x = clientX - rect.left;
        const laneWidth = rect.width / laneCenters.length;
        const nextLane = Math.max(0, Math.min(laneCenters.length - 1, Math.floor(x / laneWidth)));
        state.targetLane = nextLane;
        laneValue.textContent = "L" + String(nextLane + 1);
        laneValue.classList.add("hot");
        window.setTimeout(() => laneValue.classList.remove("hot"), 120);
      }

      function endGame() {
        state.running = false;
        overlayTitle.textContent = state.score >= state.best ? "ハイスコア更新" : "ドック閉場";
        overlayText.textContent = "スコア " + state.score + " / BEST " + state.best + "。リトライでもう一度 60 秒の桟橋さばき。";
        overlay.classList.remove("hidden");
      }

      function drawBackground(width, height) {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#24466e");
        gradient.addColorStop(0.52, "#10233d");
        gradient.addColorStop(1, "#07101b");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "rgba(255,255,255,0.06)";
        for (let i = 0; i < 20; i += 1) {
          ctx.beginPath();
          ctx.arc(((i * 43) % width), 32 + (i % 5) * 18, 1.5 + (i % 3), 0, Math.PI * 2);
          ctx.fill();
        }

        const laneWidth = width / laneCenters.length;
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 2;
        for (let i = 1; i < laneCenters.length; i += 1) {
          ctx.beginPath();
          ctx.moveTo(i * laneWidth, 26);
          ctx.lineTo(i * laneWidth, height - 98);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(122,231,255,0.18)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(20, height - 78);
        ctx.lineTo(width - 20, height - 78);
        ctx.stroke();
      }

      function drawDock(width, height) {
        const dockY = height - 78;
        const targetX = laneCenters[state.targetLane];
        state.dockX += (targetX - state.dockX) * 0.18;

        ctx.fillStyle = "rgba(122,231,255,0.18)";
        ctx.fillRect(state.dockX - 36, dockY - 12, 72, 18);

        ctx.fillStyle = "#102b42";
        ctx.strokeStyle = "#7ae7ff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(state.dockX - 38, dockY - 28, 76, 34, 16);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#8fffd2";
        ctx.fillRect(state.dockX - 24, dockY - 20, 48, 10);

        ctx.strokeStyle = "rgba(255, 217, 121, 0.55)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(state.dockX, dockY - 28);
        ctx.lineTo(state.dockX, dockY - 54);
        ctx.stroke();

        ctx.fillStyle = "#ffd979";
        ctx.beginPath();
        ctx.arc(state.dockX, dockY - 57, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawDrops(height) {
        const catchY = height - 104;
        state.drops = state.drops.filter((drop) => {
          drop.y += drop.speed / 60;
          drop.x += Math.sin((drop.y / 44) + drop.wobble) * 0.3;

          if (Math.abs(drop.y - catchY) < 18 && Math.abs(drop.x - state.dockX) < 40) {
            if (drop.red) {
              burst(drop.x, catchY, "#ff7c87", 10);
              adjustScore(-12, false);
            } else {
              burst(drop.x, catchY, "#8fffd2", 12);
              adjustScore(10 + Math.min(state.combo, 8) * 2, true);
            }
            return false;
          }

          if (drop.y > height + 24) {
            return false;
          }

          if (drop.red) {
            ctx.fillStyle = "#ff7c87";
            ctx.shadowColor = "rgba(255,124,135,0.45)";
          } else {
            ctx.fillStyle = "#7ae7ff";
            ctx.shadowColor = "rgba(122,231,255,0.45)";
          }
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y - drop.radius);
          ctx.quadraticCurveTo(drop.x + drop.radius, drop.y - 2, drop.x, drop.y + drop.radius + 2);
          ctx.quadraticCurveTo(drop.x - drop.radius, drop.y - 2, drop.x, drop.y - drop.radius);
          ctx.fill();
          ctx.shadowBlur = 0;
          return true;
        });
      }

      function drawParticles() {
        state.particles = state.particles.filter((particle) => {
          particle.life -= 1 / 60;
          particle.x += particle.vx / 60;
          particle.y += particle.vy / 60;
          particle.vx *= 0.98;
          particle.vy *= 0.98;
          if (particle.life <= 0) {
            return false;
          }
          ctx.globalAlpha = Math.max(0, particle.life);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          return true;
        });
      }

      function drawLabels(width, height) {
        const laneWidth = width / laneCenters.length;
        ctx.textAlign = "center";
        ctx.font = "bold 13px Trebuchet MS";
        for (let i = 0; i < laneCenters.length; i += 1) {
          ctx.fillStyle = i === state.targetLane ? "#ffd979" : "rgba(237,247,255,0.55)";
          ctx.fillText("L" + String(i + 1), laneWidth * i + laneWidth / 2, height - 44);
        }
      }

      function update(dt) {
        if (!state.running) {
          return;
        }

        state.timeLeft = Math.max(0, state.timeLeft - dt);
        if (state.timeLeft <= 0) {
          syncHud();
          endGame();
          return;
        }

        const elapsed = 60 - state.timeLeft;
        const config = phaseConfig(elapsed);
        state.spawnTimer -= dt;
        while (state.spawnTimer <= 0) {
          spawnDrop();
          state.spawnTimer += config.spawn * (0.9 + Math.random() * 0.25);
        }

        syncHud();
      }

      function render() {
        const width = canvas.width / (Math.min(window.devicePixelRatio || 1, 2));
        const height = canvas.height / (Math.min(window.devicePixelRatio || 1, 2));
        ctx.clearRect(0, 0, width, height);
        drawBackground(width, height);
        drawDock(width, height);
        drawDrops(height);
        drawParticles();
        drawLabels(width, height);
      }

      function frame(ts) {
        if (!state.lastTime) {
          state.lastTime = ts;
        }
        const dt = Math.min((ts - state.lastTime) / 1000, 0.05);
        state.lastTime = ts;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      arena.addEventListener("pointerdown", (event) => {
        chooseLane(event.clientX);
      });
      startButton.addEventListener("pointerdown", startGame);
      retryButton.addEventListener("pointerdown", startGame);
      window.addEventListener("resize", fitCanvas);

      fitCanvas();
      resetState();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
