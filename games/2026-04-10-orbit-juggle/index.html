<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>オービットジャグル</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #090b1a;
      --panel: #171b33;
      --accent: #7be7ff;
      --good: #5bff9f;
      --bad: #ff5f7a;
      --text: #f3f6ff;
      --muted: #9aa4c8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #1d2250 0%, var(--bg) 58%);
      color: var(--text);
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
    }
    .app {
      height: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 12px 14px 16px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .topbar a {
      color: #cdd7ff;
      text-decoration: none;
      border-bottom: 1px solid #4a5688;
      padding-bottom: 1px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 28px);
      letter-spacing: 0.04em;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }
    .stat .label { font-size: 11px; color: var(--muted); }
    .stat .value { margin-top: 2px; font-weight: 700; font-size: 18px; }

    #playfield {
      position: relative;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.22));
      overflow: hidden;
      min-height: 0;
    }
    .lane-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.09);
    }
    .lane-marker:nth-child(1) { left: 33.333%; }
    .lane-marker:nth-child(2) { left: 66.666%; }

    .orb {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 14px rgba(255,255,255,0.35);
    }
    .orb.good { background: radial-gradient(circle at 35% 30%, #d8ffea, var(--good)); }
    .orb.bad { background: radial-gradient(circle at 35% 30%, #ffd9e0, var(--bad)); }

    #ring {
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: 170px;
      height: 170px;
      transform: translateX(-50%);
      border: 2px solid rgba(123,231,255,0.32);
      border-radius: 50%;
      pointer-events: none;
    }
    .slot {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.04);
      transform: translate(-50%, -50%);
    }
    .slot.active {
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(123,231,255,0.7);
      background: rgba(123,231,255,0.2);
    }

    .footer {
      display: grid;
      gap: 8px;
    }
    #startBtn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 17px;
      font-weight: 800;
      color: #062133;
      background: linear-gradient(135deg, #79f1ff, #52ffbf);
    }
    #message {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <a href="../../">← 作品集へ戻る</a>
      <span>1 PLAY / 60 SEC</span>
    </div>

    <h1>オービットジャグル</h1>

    <div class="hud">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">TIME</div><div class="value" id="time">60.0</div></div>
      <div class="stat"><div class="label">HI</div><div class="value" id="hi">0</div></div>
    </div>

    <div id="playfield" aria-label="game field">
      <div class="lane-marker"></div><div class="lane-marker"></div>
      <div id="ring"></div>
    </div>

    <div class="footer">
      <button id="startBtn">START</button>
      <div id="message">タップでキャッチ位置を回して、青を拾い赤を避ける。</div>
    </div>
  </div>

  <script>
    (() => {
      const KEY = 'orbit-juggle-hi-v1';
      const DURATION = 60;
      const lanes = [0.18, 0.5, 0.82];
      const slots = [];
      let activeLane = 1;
      let running = false;
      let score = 0;
      let hi = Number(localStorage.getItem(KEY) || 0);
      let timeLeft = DURATION;
      let spawnTimer = 0;
      let elapsed = 0;
      let lastTs = 0;
      let rafId = 0;
      const orbs = [];

      const playfield = document.getElementById('playfield');
      const ring = document.getElementById('ring');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const hiEl = document.getElementById('hi');
      const msgEl = document.getElementById('message');
      const startBtn = document.getElementById('startBtn');
      hiEl.textContent = hi;

      function setupSlots() {
        const centerX = 85;
        const centerY = 85;
        const radius = 70;
        const angles = [210, 270, 330];
        for (let i = 0; i < 3; i++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          const rad = angles[i] * Math.PI / 180;
          slot.style.left = `${centerX + Math.cos(rad) * radius}px`;
          slot.style.top = `${centerY + Math.sin(rad) * radius}px`;
          ring.appendChild(slot);
          slots.push(slot);
        }
        renderActiveSlot();
      }

      function renderActiveSlot() {
        slots.forEach((slot, i) => slot.classList.toggle('active', i === activeLane));
      }

      function resetGame() {
        running = true;
        score = 0;
        timeLeft = DURATION;
        spawnTimer = 0;
        elapsed = 0;
        activeLane = 1;
        renderActiveSlot();
        lastTs = 0;
        clearOrbs();
        updateHud();
        msgEl.textContent = 'GO';
      }

      function clearOrbs() {
        while (orbs.length) {
          const orb = orbs.pop();
          orb.el.remove();
        }
      }

      function updateHud() {
        scoreEl.textContent = score;
        timeEl.textContent = Math.max(0, timeLeft).toFixed(1);
        hiEl.textContent = hi;
      }

      function difficulty() {
        if (timeLeft > 30) return { spawnMs: 760, speed: 0.20, badRate: 0.20 };
        if (timeLeft > 15) return { spawnMs: 620, speed: 0.24, badRate: 0.30 };
        return { spawnMs: 500, speed: 0.29, badRate: 0.38 };
      }

      function spawnOrb() {
        const d = difficulty();
        const lane = Math.floor(Math.random() * 3);
        const isBad = Math.random() < d.badRate;
        const el = document.createElement('div');
        el.className = `orb ${isBad ? 'bad' : 'good'}`;
        playfield.appendChild(el);
        const orb = {
          lane,
          y: -24,
          speed: d.speed,
          bad: isBad,
          el,
          hit: false,
        };
        orbs.push(orb);
      }

      function onTap() {
        if (!running) return;
        activeLane = (activeLane + 1) % 3;
        renderActiveSlot();
      }

      function updateOrbs(dt) {
        const h = playfield.clientHeight;
        const catchY = h - 100;
        for (let i = orbs.length - 1; i >= 0; i--) {
          const o = orbs[i];
          o.y += o.speed * dt;
          const x = lanes[o.lane] * playfield.clientWidth;
          o.el.style.left = `${x}px`;
          o.el.style.top = `${o.y}px`;

          if (!o.hit && o.y >= catchY && o.y <= catchY + 28 && o.lane === activeLane) {
            o.hit = true;
            if (o.bad) score = Math.max(0, score - 8);
            else score += 10;
            o.el.remove();
            orbs.splice(i, 1);
            continue;
          }

          if (o.y > h + 24) {
            if (!o.bad && !o.hit) score = Math.max(0, score - 4);
            o.el.remove();
            orbs.splice(i, 1);
          }
        }
      }

      function tick(ts) {
        if (!running) return;
        if (!lastTs) lastTs = ts;
        const dt = Math.min(50, ts - lastTs);
        lastTs = ts;

        timeLeft -= dt / 1000;
        elapsed += dt;
        const d = difficulty();
        spawnTimer += dt;
        while (spawnTimer >= d.spawnMs) {
          spawnTimer -= d.spawnMs;
          spawnOrb();
        }

        updateOrbs(dt);
        updateHud();

        if (timeLeft <= 0) {
          endGame();
          return;
        }

        rafId = requestAnimationFrame(tick);
      }

      function endGame() {
        running = false;
        cancelAnimationFrame(rafId);
        if (score > hi) {
          hi = score;
          localStorage.setItem(KEY, String(hi));
          msgEl.textContent = `終了！ 新ハイスコア ${score}`;
        } else {
          msgEl.textContent = `終了！ スコア ${score}`;
        }
        updateHud();
      }

      startBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        resetGame();
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(tick);
      });

      document.getElementById('app').addEventListener('pointerdown', (e) => {
        if (e.target === startBtn) return;
        onTap();
      }, { passive: false });

      setupSlots();
      updateHud();
    })();
  </script>
</body>
</html>
