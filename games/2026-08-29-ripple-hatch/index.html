<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>リップルハッチ</title>
  <meta name="description" content="4本の水路をタップしてハッチを開き、青い滴だけを迎え入れて赤い火花を見送る60秒ゲーム。" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-top: #081220;
      --bg-bottom: #03070e;
      --panel: rgba(8, 19, 34, 0.8);
      --line: rgba(255, 255, 255, 0.1);
      --text: #eff6ff;
      --muted: rgba(239, 246, 255, 0.72);
      --cyan: #7ce6ff;
      --mint: #89ffcf;
      --amber: #ffd576;
      --coral: #ff7d88;
      --ink: #06111b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(124, 230, 255, 0.18), transparent 22%),
        radial-gradient(circle at 88% 12%, rgba(255, 213, 118, 0.16), transparent 20%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .shell {
      width: min(100vw, 430px);
      height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      overflow: hidden;
    }

    .panel,
    .hud,
    .controls {
      position: relative;
      z-index: 2;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
    }

    .panel {
      padding: 14px 16px 12px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(239, 246, 255, 0.58);
    }

    h1 {
      margin: 4px 0 0;
      font-size: 1.72rem;
      line-height: 1.04;
      letter-spacing: 0.04em;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .hud {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 8px 4px;
      border-radius: 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .label {
      margin-bottom: 4px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(239, 246, 255, 0.52);
    }

    .value {
      font-size: 0.84rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #comboValue.hot,
    #phaseValue.hot {
      color: var(--amber);
    }

    .arena {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        radial-gradient(circle at 50% 4%, rgba(255, 255, 255, 0.08), transparent 16%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%),
        linear-gradient(180deg, rgba(4, 12, 23, 0.96), rgba(1, 5, 12, 1));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 18px 40px rgba(0, 0, 0, 0.3);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(2, 8, 16, 0.2), rgba(2, 8, 16, 0.88));
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 24px;
      background: rgba(6, 16, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.32);
    }

    .overlay-card h2 {
      margin: 0 0 10px;
      font-size: 1.34rem;
    }

    .overlay-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.62;
    }

    .tap-note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      color: rgba(239, 246, 255, 0.92);
      background: rgba(2, 8, 16, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
    }

    .controls {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
    }

    button,
    .back-link {
      appearance: none;
      border: none;
      border-radius: 16px;
      min-height: 50px;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    button {
      color: var(--ink);
      background: linear-gradient(135deg, var(--amber), var(--cyan));
      box-shadow: 0 12px 24px rgba(124, 230, 255, 0.18);
    }

    button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 380px) {
      .shell {
        padding-left: 10px;
        padding-right: 10px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .sub {
        font-size: 0.88rem;
      }

      .hud {
        gap: 6px;
      }

      .value {
        font-size: 0.76rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Daily Game Factory</div>
      <h1>リップルハッチ</h1>
      <p class="sub">4本の水路を直接タップ。開いたハッチで青だけ迎え、赤は閉じたまま流して稼ぐ60秒。</p>
    </section>

    <section class="hud" aria-label="ゲーム情報">
      <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="timeValue">60.0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
      <div class="stat"><div class="label">Combo</div><div class="value" id="comboValue">x1</div></div>
      <div class="stat"><div class="label">Phase</div><div class="value" id="phaseValue">Calm</div></div>
    </section>

    <section class="arena" id="arena">
      <canvas id="gameCanvas" width="390" height="620" aria-label="ゲーム画面"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">ハッチを叩け</h2>
          <p id="overlayText">右から流れてくる青い滴が左のハッチに届く瞬間、同じ行をタップ。赤い火花は開けずに見送る。</p>
        </div>
      </div>
      <div class="tap-note">水路を直接タップしてハッチを開く</div>
    </section>

    <section class="controls">
      <button id="startButton" type="button">スタート</button>
      <button id="retryButton" class="secondary" type="button">リトライ</button>
      <a class="back-link" href="../../">作品集へ戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "webgame-ripple-hatch-best";
      const GAME_SECONDS = 60;
      const LANE_COUNT = 4;
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const arena = document.getElementById("arena");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startButton = document.getElementById("startButton");
      const retryButton = document.getElementById("retryButton");
      const scoreValue = document.getElementById("scoreValue");
      const timeValue = document.getElementById("timeValue");
      const bestValue = document.getElementById("bestValue");
      const comboValue = document.getElementById("comboValue");
      const phaseValue = document.getElementById("phaseValue");

      const state = {
        running: false,
        score: 0,
        best: Number.parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10) || 0,
        combo: 0,
        timeLeft: GAME_SECONDS,
        elapsed: 0,
        spawnClock: 0,
        lastFrame: 0,
        pulses: [],
        particles: [],
        ripples: [],
        lanes: Array.from({ length: LANE_COUNT }, () => ({ openUntil: 0, glow: 0 })),
      };

      const droplets = [];

      function resizeCanvas() {
        const rect = arena.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function laneHeight() {
        return arena.clientHeight / LANE_COUNT;
      }

      function gateX() {
        return Math.max(72, arena.clientWidth * 0.18);
      }

      function baseSpeed() {
        if (state.elapsed >= 45) return 190;
        if (state.elapsed >= 30) return 158;
        return 128;
      }

      function redRatio() {
        if (state.elapsed >= 45) return 0.42;
        if (state.elapsed >= 30) return 0.3;
        return 0.18;
      }

      function spawnInterval() {
        if (state.elapsed >= 45) return 0.48;
        if (state.elapsed >= 30) return 0.64;
        return 0.84;
      }

      function phaseLabel() {
        if (state.elapsed >= 45) return "Surge";
        if (state.elapsed >= 30) return "Rush";
        return "Calm";
      }

      function syncHud() {
        scoreValue.textContent = String(state.score);
        timeValue.textContent = state.timeLeft.toFixed(1);
        bestValue.textContent = String(state.best);
        comboValue.textContent = `x${Math.max(1, state.combo)}`;
        comboValue.classList.toggle("hot", state.combo >= 5);
        const phase = phaseLabel();
        phaseValue.textContent = phase;
        phaseValue.classList.toggle("hot", phase !== "Calm");
      }

      function setOverlay(title, text, hidden) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.classList.toggle("hidden", hidden);
      }

      function resetGame() {
        state.running = false;
        state.score = 0;
        state.combo = 0;
        state.timeLeft = GAME_SECONDS;
        state.elapsed = 0;
        state.spawnClock = 0;
        state.lastFrame = 0;
        state.pulses.length = 0;
        state.particles.length = 0;
        state.ripples.length = 0;
        droplets.length = 0;
        state.lanes.forEach((lane) => {
          lane.openUntil = 0;
          lane.glow = 0;
        });
        syncHud();
      }

      function startGame() {
        resetGame();
        state.running = true;
        setOverlay("リップルハッチ", "青い滴が左端のハッチへ届く瞬間に、その行をタップ。赤は開けない。", true);
      }

      function finishGame() {
        state.running = false;
        const isNewBest = state.score > state.best;
        if (isNewBest) {
          state.best = state.score;
          localStorage.setItem(STORAGE_KEY, String(state.best));
        }
        syncHud();
        setOverlay(
          isNewBest ? "自己記録更新" : "60秒終了",
          `スコア ${state.score} / ベスト ${state.best}。リトライで今日の水路をもう一度捌ける。`,
          false
        );
      }

      function openLane(index) {
        if (index < 0 || index >= LANE_COUNT) return;
        const now = performance.now();
        const lane = state.lanes[index];
        lane.openUntil = now + 520;
        lane.glow = 1;
        state.pulses.push({ lane: index, life: 0.34 });
        state.ripples.push({ lane: index, radius: 16, life: 0.32 });
      }

      function onArenaPointer(event) {
        if (!state.running) return;
        const rect = canvas.getBoundingClientRect();
        const y = event.clientY - rect.top;
        const index = Math.max(0, Math.min(LANE_COUNT - 1, Math.floor((y / rect.height) * LANE_COUNT)));
        openLane(index);
      }

      function spawnDroplet() {
        const lane = Math.floor(Math.random() * LANE_COUNT);
        const speed = baseSpeed() + Math.random() * 42;
        const type = Math.random() < redRatio() ? "bad" : "good";
        droplets.push({
          lane,
          x: arena.clientWidth + 22,
          yJitter: (Math.random() - 0.5) * laneHeight() * 0.18,
          radius: type === "good" ? 11 : 10,
          speed,
          type,
          judged: false,
          pulse: Math.random() * Math.PI * 2,
        });
      }

      function addParticles(x, y, color, count) {
        for (let i = 0; i < count; i += 1) {
          state.particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 110,
            vy: (Math.random() - 0.5) * 110,
            life: 0.45 + Math.random() * 0.2,
            color,
          });
        }
      }

      function scoreDroplet(drop) {
        state.combo += 1;
        const bonus = Math.min(5, Math.floor(state.combo / 3));
        state.score += 1 + bonus;
        addParticles(drop.x, laneCenter(drop.lane), "124,230,255", 10);
      }

      function failDroplet(drop) {
        state.score = Math.max(0, state.score - 3);
        state.combo = 0;
        addParticles(drop.x, laneCenter(drop.lane), "255,125,136", 12);
      }

      function missDroplet(drop) {
        if (drop.type === "good") {
          state.combo = 0;
          addParticles(drop.x, laneCenter(drop.lane), "255,213,118", 6);
        }
      }

      function laneCenter(index) {
        return laneHeight() * (index + 0.5);
      }

      function update(dt) {
        if (!state.running) return;

        state.elapsed += dt;
        state.timeLeft = Math.max(0, GAME_SECONDS - state.elapsed);
        state.spawnClock += dt;

        while (state.spawnClock >= spawnInterval()) {
          state.spawnClock -= spawnInterval();
          spawnDroplet();
          if (state.elapsed >= 45 && Math.random() < 0.32) {
            spawnDroplet();
          }
        }

        const now = performance.now();
        state.lanes.forEach((lane) => {
          const targetGlow = lane.openUntil > now ? 1 : 0;
          lane.glow += (targetGlow - lane.glow) * Math.min(1, dt * 10);
        });

        for (let i = droplets.length - 1; i >= 0; i -= 1) {
          const drop = droplets[i];
          drop.x -= drop.speed * dt;
          drop.pulse += dt * 4;
          const gate = state.lanes[drop.lane];
          const gateLeft = gateX() - 10;
          const gateRight = gateX() + 18;
          const gateOpen = gate.openUntil > now;

          if (!drop.judged && drop.x <= gateRight && drop.x >= gateLeft && gateOpen) {
            drop.judged = true;
            if (drop.type === "good") {
              scoreDroplet(drop);
            } else {
              failDroplet(drop);
            }
            droplets.splice(i, 1);
            continue;
          }

          if (drop.x < gateLeft - 12) {
            if (!drop.judged) {
              missDroplet(drop);
            }
            droplets.splice(i, 1);
          }
        }

        for (let i = state.particles.length - 1; i >= 0; i -= 1) {
          const particle = state.particles[i];
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= 0.98;
          particle.vy *= 0.98;
          if (particle.life <= 0) {
            state.particles.splice(i, 1);
          }
        }

        for (let i = state.pulses.length - 1; i >= 0; i -= 1) {
          state.pulses[i].life -= dt;
          if (state.pulses[i].life <= 0) {
            state.pulses.splice(i, 1);
          }
        }

        for (let i = state.ripples.length - 1; i >= 0; i -= 1) {
          const ripple = state.ripples[i];
          ripple.life -= dt;
          ripple.radius += 82 * dt;
          if (ripple.life <= 0) {
            state.ripples.splice(i, 1);
          }
        }

        syncHud();

        if (state.timeLeft <= 0) {
          finishGame();
        }
      }

      function drawLane(index, width) {
        const top = laneHeight() * index;
        const centerY = laneCenter(index);
        const gate = state.lanes[index];
        const glow = gate.glow;

        ctx.fillStyle = `rgba(124, 230, 255, ${0.03 + glow * 0.08})`;
        ctx.fillRect(0, top + 4, width, laneHeight() - 8);

        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, top + 1);
        ctx.lineTo(width, top + 1);
        ctx.stroke();

        ctx.strokeStyle = `rgba(124, 230, 255, ${0.28 + glow * 0.5})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(26, centerY);
        ctx.lineTo(width - 20, centerY);
        ctx.stroke();

        ctx.fillStyle = `rgba(137, 255, 207, ${0.1 + glow * 0.22})`;
        ctx.fillRect(gateX() - 16, centerY - 18, 30, 36);

        ctx.strokeStyle = `rgba(255, 213, 118, ${0.3 + glow * 0.6})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(gateX() - 16, centerY - 18, 30, 36);

        if (glow > 0.02) {
          ctx.fillStyle = `rgba(255,255,255,${0.12 + glow * 0.18})`;
          ctx.fillRect(gateX() - 6, centerY - 18, 12, 36);
        }
      }

      function drawDroplet(drop) {
        const y = laneCenter(drop.lane) + drop.yJitter;
        const wobble = Math.sin(drop.pulse) * 2.5;
        const x = drop.x;
        const radius = drop.radius + Math.sin(drop.pulse * 1.8) * 0.8;

        if (drop.type === "good") {
          const gradient = ctx.createRadialGradient(x - 2, y - 3, 2, x, y, radius * 1.8);
          gradient.addColorStop(0, "rgba(220, 255, 255, 0.95)");
          gradient.addColorStop(0.45, "rgba(124, 230, 255, 0.96)");
          gradient.addColorStop(1, "rgba(124, 230, 255, 0)");
          ctx.fillStyle = gradient;
        } else {
          const gradient = ctx.createRadialGradient(x - 2, y - 2, 2, x, y, radius * 1.8);
          gradient.addColorStop(0, "rgba(255, 240, 228, 0.96)");
          gradient.addColorStop(0.45, "rgba(255, 125, 136, 0.96)");
          gradient.addColorStop(1, "rgba(255, 125, 136, 0)");
          ctx.fillStyle = gradient;
        }

        ctx.beginPath();
        ctx.arc(x, y + wobble, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawEffects() {
        for (const pulse of state.pulses) {
          const alpha = Math.max(0, pulse.life / 0.34);
          const y = laneCenter(pulse.lane);
          ctx.fillStyle = `rgba(124, 230, 255, ${alpha * 0.2})`;
          ctx.fillRect(0, y - laneHeight() * 0.44, arena.clientWidth, laneHeight() * 0.88);
        }

        for (const ripple of state.ripples) {
          const alpha = Math.max(0, ripple.life / 0.32);
          const y = laneCenter(ripple.lane);
          ctx.strokeStyle = `rgba(255, 213, 118, ${alpha * 0.7})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(gateX() - 1, y, ripple.radius, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (const particle of state.particles) {
          ctx.fillStyle = `rgba(${particle.color}, ${Math.max(0, particle.life / 0.65)})`;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function render() {
        const width = arena.clientWidth;
        const height = arena.clientHeight;
        ctx.clearRect(0, 0, width, height);

        const bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, "rgba(10, 23, 41, 0.95)");
        bg.addColorStop(1, "rgba(2, 7, 15, 1)");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < LANE_COUNT; i += 1) {
          drawLane(i, width);
        }

        for (const drop of droplets) {
          drawDroplet(drop);
        }

        drawEffects();

        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.font = "12px Trebuchet MS";
        ctx.fillText("TAP A ROW", width - 92, 22);
      }

      function frame(timestamp) {
        if (!state.lastFrame) {
          state.lastFrame = timestamp;
        }
        const dt = Math.min(0.032, (timestamp - state.lastFrame) / 1000);
        state.lastFrame = timestamp;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      startButton.addEventListener("pointerdown", startGame);
      retryButton.addEventListener("pointerdown", startGame);
      canvas.addEventListener("pointerdown", onArenaPointer);
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      syncHud();
      render();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
