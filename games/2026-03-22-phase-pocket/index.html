<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>フェーズポケット</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #090b1a;
      --panel: #131933;
      --line: #2a376c;
      --text: #e9eeff;
      --sub: #9fb0e9;
      --left: #53b5ff;
      --mid: #c788ff;
      --right: #ffd166;
      --good: #6effb1;
      --bad: #ff6f91;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #1b2350, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
      touch-action: manipulation;
    }
    .app {
      width: min(100vw, 480px);
      height: 100dvh;
      margin: 0 auto;
      padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }
    .top {
      display: grid;
      gap: 8px;
      background: color-mix(in srgb, var(--panel) 86%, black);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }
    h1 { font-size: 1.05rem; margin: 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 6px;
      font-weight: 700;
      font-size: .95rem;
    }
    .stats div {
      background: #0f1430;
      border: 1px solid #2a3360;
      border-radius: 10px;
      padding: 6px;
      text-align: center;
    }
    .phase {
      text-align: center;
      font-weight: 800;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #0e1430;
    }
    #field {
      width: 100%;
      height: 100%;
      border: 1px solid #2e3a72;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(26,36,76,.55), rgba(8,11,24,.85));
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    #start {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 800;
      color: #071024;
      background: linear-gradient(135deg, #7cc8ff, #71ffb2);
    }
    .hint { font-size: .82rem; color: var(--sub); }
    a.back { color: #a9c4ff; text-decoration: none; font-size: .9rem; font-weight: 700; }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <h1>フェーズポケット</h1>
      <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">60.0</span></div>
        <div>Hi: <span id="hi">0</span></div>
      </div>
      <div class="phase" id="phaseLabel">位相: LEFT</div>
    </section>

    <div class="controls">
      <button id="start">START 60s</button>
      <a class="back" href="../../">← 戻る</a>
    </div>

    <canvas id="field" width="420" height="640" aria-label="game field"></canvas>

    <div class="hint">画面タップ（pointerdown）で位相切替。青=LEFT / 紫=MID / 黄=RIGHT</div>
  </main>

  <script>
  (() => {
    const HI_KEY = 'phase-pocket-hi-v1';
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const hiEl = document.getElementById('hi');
    const phaseLabel = document.getElementById('phaseLabel');
    const startBtn = document.getElementById('start');

    const phases = [
      { name: 'LEFT', color: '#53b5ff' },
      { name: 'MID', color: '#c788ff' },
      { name: 'RIGHT', color: '#ffd166' }
    ];

    let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    let w = 420, h = 640;
    let running = false;
    let score = 0;
    let hi = Number(localStorage.getItem(HI_KEY) || 0);
    let phase = 0;
    let timeLeft = 60;
    let lastTs = 0;
    let spawnTimer = 0;
    let feedback = '';
    let feedbackT = 0;
    const orbs = [];

    hiEl.textContent = hi;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      w = Math.max(280, rect.width);
      h = Math.max(420, rect.height);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function difficulty() {
      if (timeLeft > 30) return { speed: 140, interval: 0.7 };
      if (timeLeft > 15) return { speed: 180, interval: 0.52 };
      return { speed: 225, interval: 0.39 };
    }

    function spawnOrb() {
      const lane = Math.floor(Math.random() * 3);
      const x = (lane + 0.5) * (w / 3);
      orbs.push({ lane, x, y: -18, r: 13 });
    }

    function cyclePhase() {
      if (!running) return;
      phase = (phase + 1) % 3;
      phaseLabel.textContent = '位相: ' + phases[phase].name;
      phaseLabel.style.color = phases[phase].color;
      phaseLabel.style.borderColor = phases[phase].color;
    }

    function endGame() {
      running = false;
      startBtn.disabled = false;
      startBtn.textContent = 'RETRY';
      feedback = 'FINISH';
      feedbackT = 1.2;
      if (score > hi) {
        hi = score;
        localStorage.setItem(HI_KEY, String(hi));
        hiEl.textContent = hi;
      }
    }

    function resetGame() {
      score = 0;
      timeLeft = 60;
      phase = 0;
      orbs.length = 0;
      spawnTimer = 0;
      feedback = '';
      feedbackT = 0;
      scoreEl.textContent = '0';
      timeEl.textContent = '60.0';
      phaseLabel.textContent = '位相: LEFT';
      phaseLabel.style.color = phases[0].color;
      phaseLabel.style.borderColor = phases[0].color;
    }

    function update(dt) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        endGame();
      }
      timeEl.textContent = timeLeft.toFixed(1);

      const d = difficulty();
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnOrb();
        spawnTimer = d.interval * (0.85 + Math.random() * 0.4);
      }

      for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        o.y += d.speed * dt;
        if (o.y >= h - 56) {
          if (o.lane === phase) {
            score += 1;
            feedback = '+1';
            feedbackT = 0.32;
          } else {
            score = Math.max(0, score - 1);
            feedback = '-1';
            feedbackT = 0.32;
          }
          scoreEl.textContent = score;
          orbs.splice(i, 1);
        }
      }

      if (feedbackT > 0) feedbackT -= dt;
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      const laneW = w / 3;

      for (let i = 1; i < 3; i++) {
        ctx.strokeStyle = 'rgba(130,150,230,.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(laneW * i, 0);
        ctx.lineTo(laneW * i, h);
        ctx.stroke();
      }

      const pocketY = h - 44;
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      ctx.fillRect(0, pocketY - 10, w, 20);

      const px = phase * laneW + 6;
      ctx.fillStyle = phases[phase].color;
      ctx.fillRect(px, pocketY - 14, laneW - 12, 28);

      for (const o of orbs) {
        const c = phases[o.lane].color;
        ctx.beginPath();
        ctx.fillStyle = c;
        ctx.shadowColor = c;
        ctx.shadowBlur = 14;
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      if (!running) {
        ctx.fillStyle = 'rgba(6,8,20,.55)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#cfe2ff';
        ctx.textAlign = 'center';
        ctx.font = '700 22px system-ui';
        ctx.fillText('Tap START', w / 2, h / 2 - 8);
      }

      if (feedbackT > 0) {
        ctx.fillStyle = feedback === '+1' ? '#6effb1' : (feedback === '-1' ? '#ff6f91' : '#ffffff');
        ctx.textAlign = 'center';
        ctx.font = '800 28px system-ui';
        ctx.fillText(feedback, w / 2, 54);
      }
    }

    function loop(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.033, (ts - lastTs) / 1000);
      lastTs = ts;
      if (running) update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('pointerdown', cyclePhase, { passive: true });
    startBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resetGame();
      running = true;
      startBtn.disabled = true;
      startBtn.textContent = 'PLAYING';
    });
    window.addEventListener('resize', resize);

    resize();
    draw();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
