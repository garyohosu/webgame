<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>フラックスフォーク</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#070b1a;color:#eef2ff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(430px,100vw);height:100vh;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}h1{font-size:1.2rem;margin:0}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.panel{background:#111834;border:1px solid #2a356c;border-radius:10px;padding:8px;text-align:center;font-size:.85rem}#startBtn{border:0;border-radius:12px;padding:10px 14px;background:#35d7a1;color:#04140e;font-weight:700}canvas{flex:1;width:100%;background:linear-gradient(#0d1635,#0a1028);border:1px solid #2d3d7a;border-radius:14px;touch-action:manipulation}.foot{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}a{color:#8fd3ff}</style></head><body><main class="app"><h1>フラックスフォーク</h1><div class="hud"><div class="panel">SCORE<br><strong id="score">0</strong></div><div class="panel">TIME<br><strong id="time">60.0</strong></div><div class="panel">HI<br><strong id="hi">0</strong></div></div><button id="startBtn">START</button><canvas id="game" width="400" height="620"></canvas><div class="foot"><span>tap: フォーク反転</span><a href="../../">← 戻る</a></div></main><script>(()=>{const KEY='flux-fork-hi-v1';const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');const scEl=score,tmEl=time,hiEl=hi,btn=startBtn;let hi=+localStorage.getItem(KEY)||0;hiEl.textContent=hi;let running=false,scoreV=0,left=true,start=0,last=0,spawnT=0,nodes=[];const W=cvs.width,H=cvs.height,mid=W/2;function reset(){running=true;scoreV=0;left=true;start=performance.now();last=start;spawnT=0;nodes=[];btn.textContent='RESTART';requestAnimationFrame(loop)}function spawn(now){let t=(now-start)/1000;let iv=t<30?700:t<45?560:430;if(now-spawnT<iv)return;spawnT=now;let speed=t<30?140:t<45?180:220;let lane=Math.random()<0.5?0:1;let red=Math.random()<(t<30?0.35:t<45?0.45:0.55);nodes.push({x:lane?300:100,y:-20,v:speed,red})}function update(dt){for(const n of nodes)n.y+=n.v*dt;nodes=nodes.filter(n=>n.y<580);for(const n of [...nodes]){if(n.y>=520){let collect=left?n.x<mid:n.x>mid;if(collect)scoreV+=n.red?-1:1;else if(n.red)scoreV+=0.5;nodes.splice(nodes.indexOf(n),1)}}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1c2a64';ctx.fillRect(mid-4,40,8,540);ctx.fillStyle='#37e2b8';if(left){ctx.beginPath();ctx.moveTo(mid,330);ctx.lineTo(40,450);ctx.lineTo(40,470);ctx.lineTo(mid,350);ctx.fill();ctx.beginPath();ctx.moveTo(mid,330);ctx.lineTo(360,210);ctx.lineTo(360,230);ctx.lineTo(mid,350);ctx.fill()}else{ctx.beginPath();ctx.moveTo(mid,330);ctx.lineTo(360,450);ctx.lineTo(360,470);ctx.lineTo(mid,350);ctx.fill();ctx.beginPath();ctx.moveTo(mid,330);ctx.lineTo(40,210);ctx.lineTo(40,230);ctx.lineTo(mid,350);ctx.fill()}ctx.fillStyle='#9bd0ff';ctx.fillText('DUMP',72,600);ctx.fillText('COLLECT',260,600);for(const n of nodes){ctx.beginPath();ctx.fillStyle=n.red?'#ff5b7d':'#4dc3ff';ctx.arc(n.x,n.y,12,0,6.28);ctx.fill()}}function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,0.033);last=now;let t=60-(now-start)/1000;if(t<=0){running=false;tmEl.textContent='0.0';if(scoreV>hi){hi=scoreV;localStorage.setItem(KEY,String(hi));hiEl.textContent=hi}return}tmEl.textContent=t.toFixed(1);spawn(now);update(dt);draw();scEl.textContent=(Math.round(scoreV*10)/10).toString();requestAnimationFrame(loop)}cvs.addEventListener('pointerdown',()=>{if(running)left=!left});btn.addEventListener('pointerdown',reset)})();</script></body></html>
