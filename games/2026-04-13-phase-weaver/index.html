<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>フェーズウィーバー</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1f2a44, #0b1020 60%, #070a14);
      color: #eaf2ff;
      display: grid;
      place-items: center;
    }
    .app {
      width: min(100vw, 460px);
      height: 100dvh;
      max-height: 900px;
      padding: 14px 14px 18px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }
    h1 { margin: 0; font-size: clamp(22px, 5.8vw, 30px); letter-spacing: .04em; }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .panel {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }
    .label { font-size: 11px; opacity: .8; }
    .value { font-size: 20px; font-weight: 700; }
    #game {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.22);
      background: linear-gradient(180deg, rgba(150,186,255,.08), rgba(21,25,40,.45));
      touch-action: manipulation;
    }
    .laneMark {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: rgba(255,255,255,.08);
    }
    .player {
      position: absolute;
      bottom: 16px;
      width: 72px;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, #7cf9ff, #88a6ff);
      box-shadow: 0 0 14px rgba(124,249,255,.8);
      transform: translateX(-50%);
      transition: left .11s ease-out;
    }
    .orb {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .orb.good { background: #68f1b6; box-shadow: 0 0 12px rgba(104,241,182,.7); }
    .orb.bad { background: #ff6f8e; box-shadow: 0 0 12px rgba(255,111,142,.8); }
    .controls { display: grid; gap: 8px; }
    #startBtn {
      width: 100%; border: 0; border-radius: 12px; padding: 12px;
      background: linear-gradient(120deg, #7cf9ff, #9f8bff);
      color: #081122; font-weight: 800; font-size: 16px;
    }
    .hint { font-size: 12px; opacity: .85; text-align: center; }
    a.back { color: #b8cbff; text-align: center; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="app">
    <h1>フェーズウィーバー</h1>
    <section class="hud">
      <div class="panel"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
      <div class="panel"><div class="label">TIME</div><div id="time" class="value">60.0</div></div>
      <div class="panel"><div class="label">HI</div><div id="hi" class="value">0</div></div>
    </section>
    <section id="game" aria-label="game field">
      <div class="laneMark" style="left:33.333%"></div>
      <div class="laneMark" style="left:66.666%"></div>
      <div id="player" class="player"></div>
    </section>
    <section class="controls">
      <button id="startBtn" type="button">START 60s</button>
      <div class="hint">画面タップで受け皿を左→中→右に切り替え</div>
      <a class="back" href="../../">← 作品集へ戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const STORE_KEY = 'phase-weaver-hi-v1';
      const gameEl = document.getElementById('game');
      const playerEl = document.getElementById('player');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const hiEl = document.getElementById('hi');
      const startBtn = document.getElementById('startBtn');

      const lanes = [1/6, 3/6, 5/6];
      const state = {
        running: false,
        lane: 1,
        score: 0,
        timeLeft: 60,
        hi: Number(localStorage.getItem(STORE_KEY) || 0),
        items: [],
        spawnTimer: 0,
        prevTs: 0,
        raf: 0,
      };
      hiEl.textContent = state.hi;

      function laneX(idx) { return lanes[idx] * gameEl.clientWidth; }
      function updatePlayer() { playerEl.style.left = `${laneX(state.lane)}px`; }
      function difficulty() {
        if (state.timeLeft <= 15) return { speed: 235, interval: 0.42, badRate: 0.46 };
        if (state.timeLeft <= 30) return { speed: 205, interval: 0.56, badRate: 0.40 };
        return { speed: 170, interval: 0.72, badRate: 0.32 };
      }

      function resetField() {
        state.items.forEach(it => it.el.remove());
        state.items = [];
        state.spawnTimer = 0;
      }

      function spawnOrb() {
        const d = difficulty();
        const lane = Math.floor(Math.random() * 3);
        const bad = Math.random() < d.badRate;
        const el = document.createElement('div');
        el.className = `orb ${bad ? 'bad' : 'good'}`;
        gameEl.appendChild(el);
        state.items.push({ lane, y: -12, bad, el });
      }

      function setScore(v) {
        state.score = Math.max(0, v);
        scoreEl.textContent = state.score;
      }

      function finish() {
        state.running = false;
        cancelAnimationFrame(state.raf);
        startBtn.disabled = false;
        startBtn.textContent = 'RETRY 60s';
        if (state.score > state.hi) {
          state.hi = state.score;
          localStorage.setItem(STORE_KEY, String(state.hi));
          hiEl.textContent = state.hi;
        }
      }

      function frame(ts) {
        if (!state.running) return;
        const dt = Math.min(0.033, (ts - state.prevTs) / 1000 || 0);
        state.prevTs = ts;
        state.timeLeft = Math.max(0, state.timeLeft - dt);
        timeEl.textContent = state.timeLeft.toFixed(1);

        const d = difficulty();
        state.spawnTimer += dt;
        while (state.spawnTimer >= d.interval) {
          state.spawnTimer -= d.interval;
          spawnOrb();
        }

        const h = gameEl.clientHeight;
        const catchY = h - 28;
        for (let i = state.items.length - 1; i >= 0; i--) {
          const it = state.items[i];
          it.y += d.speed * dt;
          it.el.style.left = `${laneX(it.lane)}px`;
          it.el.style.top = `${it.y}px`;

          if (it.y >= catchY) {
            if (it.lane === state.lane) {
              setScore(state.score + (it.bad ? -2 : 1));
            }
            it.el.remove();
            state.items.splice(i, 1);
          }
        }

        if (state.timeLeft <= 0) {
          finish();
          return;
        }
        state.raf = requestAnimationFrame(frame);
      }

      function startGame() {
        resetField();
        setScore(0);
        state.timeLeft = 60;
        state.lane = 1;
        updatePlayer();
        state.running = true;
        startBtn.disabled = true;
        startBtn.textContent = 'PLAYING...';
        state.prevTs = performance.now();
        state.raf = requestAnimationFrame(frame);
      }

      gameEl.addEventListener('pointerdown', () => {
        if (!state.running) return;
        state.lane = (state.lane + 1) % 3;
        updatePlayer();
      }, { passive: true });

      startBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!state.running) startGame();
      });

      addEventListener('resize', updatePlayer);
      updatePlayer();
    })();
  </script>
</body>
</html>
