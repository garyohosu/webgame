<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>パルスフォージ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root { --bg:#0e1022; --panel:#1b1f3a; --line:#2d3468; --txt:#eff2ff; --sub:#a8b0da; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; background:radial-gradient(circle at 20% 0%, #1c2455, var(--bg) 55%); color:var(--txt); font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif; overflow:hidden; }
    body { display:flex; justify-content:center; }
    .app { width:min(100vw,480px); height:100vh; padding:12px 12px 16px; display:flex; flex-direction:column; gap:10px; }
    h1 { margin:0; font-size:1.2rem; letter-spacing:.06em; }
    .hud { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .box { background:rgba(27,31,58,.9); border:1px solid var(--line); border-radius:12px; padding:8px 10px; font-size:.9rem; }
    .big { font-weight:700; font-size:1.05rem; }
    #startBtn { border:none; border-radius:12px; background:linear-gradient(135deg,#7ee8fa,#8c7dff); color:#101429; font-weight:700; padding:12px; font-size:1rem; }
    #game { flex:1; position:relative; border:1px solid var(--line); border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)); overflow:hidden; }
    #core { position:absolute; left:50%; bottom:12%; width:74px; height:74px; margin-left:-37px; border-radius:50%; border:3px solid rgba(255,255,255,.8); box-shadow:0 0 24px rgba(255,255,255,.28); }
    #line { position:absolute; left:0; right:0; bottom:18%; height:2px; background:rgba(255,255,255,.35); }
    .pulse { position:absolute; width:30px; height:30px; border-radius:50%; top:-40px; box-shadow:0 0 10px rgba(255,255,255,.45); }
    .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--sub); font-weight:600; }
    .footer { display:flex; justify-content:space-between; font-size:.85rem; }
    a { color:#9fd9ff; }
  </style>
</head>
<body>
  <div class="app">
    <h1>⚙️ パルスフォージ</h1>
    <div class="hud">
      <div class="box">スコア <span id="score" class="big">0</span></div>
      <div class="box">残り <span id="time" class="big">60.0</span>s</div>
      <div class="box">ハイスコア <span id="hi" class="big">0</span></div>
      <div class="box">コンボ <span id="combo" class="big">0</span></div>
    </div>
    <button id="startBtn" type="button">スタート</button>
    <div id="game" aria-label="game field">
      <div id="line"></div>
      <div id="core"></div>
      <div id="msg" class="msg">タップで位相を切替えて同色パルスを鍛造せよ</div>
    </div>
    <div class="footer"><a href="../../">← 戻る</a><span>操作: pointerdown</span></div>
  </div>
<script>
(() => {
  const KEY = 'webgame_hi_pulse_forge';
  const colors = ['#4ab8ff','#ffd447','#ff5a7a'];
  const game = document.getElementById('game');
  const core = document.getElementById('core');
  const msg = document.getElementById('msg');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const comboEl = document.getElementById('combo');
  const hiEl = document.getElementById('hi');
  const btn = document.getElementById('startBtn');

  let hi = Number(localStorage.getItem(KEY) || 0);
  hiEl.textContent = hi;

  let running=false, phase=0, score=0, combo=0, left=60, last=0, spawnTick=0;
  let pulses=[];

  function setPhase(i){ phase=i; core.style.background=colors[phase]; }
  setPhase(0);

  function spawn(){
    const d = document.createElement('div');
    d.className='pulse';
    const c = Math.floor(Math.random()*3);
    d.style.background=colors[c];
    const x = 8 + Math.random()*(game.clientWidth-46);
    d.style.left = `${x}px`;
    game.appendChild(d);
    pulses.push({el:d, y:-36, color:c});
  }

  function reset(){ pulses.forEach(p=>p.el.remove()); pulses=[]; score=0; combo=0; left=60; spawnTick=0; scoreEl.textContent=0; comboEl.textContent=0; timeEl.textContent='60.0'; }

  function step(ts){
    if(!running) return;
    if(!last) last=ts;
    const dt=(ts-last)/1000; last=ts; left-=dt;
    const elapsed = 60-left;
    const speed = elapsed<30?170:elapsed<45?210:250;
    const interval = elapsed<30?0.72:elapsed<45?0.56:0.44;
    spawnTick += dt;
    while(spawnTick>=interval){ spawnTick-=interval; spawn(); }

    const judgeY = game.clientHeight*0.82;
    for(let i=pulses.length-1;i>=0;i--){
      const p=pulses[i]; p.y += speed*dt; p.el.style.transform=`translateY(${p.y}px)`;
      if(p.y>=judgeY){
        if(p.color===phase){ combo++; const bonus=Math.floor(combo/5)*2; score += 10+bonus; }
        else { combo=0; score=Math.max(0,score-6); }
        scoreEl.textContent=score; comboEl.textContent=combo;
        p.el.remove(); pulses.splice(i,1);
      } else if (p.y > game.clientHeight+40){ p.el.remove(); pulses.splice(i,1); }
    }

    timeEl.textContent=Math.max(0,left).toFixed(1);
    if(left<=0){
      running=false;
      msg.style.display='flex';
      msg.textContent=`終了！ スコア ${score}`;
      if(score>hi){ hi=score; localStorage.setItem(KEY,String(hi)); hiEl.textContent=hi; msg.textContent += '  ハイスコア更新!'; }
      btn.disabled=false; btn.textContent='もう一回';
      return;
    }
    requestAnimationFrame(step);
  }

  game.addEventListener('pointerdown', () => { if(running) setPhase((phase+1)%3); });
  btn.addEventListener('pointerdown', () => {
    if(running) return;
    btn.disabled=true; msg.style.display='none'; reset(); running=true; last=0; requestAnimationFrame(step);
  });
})();
</script>
</body>
</html>
