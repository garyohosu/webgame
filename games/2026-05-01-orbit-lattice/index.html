<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Orbit Lattice</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root { --bg:#080b1a; --panel:#131933; --fg:#eaf0ff; --muted:#9aa6d1; --a:#67d4ff; --b:#ffd166; --c:#ff77b7; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; overflow:hidden; background:radial-gradient(circle at top,#18224a,var(--bg)); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; }
    body { display:flex; justify-content:center; align-items:stretch; }
    .app { width:min(100vw,480px); height:100vh; padding:14px; display:flex; flex-direction:column; gap:10px; }
    .hud { background:rgba(19,25,51,.88); border:1px solid #2a376b; border-radius:14px; padding:10px 12px; }
    h1 { margin:0; font-size:1.15rem; }
    .row { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-weight:700; font-size:.92rem; }
    #stage { flex:1; width:100%; background:linear-gradient(#0f1530,#0a1025); border:1px solid #2a376b; border-radius:14px; touch-action:manipulation; }
    .controls { display:flex; gap:10px; align-items:center; }
    button { flex:1; padding:12px; border:0; border-radius:12px; font-weight:800; background:linear-gradient(135deg,var(--a),#8ff); color:#061126; }
    a { color:#b8c8ff; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <h1>🧩 Orbit Lattice</h1>
      <div class="row"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">60.0</b>s</span><span>Hi: <b id="hi">0</b></span></div>
    </div>
    <canvas id="stage" width="420" height="680" aria-label="game area"></canvas>
    <div class="controls"><button id="start">START</button><a href="../../">← 戻る</a></div>
  </div>
<script>
(() => {
  const KEY = 'orbit-lattice-hi-v1';
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const hiEl = document.getElementById('hi');
  const startBtn = document.getElementById('start');
  let hi = Number(localStorage.getItem(KEY) || 0); hiEl.textContent = hi;
  const colors = ['#67d4ff','#ffd166','#ff77b7'];
  let running=false, score=0, combo=0, phase=0, nodes=[], tLeft=60, last=0, spawnAcc=0;

  function reset(){ score=0; combo=0; phase=0; nodes=[]; tLeft=60; spawnAcc=0; scoreEl.textContent='0'; timeEl.textContent='60.0'; }
  function spawn(){ nodes.push({x:70+Math.random()*280,y:-20,c:Math.floor(Math.random()*3),v:(tLeft<15?260:tLeft<30?220:180)}); }
  function tap(){ if(!running) return; phase=(phase+1)%3; }
  canvas.addEventListener('pointerdown', tap);
  startBtn.addEventListener('pointerdown', () => { reset(); running=true; last=performance.now(); requestAnimationFrame(loop); });

  function loop(ts){
    if(!running) return;
    const dt = Math.min(0.033,(ts-last)/1000); last=ts; tLeft-=dt; if(tLeft<=0){ end(); return; }
    const mult = tLeft<15?1.45:tLeft<30?1.2:1;
    spawnAcc += dt;
    const gap = tLeft<15?0.45:tLeft<30?0.62:0.82;
    while(spawnAcc>gap){ spawnAcc-=gap; spawn(); if(tLeft<15 && Math.random()<0.23) spawn(); }
    nodes.forEach(n=> n.y += n.v*mult*dt);
    const lineY = canvas.height-130;
    nodes = nodes.filter(n=>{
      if(n.y>lineY+20){ combo=0; return false; }
      if(Math.abs(n.y-lineY)<14){
        if(n.c===phase){ combo++; score += 10 + Math.min(combo,8); }
        else { combo=0; score=Math.max(0,score-8); }
        scoreEl.textContent=score;
        return false;
      }
      return true;
    });
    draw(lineY);
    timeEl.textContent = tLeft.toFixed(1);
    requestAnimationFrame(loop);
  }
  function draw(lineY){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#0c1430'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(30,lineY-2,360,4);
    ctx.save(); ctx.translate(canvas.width/2,lineY); ctx.rotate(performance.now()/1200);
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.strokeStyle=colors[(phase+i)%3]; ctx.lineWidth=12; ctx.arc(0,0,48+i*16,i*2.09,(i+1)*2.09-0.18); ctx.stroke(); }
    ctx.restore();
    nodes.forEach(n=>{ ctx.beginPath(); ctx.fillStyle=colors[n.c]; ctx.arc(n.x,n.y,11,0,Math.PI*2); ctx.fill(); });
  }
  function end(){ running=false; if(score>hi){ hi=score; localStorage.setItem(KEY,String(hi)); hiEl.textContent=hi; } }
  draw(canvas.height-130);
})();
</script>
</body>
</html>
