<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>パルスリング・スナップ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg:#050814;
      --panel:#121936;
      --line:#2d3d73;
      --text:#eef3ff;
      --muted:#98a7d6;
      --good:#6ce8ff;
      --bad:#ff6d96;
      --accent:#9cff83;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #1d2c62 0%, var(--bg) 45%, #03050d 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      touch-action: manipulation;
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(20px, 6vw, 28px);
      letter-spacing: .04em;
    }
    .hud {
      background: rgba(18,25,54,.82);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .hud small { display:block; font-size:10px; color:var(--muted); }
    #arena {
      width: min(95vw, 430px);
      height: min(60vh, 560px);
      margin: 0 auto;
      border-radius: 16px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at center, rgba(120,150,255,.2) 0 12%, transparent 13%),
        radial-gradient(circle at center, rgba(255,255,255,.05) 0 28%, transparent 29%),
        #0a1024;
      position: relative;
      overflow: hidden;
    }
    .core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 30% 30%, #fff, #8fd6ff 45%, #2c5c9f 100%);
      box-shadow: 0 0 20px rgba(108,232,255,.45);
      pointer-events: none;
    }
    .target {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .target.good {
      background: radial-gradient(circle at 35% 35%, #ecfbff 0 20%, var(--good) 52%, #1986a4 100%);
      box-shadow: 0 0 14px rgba(108,232,255,.55);
    }
    .target.bad {
      background: radial-gradient(circle at 35% 35%, #ffe5ee 0 20%, var(--bad) 52%, #97274a 100%);
      box-shadow: 0 0 14px rgba(255,109,150,.45);
    }
    .pulse {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      border: 2px solid rgba(156,255,131,.9);
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 14px rgba(156,255,131,.45);
    }
    .controls { display: grid; gap: 8px; justify-items: center; }
    button {
      width: min(92vw, 420px);
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #7ee8fa, #9cff83);
      color: #031018;
      font-weight: 800;
      font-size: 18px;
      padding: 12px 16px;
    }
    #hint {
      min-height: 20px;
      font-size: 13px;
      color: #c4cff5;
      text-align: center;
    }
    a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>💥 パルスリング・スナップ</h1>

    <section class="hud" aria-live="polite">
      <div><small>SCORE</small><span id="score">0</span></div>
      <div><small>TIME</small><span id="time">60.0</span></div>
      <div><small>HI-SCORE</small><span id="hiscore">0</span></div>
    </section>

    <section id="arena" aria-label="game field">
      <div class="core"></div>
    </section>

    <section class="controls">
      <button id="start">START 60s</button>
      <div id="hint">タップで衝撃リング発射。青ヒット +10、赤ヒット -8。</div>
      <a class="back" href="../../">← 作品集へ戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const KEY = 'pulse-ring-snap-hi-v1';
      const arena = document.getElementById('arena');
      const startBtn = document.getElementById('start');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const hiEl = document.getElementById('hiscore');
      const hintEl = document.getElementById('hint');

      hiEl.textContent = String(Number(localStorage.getItem(KEY) || 0));

      let running = false;
      let score = 0;
      let left = 60;
      let lastTs = 0;
      let rafId = 0;
      let spawnAcc = 0;
      let targets = [];
      let pulses = [];

      function center() {
        return { x: arena.clientWidth / 2, y: arena.clientHeight / 2 };
      }
      function phaseSpeed(secLeft) {
        if (secLeft > 30) return 0.38;
        if (secLeft > 15) return 0.46;
        return 0.54;
      }
      function spawnGap(secLeft) {
        if (secLeft > 30) return 520;
        if (secLeft > 15) return 400;
        return 320;
      }
      function badRate(secLeft) {
        if (secLeft > 30) return 0.22;
        if (secLeft > 15) return 0.3;
        return 0.38;
      }

      function updateHud() {
        scoreEl.textContent = String(score);
        timeEl.textContent = left.toFixed(1);
      }

      function spawnTarget() {
        const c = center();
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.min(arena.clientWidth, arena.clientHeight) * 0.47;
        const isBad = Math.random() < badRate(left);
        const el = document.createElement('div');
        el.className = `target ${isBad ? 'bad' : 'good'}`;
        arena.appendChild(el);
        targets.push({
          el,
          bad: isBad,
          r: radius,
          angle,
          hit: false,
          x: c.x + Math.cos(angle) * radius,
          y: c.y + Math.sin(angle) * radius
        });
      }

      function firePulse() {
        if (!running) return;
        const p = document.createElement('div');
        p.className = 'pulse';
        arena.appendChild(p);
        pulses.push({ el: p, r: 6, speed: 0.62, active: true });
      }

      function collide() {
        for (const p of pulses) {
          if (!p.active) continue;
          for (const t of targets) {
            if (t.hit) continue;
            const dist = Math.hypot(t.x - center().x, t.y - center().y);
            if (Math.abs(dist - p.r) < 10) {
              t.hit = true;
              if (t.bad) {
                score = Math.max(0, score - 8);
                hintEl.textContent = '赤ノイズ誤爆 -8';
              } else {
                score += 10;
                hintEl.textContent = '青ターゲット同調 +10';
              }
              t.el.remove();
            }
          }
        }
      }

      function cleanup() {
        targets = targets.filter(t => !t.hit && t.r > 6);
        pulses = pulses.filter(p => p.active);
      }

      function finish() {
        running = false;
        cancelAnimationFrame(rafId);
        const hi = Number(localStorage.getItem(KEY) || 0);
        if (score > hi) {
          localStorage.setItem(KEY, String(score));
          hiEl.textContent = String(score);
          hintEl.textContent = `終了！ ハイスコア更新 ${score}`;
        } else {
          hintEl.textContent = `終了！ スコア ${score}`;
        }
        startBtn.disabled = false;
        startBtn.textContent = 'RESTART';
      }

      function loop(ts) {
        if (!running) return;
        if (!lastTs) lastTs = ts;
        const dt = ts - lastTs;
        lastTs = ts;

        left -= dt / 1000;
        if (left <= 0) {
          left = 0;
          updateHud();
          finish();
          return;
        }

        spawnAcc += dt;
        const gap = spawnGap(left);
        while (spawnAcc >= gap) {
          spawnAcc -= gap;
          spawnTarget();
        }

        const speed = phaseSpeed(left);
        const c = center();

        for (const t of targets) {
          t.r -= speed * dt;
          if (t.r <= 8 && !t.hit) {
            t.hit = true;
            if (!t.bad) {
              score = Math.max(0, score - 2);
              hintEl.textContent = '青を取り逃し -2';
            }
            t.el.remove();
            continue;
          }
          t.x = c.x + Math.cos(t.angle) * t.r;
          t.y = c.y + Math.sin(t.angle) * t.r;
          t.el.style.left = `${t.x}px`;
          t.el.style.top = `${t.y}px`;
        }

        const maxR = Math.min(arena.clientWidth, arena.clientHeight) * 0.55;
        for (const p of pulses) {
          if (!p.active) continue;
          p.r += p.speed * dt;
          const d = p.r * 2;
          p.el.style.width = `${d}px`;
          p.el.style.height = `${d}px`;
          p.el.style.opacity = String(Math.max(0.1, 1 - p.r / maxR));
          if (p.r > maxR) {
            p.active = false;
            p.el.remove();
          }
        }

        collide();
        cleanup();
        updateHud();
        rafId = requestAnimationFrame(loop);
      }

      function reset() {
        score = 0;
        left = 60;
        lastTs = 0;
        spawnAcc = 0;
        for (const t of targets) t.el.remove();
        for (const p of pulses) p.el.remove();
        targets = [];
        pulses = [];
        updateHud();
        hintEl.textContent = 'タップで衝撃リング発射。青ヒット +10、赤ヒット -8。';
      }

      startBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (running) return;
        reset();
        running = true;
        startBtn.disabled = true;
        startBtn.textContent = 'RUNNING...';
        rafId = requestAnimationFrame(loop);
      });

      arena.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        firePulse();
      });
    })();
  </script>
</body>
</html>
