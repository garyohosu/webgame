<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>タイミングバルブ</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg:#070b1a;
      --panel:#111a32;
      --line:#24345f;
      --good:#58d6ff;
      --bad:#ff5b82;
      --text:#eaf1ff;
      --accent:#ffd166;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
    body { display:flex; justify-content:center; }
    .app {
      width: min(100vw, 430px);
      height: 100dvh;
      display:grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 8px;
      padding: 10px 12px 12px;
      background: radial-gradient(120% 80% at 50% 0%, #1a2950 0%, #0a1022 55%, #070b1a 100%);
    }
    h1 { margin: 0; text-align:center; font-size: 1.15rem; letter-spacing: .04em; }
    .hud {
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .box {
      background: rgba(10,17,40,.75);
      border:1px solid var(--line);
      border-radius: 10px;
      text-align:center;
      padding: 6px 4px;
      font-size: .8rem;
    }
    .box b { display:block; font-size:1.05rem; margin-top:2px; }
    #field {
      width:100%;
      height:100%;
      border: 1px solid #304377;
      border-radius: 14px;
      background: linear-gradient(#0f1833, #090f22 60%);
      touch-action: none;
    }
    .controls { display:flex; gap:8px; }
    button, .back {
      flex:1;
      border:none;
      border-radius: 10px;
      padding: 11px 10px;
      font-size: .95rem;
      font-weight: 700;
      text-align:center;
    }
    #startBtn { background: var(--accent); color:#1d1600; }
    .back {
      display:block;
      text-decoration:none;
      background:#1e2d53;
      color:#d8e5ff;
      border:1px solid #324a85;
    }
    .caption { text-align:center; font-size:.78rem; opacity:.85; min-height: 1.2em; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🚰 タイミングバルブ</h1>

    <section class="hud">
      <div class="box">SCORE<b id="score">0</b></div>
      <div class="box">TIME<b id="time">60.0</b></div>
      <div class="box">HI<b id="hi">0</b></div>
    </section>

    <canvas id="field" width="390" height="620" aria-label="game field"></canvas>

    <div class="controls">
      <button id="startBtn" type="button">START</button>
      <a class="back" href="../../">← 戻る</a>
    </div>

    <div id="msg" class="caption">押している間だけバルブOPEN</div>
  </main>

<script>
(() => {
  const KEY = 'timing-valve-hi-v1';
  const cvs = document.getElementById('field');
  const ctx = cvs.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const hiEl = document.getElementById('hi');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('startBtn');

  let hi = Number(localStorage.getItem(KEY) || 0);
  hiEl.textContent = String(hi);

  let running = false;
  let opening = false;
  let score = 0;
  let left = 60;
  let drops = [];
  let spawnTimer = 0;
  let lastTs = 0;

  const W = cvs.width;
  const H = cvs.height;
  const valveY = H - 96;

  function phaseConfig(sec) {
    if (sec < 30) return { speed: 120, spawn: 0.72, badRate: 0.24 };
    if (sec < 45) return { speed: 160, spawn: 0.56, badRate: 0.32 };
    return { speed: 205, spawn: 0.45, badRate: 0.42 };
  }

  function resetGame() {
    running = true;
    opening = false;
    score = 0;
    left = 60;
    drops = [];
    spawnTimer = 0;
    lastTs = 0;
    scoreEl.textContent = '0';
    timeEl.textContent = '60.0';
    msgEl.textContent = '青を通せ、赤は閉じろ';
    startBtn.textContent = 'RESTART';
  }

  function spawnDrop(cfg) {
    const bad = Math.random() < cfg.badRate;
    drops.push({
      x: 30 + Math.random() * (W - 60),
      y: -20,
      r: 11,
      bad,
      speed: cfg.speed * (0.85 + Math.random() * 0.35),
      judged: false,
    });
  }

  function update(dt) {
    if (!running) return;
    left = Math.max(0, left - dt);
    timeEl.textContent = left.toFixed(1);

    const elapsed = 60 - left;
    const cfg = phaseConfig(elapsed);

    spawnTimer += dt;
    while (spawnTimer >= cfg.spawn) {
      spawnDrop(cfg);
      spawnTimer -= cfg.spawn;
    }

    for (const d of drops) {
      d.y += d.speed * dt;
      if (!d.judged && d.y + d.r >= valveY - 2) {
        d.judged = true;
        if (opening) {
          if (d.bad) score = Math.max(0, score - 4);
          else score += 7;
          scoreEl.textContent = String(score);
        }
      }
    }
    drops = drops.filter(d => d.y < H + 30);

    if (left <= 0) {
      running = false;
      opening = false;
      if (score > hi) {
        hi = score;
        localStorage.setItem(KEY, String(hi));
        hiEl.textContent = String(hi);
        msgEl.textContent = `終了：${score}点！ ハイスコア更新`; 
      } else {
        msgEl.textContent = `終了：${score}点`; 
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) {
      const y = (H / 6) * i;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    ctx.strokeStyle = '#9ac1ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, valveY); ctx.lineTo(W - 18, valveY); ctx.stroke();

    ctx.fillStyle = opening ? 'rgba(88,214,255,.32)' : 'rgba(255,91,130,.22)';
    ctx.fillRect(18, valveY - 11, W - 36, 22);

    ctx.fillStyle = opening ? '#58d6ff' : '#ff5b82';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(opening ? 'VALVE OPEN' : 'VALVE CLOSED', W / 2, valveY - 18);

    for (const d of drops) {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = d.bad ? '#ff5b82' : '#58d6ff';
      ctx.shadowColor = d.bad ? 'rgba(255,91,130,.45)' : 'rgba(88,214,255,.45)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.033, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function setOpen(v) {
    if (!running) return;
    opening = v;
  }

  cvs.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    setOpen(true);
  }, { passive: false });
  window.addEventListener('pointerup', () => setOpen(false));
  window.addEventListener('pointercancel', () => setOpen(false));

  startBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resetGame();
  }, { passive: false });

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
