<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>ベルベットスルース</title>
  <meta name="description" content="タップで布スクープを左右に反転し、青い露粒を左鉢へ、赤い炭粒を右ベントへ流し分ける60秒ゲーム。" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-top: #28151a;
      --bg-bottom: #12080b;
      --panel: rgba(33, 16, 21, 0.88);
      --line: rgba(255, 244, 238, 0.1);
      --text: #fff4ee;
      --rose: #ff9f9a;
      --pearl: #9fe7ff;
      --gold: #ffd1a8;
      --ember: #ff6b5f;
      --mint: #9ee7c0;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 15%, rgba(255, 159, 154, 0.16), transparent 26%),
        radial-gradient(circle at 80% 12%, rgba(159, 231, 255, 0.16), transparent 28%),
        radial-gradient(circle at 50% 50%, rgba(255, 209, 168, 0.09), transparent 34%),
        linear-gradient(180deg, #3e1f28 0%, var(--bg-top) 40%, var(--bg-bottom) 100%);
      color: var(--text);
      font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .shell {
      width: min(100vw, 430px);
      height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      overflow: hidden;
    }

    .panel,
    .hud,
    .controls {
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 40px var(--shadow);
      position: relative;
      z-index: 2;
    }

    .panel {
      padding: 14px 16px 12px;
    }

    .eyebrow {
      margin-bottom: 4px;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255, 244, 238, 0.62);
    }

    h1 {
      margin: 0;
      font-size: 1.72rem;
      line-height: 1.04;
      letter-spacing: 0.04em;
    }

    .sub {
      margin-top: 8px;
      font-size: 0.92rem;
      line-height: 1.55;
      color: rgba(255, 244, 238, 0.82);
    }

    .hud {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 8px 4px;
      border-radius: 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .label {
      margin-bottom: 4px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 244, 238, 0.52);
    }

    .value {
      font-size: 0.88rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #tiltValue.left {
      color: var(--pearl);
    }

    #tiltValue.right {
      color: var(--rose);
    }

    #comboValue.hot {
      color: var(--gold);
    }

    .arena {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 244, 238, 0.05), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%),
        linear-gradient(180deg, rgba(41, 20, 26, 0.95), rgba(16, 7, 11, 1));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 18px 42px rgba(0, 0, 0, 0.3);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(18, 8, 11, 0.24), rgba(18, 8, 11, 0.9));
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 24px;
      background: rgba(30, 14, 19, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.32);
    }

    .overlay-card h2 {
      margin: 0 0 10px;
      font-size: 1.34rem;
    }

    .overlay-card p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.62;
      color: rgba(255, 244, 238, 0.82);
    }

    .tap-note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      background: rgba(18, 8, 11, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 244, 238, 0.86);
      backdrop-filter: blur(8px);
    }

    .controls {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
    }

    button,
    .back-link {
      appearance: none;
      border: none;
      border-radius: 16px;
      min-height: 50px;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    button {
      color: #2c120d;
      background: linear-gradient(135deg, var(--gold), var(--rose));
      box-shadow: 0 12px 24px rgba(255, 159, 154, 0.22);
    }

    button.secondary,
    .back-link {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    button:active,
    .back-link:active {
      transform: translateY(1px) scale(0.99);
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <div class="eyebrow">Silk Foundry</div>
      <h1>ベルベットスルース</h1>
      <div class="sub">タップで布スクープを反転。青い露粒は左鉢へ、赤い炭粒は右ベントへ滑らせる。</div>
    </section>

    <section class="hud">
      <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="timeValue">60.0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
      <div class="stat"><div class="label">Combo</div><div class="value" id="comboValue">x1</div></div>
      <div class="stat"><div class="label">Tilt</div><div class="value left" id="tiltValue">LEFT</div></div>
    </section>

    <section class="arena" id="arena">
      <canvas id="game" width="402" height="720"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">青は左、赤は右</h2>
          <p id="overlayText">プレイ中に画面タップで布スクープを反転。粒を正しい出口へ滑らせて60秒で最高点を狙う。</p>
        </div>
      </div>
      <div class="tap-note">PLAY中に画面タップでスクープ反転</div>
    </section>

    <section class="controls">
      <button id="startButton" type="button">スタート</button>
      <button id="retryButton" type="button" class="secondary">リトライ</button>
      <a class="back-link" href="../../">戻る</a>
    </section>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "webgame_velvet_sluice_best";
      const GAME_SECONDS = 60;
      const BASE_SPAWN_INTERVAL = 0.7;
      const MAX_BEADS = 26;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const arena = document.getElementById("arena");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startButton = document.getElementById("startButton");
      const retryButton = document.getElementById("retryButton");
      const scoreValue = document.getElementById("scoreValue");
      const timeValue = document.getElementById("timeValue");
      const bestValue = document.getElementById("bestValue");
      const comboValue = document.getElementById("comboValue");
      const tiltValue = document.getElementById("tiltValue");

      let width = 402;
      let height = 720;
      let centerX = width * 0.5;
      let scoopY = height * 0.56;
      let scoopHalfWidth = width * 0.2;
      let pocketY = height * 0.87;
      let pocketInset = width * 0.18;

      let running = false;
      let score = 0;
      let best = Number(localStorage.getItem(STORAGE_KEY) || 0);
      let newBest = false;
      let combo = 0;
      let timeLeft = GAME_SECONDS;
      let elapsed = 0;
      let spawnTimer = 0;
      let lastFrame = performance.now();
      let tilt = -1;
      let tiltVisual = -1;
      let beads = [];
      let particles = [];

      bestValue.textContent = String(best);

      function resize() {
        const rect = arena.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        width = Math.max(320, rect.width);
        height = Math.max(360, rect.height);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        centerX = width * 0.5;
        scoopY = height * 0.56;
        scoopHalfWidth = Math.max(64, width * 0.22);
        pocketY = height * 0.87;
        pocketInset = width * 0.18;
      }

      function difficultyFactor() {
        if (elapsed < 30) return 1;
        if (elapsed < 45) return 1.28;
        return 1.58;
      }

      function resetRun() {
        score = 0;
        combo = 0;
        timeLeft = GAME_SECONDS;
        elapsed = 0;
        spawnTimer = 0;
        beads = [];
        particles = [];
        tilt = -1;
        tiltVisual = -1;
        newBest = false;
        running = true;
        overlay.classList.add("hidden");
        updateHud();
      }

      function startGame() {
        resetRun();
      }

      function endGame() {
        running = false;
        if (score > best) {
          best = score;
          localStorage.setItem(STORAGE_KEY, String(best));
          newBest = true;
        }
        bestValue.textContent = String(best);
        overlayTitle.textContent = newBest ? "ベスト更新" : "タイムアップ";
        overlayText.textContent = `スコア ${score} / ベスト ${best}。青は左、赤は右の流し分けを極める。`;
        overlay.classList.remove("hidden");
        updateHud();
      }

      function updateHud() {
        scoreValue.textContent = String(score);
        timeValue.textContent = timeLeft.toFixed(1);
        bestValue.textContent = String(best);
        comboValue.textContent = `x${Math.max(1, combo + 1)}`;
        comboValue.classList.toggle("hot", combo >= 4);
        tiltValue.textContent = tilt < 0 ? "LEFT" : "RIGHT";
        tiltValue.className = `value ${tilt < 0 ? "left" : "right"}`;
      }

      function spawnBead() {
        if (beads.length >= MAX_BEADS) return;
        const badChance = elapsed < 30 ? 0.32 : elapsed < 45 ? 0.42 : 0.52;
        const kind = Math.random() < badChance ? "ember" : "pearl";
        beads.push({
          x: width * (0.24 + Math.random() * 0.52),
          y: -18,
          vx: (Math.random() * 2 - 1) * 24,
          vy: 10 + Math.random() * 20,
          radius: kind === "pearl" ? 10 + Math.random() * 3 : 9 + Math.random() * 3,
          kind,
          rotation: Math.random() * Math.PI * 2,
          spin: (Math.random() * 2 - 1) * 2.6,
          settledFrames: 0
        });
      }

      function addParticles(x, y, color, amount) {
        for (let i = 0; i < amount; i += 1) {
          particles.push({
            x,
            y,
            vx: (Math.random() * 2 - 1) * 90,
            vy: (Math.random() * 2 - 1) * 90,
            life: 0.6 + Math.random() * 0.4,
            maxLife: 0.6 + Math.random() * 0.4,
            color
          });
        }
      }

      function handleTap(event) {
        event.preventDefault();
        if (!running) return;
        tilt *= -1;
      }

      function award(bead, success) {
        const leftSide = bead.x < centerX;
        const correct = bead.kind === "pearl" ? leftSide : !leftSide;
        const didSucceed = success && correct;
        if (didSucceed) {
          combo += 1;
          const gain = bead.kind === "pearl" ? 2 + Math.min(3, Math.floor(combo / 3)) : 1;
          score += gain;
          addParticles(bead.x, bead.y, bead.kind === "pearl" ? "#9fe7ff" : "#ff9a73", 10);
        } else {
          combo = 0;
          score = Math.max(0, score - 3);
          addParticles(bead.x, bead.y, "#ffffff", 12);
        }
        if (score > best) {
          best = score;
          localStorage.setItem(STORAGE_KEY, String(best));
        }
      }

      function update(dt) {
        if (running) {
          elapsed += dt;
          timeLeft = Math.max(0, GAME_SECONDS - elapsed);
          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnBead();
            spawnTimer = BASE_SPAWN_INTERVAL / difficultyFactor() + Math.random() * 0.16;
          }
          if (timeLeft <= 0) {
            endGame();
          }
        }

        tiltVisual += (tilt - tiltVisual) * Math.min(1, dt * 10);
        const gravity = 520 * difficultyFactor();
        const scoopSlope = 0.3 * tiltVisual;

        beads = beads.filter((bead) => {
          if (running) {
            bead.vy += gravity * dt;
            bead.x += bead.vx * dt;
            bead.y += bead.vy * dt;
            bead.rotation += bead.spin * dt;

            const withinScoop = bead.x > centerX - scoopHalfWidth && bead.x < centerX + scoopHalfWidth;
            const scoopLineY = scoopY + scoopSlope * (bead.x - centerX);
            if (withinScoop && bead.y + bead.radius > scoopLineY - 8 && bead.y + bead.radius < scoopLineY + 22 && bead.vy > 0) {
              bead.y = scoopLineY - bead.radius;
              bead.vy *= 0.16;
              bead.vx += tiltVisual * (160 + 20 * difficultyFactor()) * dt;
              bead.vx += (bead.x - centerX) * 0.2 * dt;
              bead.settledFrames += 1;
            } else {
              bead.settledFrames = 0;
            }
          }

          const inLeftPocket = bead.x < pocketInset && bead.y > pocketY;
          const inRightPocket = bead.x > width - pocketInset && bead.y > pocketY;
          if (inLeftPocket || inRightPocket) {
            award(bead, true);
            return false;
          }

          if (bead.y > height + 30 || bead.x < -40 || bead.x > width + 40) {
            award(bead, false);
            return false;
          }
          return true;
        });

        particles = particles.filter((particle) => {
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= 0.98;
          particle.vy *= 0.98;
          return particle.life > 0;
        });

        updateHud();
      }

      function drawBackground() {
        ctx.clearRect(0, 0, width, height);

        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, "#4b2730");
        grad.addColorStop(0.4, "#27151a");
        grad.addColorStop(1, "#12080b");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < 8; i += 1) {
          const y = height * (0.08 + i * 0.1);
          ctx.strokeStyle = `rgba(255,244,238,${0.03 + i * 0.003})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(width * 0.12, y);
          ctx.quadraticCurveTo(width * 0.5, y + 10 * Math.sin((elapsed + i) * 0.6), width * 0.88, y);
          ctx.stroke();
        }
      }

      function drawPockets() {
        const leftX = pocketInset;
        const rightX = width - pocketInset;
        const radius = width * 0.12;

        ctx.save();
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.fillStyle = "rgba(255,255,255,0.04)";

        ctx.beginPath();
        ctx.arc(leftX, pocketY, radius, 0.18 * Math.PI, 0.82 * Math.PI, true);
        ctx.stroke();
        ctx.fill();

        ctx.beginPath();
        ctx.arc(rightX, pocketY, radius, 0.18 * Math.PI, 0.82 * Math.PI, true);
        ctx.stroke();
        ctx.fill();

        ctx.fillStyle = "rgba(255,244,238,0.7)";
        ctx.font = "700 12px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("PEARL", leftX, pocketY + 28);
        ctx.fillText("EMBER", rightX, pocketY + 28);
        ctx.restore();
      }

      function drawScoop() {
        const leftX = centerX - scoopHalfWidth;
        const rightX = centerX + scoopHalfWidth;
        const sag = 22;
        const leftY = scoopY - tiltVisual * 26;
        const rightY = scoopY + tiltVisual * 26;

        ctx.save();
        ctx.lineWidth = 12;
        ctx.lineCap = "round";
        const scoopGrad = ctx.createLinearGradient(leftX, leftY, rightX, rightY);
        scoopGrad.addColorStop(0, "#f2a2b0");
        scoopGrad.addColorStop(0.5, "#ffe1bf");
        scoopGrad.addColorStop(1, "#9ec9ff");
        ctx.strokeStyle = scoopGrad;
        ctx.beginPath();
        ctx.moveTo(leftX, leftY);
        ctx.quadraticCurveTo(centerX, scoopY + sag, rightX, rightY);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.beginPath();
        ctx.moveTo(leftX, leftY - 14);
        ctx.lineTo(leftX, leftY + 10);
        ctx.moveTo(rightX, rightY - 14);
        ctx.lineTo(rightX, rightY + 10);
        ctx.stroke();
        ctx.restore();
      }

      function drawBeads() {
        beads.forEach((bead) => {
          ctx.save();
          ctx.translate(bead.x, bead.y);
          ctx.rotate(bead.rotation);
          if (bead.kind === "pearl") {
            const g = ctx.createRadialGradient(-2, -3, 1, 0, 0, bead.radius + 2);
            g.addColorStop(0, "#ffffff");
            g.addColorStop(0.35, "#bff2ff");
            g.addColorStop(1, "#4db5db");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, bead.radius, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = "#ff7d6c";
            ctx.beginPath();
            ctx.moveTo(0, -bead.radius - 2);
            ctx.lineTo(bead.radius + 2, 0);
            ctx.lineTo(0, bead.radius + 2);
            ctx.lineTo(-bead.radius - 2, 0);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        });
      }

      function drawParticles() {
        particles.forEach((particle) => {
          const alpha = Math.max(0, particle.life / particle.maxLife);
          ctx.fillStyle = `${particle.color}${Math.round(alpha * 255).toString(16).padStart(2, "0")}`;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 2.6, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawFrame() {
        drawBackground();
        drawPockets();
        drawScoop();
        drawBeads();
        drawParticles();

        ctx.save();
        ctx.fillStyle = "rgba(255,244,238,0.1)";
        ctx.font = "700 13px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("TAP TO FLIP", centerX, height * 0.14);
        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min(0.033, (now - lastFrame) / 1000);
        lastFrame = now;
        update(dt);
        drawFrame();
        requestAnimationFrame(frame);
      }

      function bindPointer(button, handler) {
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          handler(event);
        });
      }

      bindPointer(startButton, startGame);
      bindPointer(retryButton, startGame);
      arena.addEventListener("pointerdown", handleTap);
      window.addEventListener("resize", resize);

      resize();
      updateHud();
      requestAnimationFrame((now) => {
        lastFrame = now;
        frame(now);
      });
    })();
  </script>
</body>
</html>
