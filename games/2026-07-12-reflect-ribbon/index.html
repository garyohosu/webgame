<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>リフレクトリボン</title>
  <meta name="description" content="揺れる角度に合わせてタップし、斜めの光帯で青い滴だけをまとめて切り取る60秒ゲーム。" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-top: #180b27;
      --bg-bottom: #04050c;
      --panel: rgba(17, 10, 28, 0.84);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f9f4ff;
      --cyan: #8ee8ff;
      --mint: #9dffd9;
      --gold: #ffd988;
      --rose: #ff6d96;
      --violet: #cfa8ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(207, 168, 255, 0.24), transparent 34%),
        radial-gradient(circle at 18% 24%, rgba(142, 232, 255, 0.16), transparent 26%),
        radial-gradient(circle at 84% 22%, rgba(255, 109, 150, 0.18), transparent 24%),
        linear-gradient(180deg, var(--bg-top) 0%, #11081d 44%, var(--bg-bottom) 100%);
      color: var(--text);
      font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .shell {
      width: min(100vw, 430px);
      height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      overflow: hidden;
    }

    .panel,
    .hud,
    .controls {
      position: relative;
      z-index: 2;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    }

    .panel {
      padding: 14px 16px 12px;
    }

    .eyebrow {
      margin-bottom: 4px;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(249, 244, 255, 0.66);
    }

    h1 {
      margin: 0;
      font-size: 1.74rem;
      line-height: 1.02;
      letter-spacing: 0.04em;
    }

    .sub {
      margin-top: 8px;
      font-size: 0.92rem;
      line-height: 1.56;
      color: rgba(249, 244, 255, 0.82);
    }

    .hud {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 8px 4px;
      border-radius: 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .label {
      margin-bottom: 4px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(249, 244, 255, 0.56);
    }

    .value {
      font-size: 0.9rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #statusValue.ready {
      color: var(--mint);
    }

    #statusValue.cool {
      color: var(--rose);
    }

    #statusValue.burst {
      color: var(--gold);
    }

    #comboValue.hot {
      color: var(--gold);
    }

    .arena {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 217, 136, 0.08), transparent 20%),
        radial-gradient(circle at 50% 48%, rgba(207, 168, 255, 0.14), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 16%),
        linear-gradient(180deg, rgba(17, 10, 28, 0.98), rgba(6, 5, 12, 1));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 18px 42px rgba(0, 0, 0, 0.3);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(8, 5, 14, 0.18), rgba(8, 5, 14, 0.86));
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 24px;
      background: rgba(15, 10, 24, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.32);
    }

    .overlay-card h2 {
      margin: 0 0 10px;
      font-size: 1.34rem;
    }

    .overlay-card p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.62;
      color: rgba(249, 244, 255, 0.82);
    }

    .tap-note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      background: rgba(10, 7, 17, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(249, 244, 255, 0.86);
      backdrop-filter: blur(8px);
    }

    .controls {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
    }

    button,
    .back-link {
      appearance: none;
      border: none;
      border-radius: 16px;
      min-height: 50px;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    button {
      color: #190f25;
      background: linear-gradient(135deg, var(--cyan), var(--mint));
      box-shadow: 0 12px 24px rgba(142, 232, 255, 0.2);
    }

    button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 1.52rem;
      }

      .sub,
      .overlay-card p {
        font-size: 0.87rem;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .back-link {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Daily Game Factory</div>
      <h1>リフレクトリボン</h1>
      <p class="sub">揺れる角度へ合わせてタップ。斜めの光帯で青い滴だけをまとめて切り取り、赤い棘滴は見送れ。</p>
    </section>

    <section class="hud" aria-label="ゲーム情報">
      <div class="stat">
        <div class="label">Score</div>
        <div class="value" id="scoreValue">0</div>
      </div>
      <div class="stat">
        <div class="label">Time</div>
        <div class="value" id="timeValue">60.0</div>
      </div>
      <div class="stat">
        <div class="label">Best</div>
        <div class="value" id="bestValue">0</div>
      </div>
      <div class="stat">
        <div class="label">Combo</div>
        <div class="value" id="comboValue">x1.0</div>
      </div>
      <div class="stat">
        <div class="label">State</div>
        <div class="value ready" id="statusValue">READY</div>
      </div>
    </section>

    <section class="arena" id="arena">
      <canvas id="gameCanvas" width="390" height="540" aria-label="ゲームキャンバス"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">斜線を通せ</h2>
          <p id="overlayText">エミッターは左右に自動で揺れる。<br />タップで一閃し、青い滴だけをまとめ切り。赤い棘滴を巻き込むと減点。</p>
        </div>
      </div>
      <div class="tap-note">pointerdown: 狙い線の角度で一閃</div>
    </section>

    <section class="controls">
      <button id="startButton" type="button">スタート</button>
      <button id="retryButton" class="secondary" type="button">リトライ</button>
      <a class="back-link" href="../../">戻る</a>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "dailyGame.reflectRibbon.best";
      const PLAY_TIME = 60;
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const arena = document.getElementById("arena");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startButton = document.getElementById("startButton");
      const retryButton = document.getElementById("retryButton");
      const scoreValue = document.getElementById("scoreValue");
      const timeValue = document.getElementById("timeValue");
      const bestValue = document.getElementById("bestValue");
      const comboValue = document.getElementById("comboValue");
      const statusValue = document.getElementById("statusValue");

      const state = {
        running: false,
        score: 0,
        best: Number(localStorage.getItem(STORAGE_KEY) || 0),
        combo: 1,
        timeLeft: PLAY_TIME,
        swing: 0,
        swingDir: 1,
        swingSpeed: 0.9,
        spawnTimer: 0,
        cooldown: 0,
        flash: 0,
        flashAngle: 0,
        hitChain: 0,
        emitterX: 0,
        particles: [],
        sparks: [],
        lastTs: 0
      };

      const resize = () => {
        const rect = arena.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };

      const resetRound = () => {
        state.running = false;
        state.score = 0;
        state.combo = 1;
        state.timeLeft = PLAY_TIME;
        state.swing = 0;
        state.swingDir = 1;
        state.swingSpeed = 0.9;
        state.spawnTimer = 0;
        state.cooldown = 0;
        state.flash = 0;
        state.flashAngle = 0;
        state.hitChain = 0;
        state.particles = [];
        state.sparks = [];
        state.lastTs = 0;
        updateHud();
      };

      const setOverlay = (title, text, hidden) => {
        overlayTitle.textContent = title;
        overlayText.innerHTML = text;
        overlay.classList.toggle("hidden", hidden);
      };

      const updateHud = () => {
        scoreValue.textContent = Math.max(0, Math.round(state.score));
        timeValue.textContent = state.timeLeft.toFixed(1);
        bestValue.textContent = Math.round(state.best);
        comboValue.textContent = "x" + state.combo.toFixed(1);
        comboValue.classList.toggle("hot", state.combo >= 2);

        let label = "READY";
        let statusClass = "ready";
        if (!state.running) {
          label = "WAIT";
          statusClass = "cool";
        } else if (state.flash > 0.02) {
          label = "BURST";
          statusClass = "burst";
        } else if (state.cooldown > 0) {
          label = "COOL";
          statusClass = "cool";
        }

        statusValue.textContent = label;
        statusValue.className = "value " + statusClass;
      };

      const currentStage = () => {
        if (state.timeLeft > 30) {
          return {
            fallMin: 92,
            fallMax: 134,
            drift: 22,
            spawn: 0.58,
            redRate: 0.18,
            swingSpeed: 0.88
          };
        }
        if (state.timeLeft > 15) {
          return {
            fallMin: 116,
            fallMax: 166,
            drift: 36,
            spawn: 0.44,
            redRate: 0.26,
            swingSpeed: 1.12
          };
        }
        return {
          fallMin: 142,
          fallMax: 208,
          drift: 48,
          spawn: 0.32,
          redRate: 0.34,
          swingSpeed: 1.4
        };
      };

      const spawnParticle = () => {
        const stage = currentStage();
        const isBad = Math.random() < stage.redRate;
        const hue = isBad ? 348 + Math.random() * 18 : 188 + Math.random() * 22;
        state.particles.push({
          x: 26 + Math.random() * (canvas.clientWidth - 52),
          y: -18,
          vx: (Math.random() * 2 - 1) * stage.drift,
          vy: stage.fallMin + Math.random() * (stage.fallMax - stage.fallMin),
          radius: isBad ? 8 + Math.random() * 3 : 7 + Math.random() * 4,
          bad: isBad,
          hue,
          phase: Math.random() * Math.PI * 2
        });
      };

      const pushSpark = (x, y, color, count, spread) => {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = spread * (0.4 + Math.random() * 0.8);
          state.sparks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.3 + Math.random() * 0.25,
            color
          });
        }
      };

      const distanceToSegment = (px, py, x1, y1, x2, y2) => {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        if (!len2) {
          return Math.hypot(px - x1, py - y1);
        }
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
        const cx = x1 + dx * t;
        const cy = y1 + dy * t;
        return Math.hypot(px - cx, py - cy);
      };

      const fireRibbon = () => {
        if (!state.running || state.cooldown > 0) {
          return;
        }

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const originX = width * 0.5;
        const originY = height - 48;
        const targetX = width * (0.5 + state.swing * 0.42);
        const targetY = 58;
        let blueHits = 0;
        let redHits = 0;
        const survivors = [];

        for (const particle of state.particles) {
          const dist = distanceToSegment(particle.x, particle.y, originX, originY, targetX, targetY);
          if (dist <= particle.radius + 14) {
            if (particle.bad) {
              redHits += 1;
              pushSpark(particle.x, particle.y, "255,109,150", 10, 60);
            } else {
              blueHits += 1;
              pushSpark(particle.x, particle.y, "142,232,255", 12, 70);
            }
          } else {
            survivors.push(particle);
          }
        }

        state.particles = survivors;
        state.flash = 0.14;
        state.flashAngle = Math.atan2(targetY - originY, targetX - originX);
        state.cooldown = redHits > 0 ? 0.36 : 0.2;

        if (blueHits > 0) {
          state.hitChain += 1;
          state.combo = Math.min(4.5, state.combo + 0.18 * blueHits + (blueHits >= 3 ? 0.12 : 0));
          state.score += blueHits * 10 * state.combo;
        } else {
          state.hitChain = 0;
          state.combo = Math.max(1, state.combo - 0.14);
        }

        if (redHits > 0) {
          state.score = Math.max(0, state.score - redHits * 14);
          state.hitChain = 0;
          state.combo = 1;
        }

        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem(STORAGE_KEY, String(Math.round(state.best)));
        }

        updateHud();
      };

      const drawBackground = (width, height) => {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "rgba(26, 16, 40, 0.94)");
        gradient.addColorStop(1, "rgba(5, 5, 12, 0.98)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < 12; i += 1) {
          const x = ((i * 37) % width) + 10;
          const y = (i * 53) % height;
          ctx.fillStyle = "rgba(255,255,255,0.045)";
          ctx.fillRect(x, y, 1.6, 1.6);
        }
      };

      const drawEmitter = (width, height) => {
        const originX = width * 0.5;
        const originY = height - 48;
        const tipX = width * (0.5 + state.swing * 0.42);
        const tipY = 58;
        state.emitterX = originX;

        ctx.save();
        ctx.strokeStyle = "rgba(207,168,255,0.28)";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 9]);
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        const beam = ctx.createRadialGradient(originX, originY, 4, originX, originY, 28);
        beam.addColorStop(0, "rgba(255,217,136,0.96)");
        beam.addColorStop(0.6, "rgba(142,232,255,0.7)");
        beam.addColorStop(1, "rgba(142,232,255,0)");
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.arc(originX, originY, 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.beginPath();
        ctx.arc(originX, originY, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(25,15,37,0.9)";
        ctx.beginPath();
        ctx.arc(originX, originY, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      const drawRibbon = (width, height) => {
        if (state.flash <= 0) {
          return;
        }
        const originX = width * 0.5;
        const originY = height - 48;
        const length = height * 0.92;
        const endX = originX + Math.cos(state.flashAngle) * length;
        const endY = originY + Math.sin(state.flashAngle) * length;
        const alpha = Math.min(1, state.flash / 0.14);

        ctx.save();
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(255,255,255," + (0.4 * alpha + 0.16) + ")";
        ctx.lineWidth = 18;
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.strokeStyle = "rgba(142,232,255," + (0.82 * alpha) + ")";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255,217,136," + (0.46 * alpha) + ")";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.restore();
      };

      const drawParticles = (dt) => {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;

        for (let i = state.particles.length - 1; i >= 0; i -= 1) {
          const particle = state.particles[i];
          particle.phase += dt * 4;
          particle.x += particle.vx * dt + Math.sin(particle.phase) * 10 * dt;
          particle.y += particle.vy * dt;

          if (particle.x < 14) {
            particle.x = 14;
            particle.vx *= -0.7;
          } else if (particle.x > width - 14) {
            particle.x = width - 14;
            particle.vx *= -0.7;
          }

          if (particle.y > height + 20) {
            state.particles.splice(i, 1);
            state.combo = Math.max(1, state.combo - 0.04);
            continue;
          }

          ctx.save();
          ctx.translate(particle.x, particle.y);
          ctx.rotate(Math.sin(particle.phase) * 0.3);
          const grad = ctx.createRadialGradient(0, -2, 1, 0, 0, particle.radius + 8);
          if (particle.bad) {
            grad.addColorStop(0, "rgba(255,190,210,0.98)");
            grad.addColorStop(0.45, "hsla(" + particle.hue + ", 92%, 68%, 0.96)");
            grad.addColorStop(1, "rgba(255,109,150,0)");
          } else {
            grad.addColorStop(0, "rgba(255,255,255,0.98)");
            grad.addColorStop(0.45, "hsla(" + particle.hue + ", 96%, 72%, 0.96)");
            grad.addColorStop(1, "rgba(142,232,255,0)");
          }
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, particle.radius + 7, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = particle.bad ? "#ff6d96" : "#8ee8ff";
          ctx.beginPath();
          ctx.moveTo(0, -particle.radius - 2);
          ctx.quadraticCurveTo(particle.radius * 0.92, -1, 0, particle.radius + 3);
          ctx.quadraticCurveTo(-particle.radius * 0.92, -1, 0, -particle.radius - 2);
          ctx.fill();
          ctx.restore();
        }
      };

      const drawSparks = (dt) => {
        for (let i = state.sparks.length - 1; i >= 0; i -= 1) {
          const spark = state.sparks[i];
          spark.life -= dt;
          if (spark.life <= 0) {
            state.sparks.splice(i, 1);
            continue;
          }
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          spark.vx *= 0.985;
          spark.vy *= 0.985;
          const alpha = Math.max(0, spark.life / 0.55);
          ctx.fillStyle = "rgba(" + spark.color + "," + alpha + ")";
          ctx.beginPath();
          ctx.arc(spark.x, spark.y, 1.8 + alpha * 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      const step = (ts) => {
        if (!state.lastTs) {
          state.lastTs = ts;
        }
        const dt = Math.min(0.033, (ts - state.lastTs) / 1000);
        state.lastTs = ts;

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        drawBackground(width, height);

        if (state.running) {
          const stage = currentStage();
          state.timeLeft = Math.max(0, state.timeLeft - dt);
          state.swingSpeed = stage.swingSpeed;
          state.swing += dt * state.swingDir * state.swingSpeed;
          if (state.swing > 1) {
            state.swing = 1;
            state.swingDir = -1;
          } else if (state.swing < -1) {
            state.swing = -1;
            state.swingDir = 1;
          }

          state.spawnTimer -= dt;
          while (state.spawnTimer <= 0) {
            spawnParticle();
            state.spawnTimer += stage.spawn * (0.72 + Math.random() * 0.42);
          }

          if (state.cooldown > 0) {
            state.cooldown = Math.max(0, state.cooldown - dt);
          }
          if (state.flash > 0) {
            state.flash = Math.max(0, state.flash - dt);
          }

          drawParticles(dt);
          drawSparks(dt);
          drawEmitter(width, height);
          drawRibbon(width, height);

          if (state.timeLeft <= 0) {
            state.running = false;
            setOverlay(
              "リザルト " + Math.round(state.score),
              "ベスト " + Math.round(state.best) + " 点。<br />スタートかリトライで、次の一閃を通せ。",
              false
            );
          }
        } else {
          drawParticles(dt);
          drawSparks(dt);
          drawEmitter(width, height);
          drawRibbon(width, height);
        }

        updateHud();
        requestAnimationFrame(step);
      };

      const startGame = () => {
        resetRound();
        state.running = true;
        state.spawnTimer = 0.18;
        setOverlay("", "", true);
        updateHud();
      };

      arena.addEventListener("pointerdown", (event) => {
        if (!event.isPrimary) {
          return;
        }
        event.preventDefault();
        if (state.running) {
          fireRibbon();
        }
      });

      startButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        startGame();
      });

      retryButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        startGame();
      });

      window.addEventListener("resize", resize);

      resize();
      resetRound();
      setOverlay("斜線を通せ", "エミッターは左右に自動で揺れる。<br />タップで一閃し、青い滴だけをまとめ切り。赤い棘滴を巻き込むと減点。", false);
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
