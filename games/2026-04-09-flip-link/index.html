<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>フリップリンク</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #070b1a;
      --panel: #111833;
      --line: #243056;
      --text: #e8eeff;
      --good: #58f0c4;
      --bad: #ff5c86;
      --accent: #6eb4ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 10%, #1a2652 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    .app {
      width: min(100vw, 460px);
      height: 100dvh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 10px 12px 14px;
      gap: 10px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      opacity: 0.92;
    }
    .back {
      color: #b7cfff;
      text-decoration: none;
      border: 1px solid #3f5489;
      border-radius: 999px;
      padding: 6px 10px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(22px, 6vw, 30px);
      letter-spacing: 0.04em;
    }
    .hud {
      background: rgba(10, 16, 36, 0.82);
      border: 1px solid #2f426f;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px;
      text-align: center;
      font-size: 12px;
    }
    .hud b { display: block; font-size: 17px; margin-top: 2px; }
    .arena {
      position: relative;
      background: linear-gradient(180deg, rgba(21,31,66,0.88), rgba(9,13,28,0.95));
      border: 1px solid #324573;
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .lane {
      position: relative;
      border-left: 1px solid rgba(132, 170, 255, 0.18);
    }
    .lane:first-child { border-left: none; }
    .lane-mark {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.42;
      letter-spacing: 0.08em;
    }
    .player {
      position: absolute;
      bottom: 16px;
      width: calc((100% - 4px) / 3 - 12px);
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #7cc4ff, #7fffd4);
      box-shadow: 0 0 16px rgba(122, 197, 255, 0.8);
      transition: left 0.08s linear;
      pointer-events: none;
      z-index: 4;
    }
    .drop {
      position: absolute;
      width: 28%;
      max-width: 52px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #091223;
      z-index: 3;
    }
    .drop.good { background: var(--good); box-shadow: 0 0 14px rgba(88,240,196,0.8); }
    .drop.bad { background: var(--bad); color: #260713; box-shadow: 0 0 14px rgba(255,92,134,0.72); }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 6, 15, 0.76);
      display: grid;
      place-items: center;
      z-index: 10;
      padding: 16px;
      text-align: center;
    }
    .panel {
      width: 100%;
      background: #111933;
      border: 1px solid #385082;
      border-radius: 16px;
      padding: 16px 12px;
    }
    .panel p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: #bfd4ff; }
    .btn {
      background: linear-gradient(135deg, #7dbdff, #76ffd4);
      color: #0b1833;
      border: none;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 800;
      padding: 12px 20px;
      min-width: 180px;
    }
    .hint { text-align: center; font-size: 12px; color: #9cb4e9; opacity: 0.9; }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="../../">← 戻る</a>
      <div>60秒 / pointerdown</div>
    </div>

    <h1>フリップリンク</h1>

    <section class="hud">
      <div>Score<b id="score">0</b></div>
      <div>Time<b id="time">60.0</b></div>
      <div>Hi<b id="hi">0</b></div>
      <div>Lane<b id="lane">LEFT</b></div>
    </section>

    <section class="arena" id="arena" aria-label="game area">
      <div class="lane"><div class="lane-mark">LEFT</div></div>
      <div class="lane"><div class="lane-mark">MID</div></div>
      <div class="lane"><div class="lane-mark">RIGHT</div></div>
      <div class="player" id="player"></div>

      <div class="overlay" id="overlay">
        <div class="panel">
          <p>タップでレーンを切り替え、青い <b>LINK</b> を拾って赤い <b>BREAK</b> を避けろ。</p>
          <button class="btn" id="startBtn" type="button">START</button>
        </div>
      </div>
    </section>

    <div class="hint">タップ: 左→中→右→左… に移動</div>
  </main>

<script>
(() => {
  const STORAGE_KEY = 'flip-link-hi-v1';
  const GAME_MS = 60000;
  const arena = document.getElementById('arena');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const playerEl = document.getElementById('player');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const hiEl = document.getElementById('hi');
  const laneEl = document.getElementById('lane');

  const laneNames = ['LEFT', 'MID', 'RIGHT'];
  let lane = 0;
  let score = 0;
  let hi = Number(localStorage.getItem(STORAGE_KEY) || 0);
  let running = false;
  let startTs = 0;
  let lastTs = 0;
  let spawnAcc = 0;
  let speed = 170;
  let spawnMs = 680;
  let badRatio = 0.28;
  let drops = [];

  hiEl.textContent = hi;

  function updatePlayerPos() {
    const w = arena.clientWidth;
    const laneW = w / 3;
    const playerW = playerEl.getBoundingClientRect().width;
    const x = lane * laneW + (laneW - playerW) / 2;
    playerEl.style.left = `${x}px`;
    laneEl.textContent = laneNames[lane];
  }

  function clampDifficulty(elapsedMs) {
    if (elapsedMs < 30000) {
      speed = 170;
      spawnMs = 680;
      badRatio = 0.28;
    } else if (elapsedMs < 45000) {
      speed = 215;
      spawnMs = 520;
      badRatio = 0.34;
    } else {
      speed = 260;
      spawnMs = 430;
      badRatio = 0.4;
    }
  }

  function spawnDrop() {
    const laneIdx = Math.floor(Math.random() * 3);
    const type = Math.random() < badRatio ? 'bad' : 'good';
    const el = document.createElement('div');
    el.className = `drop ${type}`;
    el.textContent = type === 'good' ? 'LINK' : 'BREAK';

    const laneW = arena.clientWidth / 3;
    const x = laneIdx * laneW + laneW * 0.5;
    el.style.left = `calc(${x}px - 14%)`;
    el.style.top = '-44px';

    arena.appendChild(el);
    drops.push({ lane: laneIdx, y: -44, type, el });
  }

  function resetGameState() {
    drops.forEach(d => d.el.remove());
    drops = [];
    lane = 0;
    score = 0;
    scoreEl.textContent = '0';
    timeEl.textContent = '60.0';
    spawnAcc = 0;
    startTs = 0;
    lastTs = 0;
    updatePlayerPos();
  }

  function endGame() {
    running = false;
    if (score > hi) {
      hi = score;
      localStorage.setItem(STORAGE_KEY, String(hi));
      hiEl.textContent = hi;
    }
    overlay.innerHTML = `
      <div class="panel">
        <p>終了！ Score: <b>${score}</b><br>Hi: <b>${hi}</b></p>
        <button class="btn" id="retryBtn" type="button">RETRY</button>
      </div>
    `;
    overlay.style.display = 'grid';
    document.getElementById('retryBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startGame();
    }, { passive: false });
  }

  function tick(ts) {
    if (!running) return;
    if (!startTs) {
      startTs = ts;
      lastTs = ts;
    }
    const dt = ts - lastTs;
    lastTs = ts;

    const elapsed = ts - startTs;
    const leftMs = Math.max(0, GAME_MS - elapsed);
    clampDifficulty(elapsed);

    spawnAcc += dt;
    while (spawnAcc >= spawnMs) {
      spawnAcc -= spawnMs;
      spawnDrop();
      if (Math.random() < 0.22) spawnDrop();
    }

    const h = arena.clientHeight;
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += speed * (dt / 1000);
      d.el.style.top = `${d.y}px`;

      const hitY = h - 44;
      if (d.y >= hitY) {
        if (d.lane === lane) {
          score += d.type === 'good' ? 10 : -12;
          scoreEl.textContent = String(score);
        }
        d.el.remove();
        drops.splice(i, 1);
      }
    }

    timeEl.textContent = (leftMs / 1000).toFixed(1);
    if (leftMs <= 0) {
      endGame();
      return;
    }
    requestAnimationFrame(tick);
  }

  function startGame() {
    resetGameState();
    overlay.style.display = 'none';
    running = true;
    requestAnimationFrame(tick);
  }

  arena.addEventListener('pointerdown', (e) => {
    if (!running) return;
    if (e.target.closest('button,a')) return;
    e.preventDefault();
    lane = (lane + 1) % 3;
    updatePlayerPos();
  }, { passive: false });

  startBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startGame();
  }, { passive: false });

  window.addEventListener('resize', updatePlayerPos);
  updatePlayerPos();
})();
</script>
</body>
</html>
