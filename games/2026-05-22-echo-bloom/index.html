<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>エコーブルーム</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743751614716161" crossorigin="anonymous"></script>
  <style>
    :root{
      --bg1:#0b1020;--bg2:#111936;--panel:rgba(18,24,48,.86);--line:#32426f;--text:#eef3ff;
      --mint:#72f7d6;--cyan:#71b6ff;--rose:#ff5a8a;--gold:#ffd66b;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at top,#1b2550 0%,#0a1020 52%,#060912 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{display:flex;justify-content:center}
    .app{width:min(100vw,480px);height:100%;display:flex;flex-direction:column;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
    h1{margin:0 0 8px;text-align:center;font-size:1.2rem;letter-spacing:.04em}
    .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
    .pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:.75rem;backdrop-filter:blur(8px)}
    .pill .v{display:block;margin-top:2px;font-size:1rem;font-weight:800}
    #field{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:1px solid #3a4a79;background:
      radial-gradient(circle at center,rgba(86,129,255,.18) 0 12%,transparent 13%),
      radial-gradient(circle at center,rgba(255,255,255,.05) 0 62%,transparent 63%),
      linear-gradient(180deg,rgba(18,26,50,.98),rgba(8,12,23,.98));
      box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
    .orbit,.orbit2{position:absolute;inset:10% 10%;border:1px solid rgba(154,180,255,.12);border-radius:50%}
    .orbit2{inset:22% 22%;border-style:dashed}
    #core{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#dbf5ff 0 28%,#78a9ff 29% 55%,rgba(120,169,255,.12) 56% 100%);box-shadow:0 0 25px rgba(109,177,255,.4)}
    .seed,.pulse,.burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
    .seed{width:14px;height:14px;border-radius:50%;box-shadow:0 0 12px currentColor}
    .seed.blue{color:var(--mint);background:radial-gradient(circle at 35% 35%,#ecfffd 0 26%,#7ef4dc 27% 60%,#2aa888 61% 100%)}
    .seed.red{color:var(--rose);background:radial-gradient(circle at 35% 35%,#fff0f4 0 24%,#ff7da3 25% 60%,#a31a48 61% 100%)}
    .pulse{width:10px;height:10px;border-radius:50%;border:3px solid rgba(114,247,214,.9);box-shadow:0 0 16px rgba(114,247,214,.45)}
    .burst{width:18px;height:18px;border-radius:50%;opacity:.95}
    .burst.good{background:radial-gradient(circle,rgba(255,255,255,.98) 0 25%,rgba(114,247,214,.85) 26% 58%,rgba(114,247,214,0) 70%)}
    .burst.bad{background:radial-gradient(circle,rgba(255,255,255,.95) 0 18%,rgba(255,90,138,.88) 19% 54%,rgba(255,90,138,0) 70%)}
    .burst.center{background:radial-gradient(circle,rgba(255,255,255,.95) 0 18%,rgba(255,214,107,.88) 19% 56%,rgba(255,214,107,0) 72%)}
    #hint{font-size:.84rem;text-align:center;min-height:1.25em;margin-top:8px;color:#bfd0ff}
    .controls{display:flex;gap:8px;margin-top:10px}
    button,a{flex:1;min-height:44px;border:none;border-radius:12px;background:linear-gradient(180deg,#1a254c,#101834);color:var(--text);font-weight:800;text-decoration:none;display:flex;justify-content:center;align-items:center;border:1px solid #425487;box-shadow:0 8px 20px rgba(0,0,0,.18)}
    button:active,a:active{transform:translateY(1px)}
    .flash{animation:flash .22s ease-out}
    @keyframes flash{0%{filter:brightness(1)}50%{filter:brightness(1.5)}100%{filter:brightness(1)}}
  </style>
</head>
<body>
<div class="app">
  <h1>エコーブルーム</h1>
  <div class="hud">
    <div class="pill">SCORE<span id="score" class="v">0</span></div>
    <div class="pill">TIME<span id="time" class="v">60.0</span></div>
    <div class="pill">HI<span id="hi" class="v">0</span></div>
    <div class="pill">CHAIN<span id="chain" class="v">0</span></div>
  </div>
  <div id="field" aria-label="game field">
    <div class="orbit"></div><div class="orbit2"></div><div id="core"></div>
  </div>
  <div id="hint">STARTで開始。画面タップで衝撃波を放つ。</div>
  <div class="controls"><button id="start">START</button><a href="../../">戻る</a></div>
</div>
<script>
(()=>{
  const KEY='wg_hi_echo_bloom';
  const field=document.getElementById('field');
  const scoreEl=document.getElementById('score');
  const timeEl=document.getElementById('time');
  const hiEl=document.getElementById('hi');
  const chainEl=document.getElementById('chain');
  const hint=document.getElementById('hint');
  const startBtn=document.getElementById('start');

  let hi=Number(localStorage.getItem(KEY)||0); hiEl.textContent=hi;
  let running=false, score=0, chain=0, elapsed=0, prev=0, spawnAcc=0, pulseCd=0, raf=0;
  let seeds=[], pulses=[], bursts=[];
  const fieldSize=()=>Math.min(field.clientWidth, field.clientHeight);
  const maxRadius=()=>fieldSize()*0.46;
  const center=()=>({x:field.clientWidth/2,y:field.clientHeight/2});
  const difficulty=()=> elapsed<30
    ? {speed:78, interval:0.72, red:0.18, maxSpawn:1, cooldown:0.34}
    : elapsed<45
      ? {speed:95, interval:0.56, red:0.28, maxSpawn:2, cooldown:0.38}
      : {speed:112, interval:0.44, red:0.36, maxSpawn:2, cooldown:0.42};

  function setHint(text){ hint.textContent=text; }
  function clearEntities(){ [...seeds,...pulses,...bursts].forEach(o=>o.el?.remove()); seeds=[]; pulses=[]; bursts=[]; }
  function updateHud(timeLeft){ scoreEl.textContent=score; chainEl.textContent=chain; timeEl.textContent=timeLeft.toFixed(1); hiEl.textContent=hi; }
  function reset(){
    clearEntities(); running=false; score=0; chain=0; elapsed=0; prev=0; spawnAcc=0; pulseCd=0; updateHud(60);
    setHint('STARTで開始。画面タップで衝撃波を放つ。'); startBtn.textContent='START';
  }
  function burstAt(x,y,type){
    const el=document.createElement('div'); el.className='burst '+type;
    field.appendChild(el); const obj={x,y,life:0.32,age:0,el}; bursts.push(obj); position(obj,18,1);
  }
  function position(obj,size,scale=1){ obj.el.style.width=(size*scale)+'px'; obj.el.style.height=(size*scale)+'px'; obj.el.style.left=obj.x+'px'; obj.el.style.top=obj.y+'px'; }
  function spawnSeed(){
    const count=1 + (Math.random()<0.22 && difficulty().maxSpawn>1 ? 1 : 0);
    const c=center();
    for(let i=0;i<count;i++){
      const ang=Math.random()*Math.PI*2;
      const r=maxRadius()+18+Math.random()*18;
      const red=Math.random()<difficulty().red;
      const el=document.createElement('div');
      el.className='seed '+(red?'red':'blue');
      field.appendChild(el);
      const seed={x:c.x+Math.cos(ang)*r,y:c.y+Math.sin(ang)*r,vx:-Math.cos(ang),vy:-Math.sin(ang),speed:difficulty().speed*(0.9+Math.random()*0.24),red,el,hit:false};
      seeds.push(seed); position(seed,14,1);
    }
  }
  function firePulse(){
    if(!running || pulseCd>0) return;
    const el=document.createElement('div'); el.className='pulse'; field.appendChild(el);
    const c=center(); pulses.push({x:c.x,y:c.y,r:10,speed:maxRadius()/0.52,life:0.55,age:0,el,hitSet:new Set()});
    pulseCd=difficulty().cooldown;
    field.classList.remove('flash'); void field.offsetWidth; field.classList.add('flash');
    burstAt(c.x,c.y,'center');
  }
  function endGame(){
    running=false; cancelAnimationFrame(raf);
    if(score>hi){ hi=score; localStorage.setItem(KEY,String(hi)); }
    updateHud(0); startBtn.textContent='REPLAY'; setHint('終了。タイミングで青を咲かせろ。REPLAYで再挑戦。');
  }
  function tick(ts){
    if(!running) return;
    if(!prev) prev=ts;
    const dt=Math.min(0.033,(ts-prev)/1000); prev=ts; elapsed+=dt; pulseCd=Math.max(0,pulseCd-dt);
    const timeLeft=Math.max(0,60-elapsed); if(timeLeft<=0){ endGame(); return; }
    spawnAcc+=dt;
    const diff=difficulty();
    while(spawnAcc>=diff.interval){ spawnAcc-=diff.interval; spawnSeed(); }

    seeds.forEach(seed=>{
      seed.x+=seed.vx*seed.speed*dt; seed.y+=seed.vy*seed.speed*dt; position(seed,14,1);
      const c=center(); const dist=Math.hypot(seed.x-c.x,seed.y-c.y);
      if(dist<18 && !seed.hit){ seed.hit=true; chain=0; burstAt(seed.x,seed.y, seed.red?'bad':'center'); }
    });

    pulses.forEach(pulse=>{
      pulse.age+=dt; pulse.r+=pulse.speed*dt;
      const scale=(pulse.r*2)/10;
      pulse.el.style.left=pulse.x+'px'; pulse.el.style.top=pulse.y+'px';
      pulse.el.style.transform='translate(-50%,-50%) scale('+scale+')';
      pulse.el.style.opacity=String(Math.max(0,1-pulse.age/pulse.life));
      seeds.forEach(seed=>{
        if(seed.hit || pulse.hitSet.has(seed)) return;
        const d=Math.hypot(seed.x-pulse.x,seed.y-pulse.y);
        if(Math.abs(d-pulse.r)<18){
          pulse.hitSet.add(seed); seed.hit=true;
          if(seed.red){ score=Math.max(0,score-15); chain=0; burstAt(seed.x,seed.y,'bad'); setHint('赤を巻き込んだ。チェイン切断。'); }
          else { chain++; score+=12+Math.min(chain,9); burstAt(seed.x,seed.y,'good'); setHint(chain>=6?'綺麗に繋がっている。':'青を咲かせた。'); }
        }
      });
    });

    bursts.forEach(b=>{ b.age+=dt; const p=b.age/b.life; position(b,18,1+p*2.7); b.el.style.opacity=String(1-p); });

    seeds=seeds.filter(seed=>{ if(seed.hit){ seed.el.remove(); return false; } return true; });
    pulses=pulses.filter(p=>{ if(p.age>=p.life || p.r>maxRadius()+30){ p.el.remove(); return false; } return true; });
    bursts=bursts.filter(b=>{ if(b.age>=b.life){ b.el.remove(); return false; } return true; });

    if(score>hi) hi=score;
    updateHud(timeLeft);
    raf=requestAnimationFrame(tick);
  }

  function startGame(){ clearEntities(); running=true; score=0; chain=0; elapsed=0; prev=0; spawnAcc=0; pulseCd=0; updateHud(60); startBtn.textContent='PLAYING'; setHint('青を狙い、赤は避ける。タップでパルス。'); raf=requestAnimationFrame(tick); }

  field.addEventListener('pointerdown',e=>{ e.preventDefault(); if(running) firePulse(); },{passive:false});
  document.body.addEventListener('pointerdown',e=>{
    if(e.target===startBtn || e.target.closest('a')) return;
    if(running){ e.preventDefault(); firePulse(); }
  },{passive:false});
  startBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); startGame(); },{passive:false});
  reset();
})();
</script>
</body>
</html>
