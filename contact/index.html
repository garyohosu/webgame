<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>お問い合わせ | Daily Game Factory</title>
  <meta name="description" content="Daily Game Factory のお問い合わせ先">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0a0a1a;
      --bg1: #0f0c29;
      --accent1: #7ee8fa;
      --accent2: #ffd200;
      --card-bg: rgba(255,255,255,0.05);
      --card-border: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #e8e8f0;
      background:
        radial-gradient(circle at top, rgba(126,232,250,0.08), transparent 30%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      font-family: 'Noto Sans JP', sans-serif;
    }
    .shell { max-width: 840px; margin: 0 auto; padding: 32px 20px 64px; }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 40px; }
    .brand { color: var(--accent1); text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 0.08em; }
    .nav-links { display: flex; gap: 16px; flex-wrap: wrap; }
    .nav-links a { color: #bfc8ff; text-decoration: none; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(10px);
      line-height: 1.9;
    }
    h1 { margin: 0 0 16px; font-family: 'Orbitron', sans-serif; font-size: clamp(1.8rem, 6vw, 3rem); color: var(--accent1); }
    p, li { color: #e8e8f0; }
    ul { padding-left: 1.25rem; }
    a { color: var(--accent2); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="nav">
      <a class="brand" href="../">DAILY GAME FACTORY</a>
      <div class="nav-links">
        <a href="../">Home</a>
        <a href="https://github.com/garyohosu/webgame">GitHub</a>
      </div>
    </div>

    <div class="card">
      <p style="letter-spacing:0.18em;color:#9aa5ff;text-transform:uppercase;font-size:12px;">Contact</p>
      <h1>お問い合わせ</h1>
      <p>Daily Game Factory へのお問い合わせは X または GitHub からお願いします。</p>
      <ul>
        <li><a href="https://x.com/hantani">X: @hantani</a></li>
        <li><a href="https://github.com/garyohosu/webgame">GitHub: garyohosu/webgame</a></li>
      </ul>
      <p>すべてのメッセージに返信できるとは限りません。返信を保証するものではありません。</p>
      <p>営業・宣伝に関するご連絡には返信しない場合があります。不具合報告や公開内容に関するご連絡は、GitHub から送っていただくと確認しやすくなります。</p>
    </div>
  </div>
</body>
</html>
